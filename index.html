/* =========================================================
   NGĂN "CÔNG THỨC HÓA HỌC" (mặc định ẩn)
   Sửa văn bản có công thức bị lỗi (vd. $CO_2$, \text{CH}_4, \ce{H2O}, CO2, Fe3+, m2 g-1)
   thành chữ có chỉ số dưới/trên thật để dán vào Word; soạn nhanh bằng nút; xuất LaTeX sạch và file .docx.
   Chạy hoàn toàn trên trình duyệt, bằng quy tắc (không dùng AI).
   ========================================================= */
const CF_EL = new Set(("H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og").split(" "));
const CF_STOP = new Set(["B2B", "B2C", "C2C", "P2P", "PS4", "PS5", "MP3", "MP4", "Y2K", "H1N1", "H5N1", "O2O"]);
const CF_SUB = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "+": "₊", "-": "₋", "−": "₋", "=": "₌", "(": "₍", ")": "₎",
  a: "ₐ", e: "ₑ", h: "ₕ", i: "ᵢ", j: "ⱼ", k: "ₖ", l: "ₗ", m: "ₘ", n: "ₙ", o: "ₒ", p: "ₚ", r: "ᵣ", s: "ₛ", t: "ₜ", u: "ᵤ", v: "ᵥ", x: "ₓ" };
const CF_SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "+": "⁺", "-": "⁻", "−": "⁻", "=": "⁼", "(": "⁽", ")": "⁾",
  a: "ᵃ", b: "ᵇ", c: "ᶜ", d: "ᵈ", e: "ᵉ", f: "ᶠ", g: "ᵍ", h: "ʰ", i: "ⁱ", j: "ʲ", k: "ᵏ", l: "ˡ", m: "ᵐ", n: "ⁿ", o: "ᵒ", p: "ᵖ", r: "ʳ", s: "ˢ", t: "ᵗ", u: "ᵘ", v: "ᵛ", w: "ʷ", x: "ˣ", y: "ʸ", z: "ᶻ" };
const CF_CMD = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε", zeta: "ζ", eta: "η", theta: "θ", lambda: "λ", mu: "µ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ", phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω",
  Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π", Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω",
  rightarrow: "→", to: "→", longrightarrow: "→", leftarrow: "←", leftrightarrow: "↔", Rightarrow: "⇒", Leftarrow: "⇐", Leftrightarrow: "⇔", rightleftharpoons: "⇌", leftrightarrows: "⇄", uparrow: "↑", downarrow: "↓",
  times: "×", cdot: "·", pm: "±", mp: "∓", approx: "≈", neq: "≠", ne: "≠", leq: "≤", le: "≤", geq: "≥", ge: "≥", infty: "∞", circ: "°", degree: "°", sim: "∼", propto: "∝", partial: "∂", nabla: "∇",
  sum: "∑", int: "∫", prod: "∏", AA: "Å", angstrom: "Å", ldots: "…", dots: "…", cdots: "⋯", bullet: "•", ll: "≪", gg: "≫", equiv: "≡", cdotp: "·", textdegree: "°", permil: "‰", lt: "<", gt: ">" };
const CF_ARROWS = new Set(["rightarrow", "to", "longrightarrow", "leftarrow", "leftrightarrow", "Rightarrow", "Leftarrow", "Leftrightarrow", "rightleftharpoons", "leftrightarrows"]);
const CF_REV = {};
Object.keys(CF_CMD).forEach((k) => { if (!CF_REV[CF_CMD[k]]) CF_REV[CF_CMD[k]] = "\\" + k + " "; });
CF_REV["°"] = "^{\\circ}"; CF_REV["×"] = "\\times "; CF_REV["µ"] = "\\mu "; CF_REV["μ"] = "\\mu "; CF_REV["→"] = "\\rightarrow "; CF_REV["·"] = "\\cdot ";

function cfSupText(s) { return String(s).replace(/-/g, "\u2212"); }

/* ---- Phân tích một công thức hóa học dạng chữ: CO2, SO42-, Fe3+, Ca(OH)2, CuSO4.5H2O, (Co,Cr,Fe)3O4 ... ---- */
function cfChemParse(tok, force) {
  if (!force && CF_STOP.has(tok)) return null;
  let body = tok, charge = null, coef = "";
  const c0 = body.match(/^(\d+)(?=[A-Z(\[])/);
  if (c0) { coef = c0[1]; body = body.slice(coef.length); }
  const mc = body.match(/^(.*?)\^(\{[^}]*\}|\d*[+\-−])$/);
  if (mc && mc[1]) { body = mc[1]; charge = mc[2].replace(/[{}]/g, ""); }
  else {
    const m2 = body.match(/^(.*?)(\d*)([+\-−])$/);
    if (m2 && m2[1]) {
      let pre = m2[1]; const d = m2[2], sg = m2[3];
      if (d.length >= 2) { charge = d.slice(-1) + sg; pre += d.slice(0, -1); }
      else if (d.length === 1) {
        if (/^[A-Z][a-z]?$/.test(pre) && CF_EL.has(pre)) charge = d + sg;
        else { pre += d; charge = sg; }
      } else charge = sg;
      body = pre;
    }
  }
  if (!body) return null;
  const runs = [];
  if (coef) runs.push({ s: coef });
  let i = 0, evidence = !!charge, depth = 0, atoms = 0;
  const subDigits = () => {
    const dm = body.slice(i).match(/^\d+/);
    if (!dm) return true;
    if (dm[0] === "1") return false;
    runs.push({ s: dm[0], d: "sub" }); i += dm[0].length; evidence = true; return true;
  };
  while (i < body.length) {
    const ch = body[i];
    if (/[A-Z]/.test(ch)) {
      let sym = ch;
      if (/[a-z]/.test(body[i + 1] || "")) sym += body[i + 1];
      if (!CF_EL.has(sym)) { if (sym.length === 2 && CF_EL.has(ch)) sym = ch; else return null; }
      if (/[a-z]/.test(body[i + sym.length] || "")) return null;
      runs.push({ s: sym }); i += sym.length; atoms++;
      if (!subDigits()) return null;
    } else if (ch === "(" || ch === "[") { runs.push({ s: ch }); i++; depth++; evidence = true; }
    else if (ch === ")" || ch === "]") {
      if (depth <= 0) return null;
      runs.push({ s: ch }); i++; depth--;
      if (!subDigits()) return null;
    } else if (ch === "," && depth > 0) { runs.push({ s: "," }); i++; }
    else if (/[.·*]/.test(ch)) {
      if (i === 0 || i === body.length - 1) return null;
      runs.push({ s: "·" }); i++;
      const cm = body.slice(i).match(/^\d+/);
      if (cm) { runs.push({ s: cm[0] }); i += cm[0].length; }
      if (!/[A-Z(\[]/.test(body[i] || "")) return null;
      evidence = true;
    } else return null;
  }
  if (depth !== 0 || !atoms) return null;
  if (!force) {
    if (!evidence) return null;
    const onlyOne = runs.filter((r) => !r.d && /^[A-Z][a-z]?$/.test(r.s)).length === 1 && runs.every((r) => r.d || /^[A-Z][a-z]?$/.test(r.s) || r.s === coef);
    if (onlyOne && !runs.some((r) => r.d === "sub")) {
      const sym = runs.find((r) => /^[A-Z][a-z]?$/.test(r.s)).s;
      if (sym.length === 1 && !["H", "O", "N", "S", "F"].includes(sym)) return null;
    }
  }
  if (charge) runs.push({ s: cfSupText(charge), d: "sup" });
  return runs;
}

/* Quét văn bản thường, tìm các cụm trông như công thức hóa học */
function cfAutoChem(str, force) {
  const segs = []; let buf = "", i = 0;
  const flush = () => { if (buf) { segs.push({ k: "t", s: buf }); buf = ""; } };
  const isAl = (ch) => /[\p{L}\p{N}]/u.test(ch);
  while (i < str.length) {
    const ch = str[i], prev = i > 0 ? str[i - 1] : "";
    if (/[A-Z(\[\d]/.test(ch) && !(prev && isAl(prev))) {
      let j = i;
      while (j < str.length && j - i < 80 && /[A-Za-z0-9()\[\],·.*^{}+\-−]/.test(str[j])) j++;
      let cand = str.slice(i, j), hit = null;
      while (cand.length) {
        const next = str[i + cand.length] || "";
        if (!isAl(next)) { const runs = cfChemParse(cand, force); if (runs) { hit = { len: cand.length, runs }; break; } }
        cand = cand.slice(0, -1);
      }
      if (hit) { flush(); segs.push({ k: "f", r: hit.runs, chem: true, src: str.slice(i, i + hit.len) }); i += hit.len; continue; }
    }
    buf += ch; i++;
  }
  flush();
  return segs;
}

/* ---- Đơn vị và số mũ: m2 g-1 -> m² g⁻¹, x10-3 -> ×10⁻³ ---- */
const CF_UNIT_POS = new Set(["m", "cm", "mm", "nm", "µm", "μm"]);
function cfUnits(text) {
  const segs = []; let last = 0;
  const re = /(?<![\p{L}\p{N}_^])(?:([×x])\s?10\^?(-?\d{1,2})(?![\p{L}\p{N}.,])|(µm|μm|mmol|kJ|mol|mg|kg|µg|mL|mA|mV|min|cm|mm|nm|Hz|eV|m|g|L|s|h|A|V|W|K|J)(-?[1-3])(?![\p{L}\p{N}]))/gu;
  let m;
  while ((m = re.exec(text))) {
    if (m[1]) {
      if (m.index > last) segs.push({ k: "t", s: text.slice(last, m.index) });
      segs.push({ k: "f", r: [{ s: "×10" }, { s: cfSupText(m[2]), d: "sup" }], chem: false, unit: true });
    } else {
      const unit = m[3], exp = m[4];
      if (!(exp.startsWith("-") || CF_UNIT_POS.has(unit))) continue;
      if (m.index > last) segs.push({ k: "t", s: text.slice(last, m.index) });
      segs.push({ k: "f", r: [{ s: unit }, { s: cfSupText(exp), d: "sup" }], chem: false, unit: true });
    }
    last = m.index + m[0].length;
  }
  if (last < text.length) segs.push({ k: "t", s: text.slice(last) });
  return segs.length ? segs : [{ k: "t", s: text }];
}

/* ---- Phân tích LaTeX: CO_2, \text{CH}_4, \mathrm{SO_4^{2-}}, \ce{H2O}, \rightarrow ... ---- */
function cfMerge(runs) {
  const out = [];
  runs.forEach((r) => { if (!r.s) return; const l = out[out.length - 1]; if (l && l.d === r.d) l.s += r.s; else out.push({ s: r.s, d: r.d }); });
  return out;
}
function cfTex(src, notes) {
  notes = notes || { complex: 0, unknown: [], ce: 0 };
  const matchBrace = (s, i) => {
    let depth = 0;
    for (let k = i; k < s.length; k++) { if (s[k] === "\\") { k++; continue; } if (s[k] === "{") depth++; else if (s[k] === "}") { depth--; if (!depth) return k; } }
    return -1;
  };
  const readArg = (s, i) => {
    while (s[i] === " ") i++;
    if (s[i] === "{") { const j = matchBrace(s, i); return j < 0 ? [s.slice(i + 1), s.length] : [s.slice(i + 1, j), j + 1]; }
    if (s[i] === "\\") {
      const m = s.slice(i).match(/^\\([A-Za-z]+|[\s\S])/); let ni = i + m[0].length;
      if (/^\\[A-Za-z]+$/.test(m[0])) while (s[ni] === " ") ni++;
      return [m[0], ni];
    }
    return [s[i] || "", i + 1];
  };
  const STYLE = new Set(["text", "mathrm", "textrm", "mathbf", "textbf", "mathit", "textit", "mathsf", "boldsymbol", "bm", "rm", "operatorname", "mathcal", "mathbb", "underline", "overline", "emph", "mbox", "hbox"]);
  const SKIP1 = new Set(["hspace", "vspace", "kern", "label", "tag"]);
  const parse = (s) => {
    const res = []; let i = 0;
    const add = (t, d) => { if (t) res.push({ s: d === "sup" ? cfSupText(t) : t, d }); };
    while (i < s.length) {
      const c = s[i];
      if (c === "\\") {
        const m = s.slice(i + 1).match(/^([A-Za-z]+|[\s\S])/);
        if (!m) { i++; continue; }
        const name = m[1]; i += 1 + name.length;
        if (/^[A-Za-z]+$/.test(name)) while (s[i] === " ") i++;
        if (CF_ARROWS.has(name)) add(" " + CF_CMD[name] + " ");
        else if (STYLE.has(name)) { const [a, ni] = readArg(s, i); i = ni; parse(a).forEach((r) => add(r.s, r.d)); }
        else if (name === "ce") { const [a, ni] = readArg(s, i); i = ni; notes.ce++; cfCeRuns(a).forEach((r) => add(r.s, r.d)); }
        else if (name === "frac" || name === "dfrac" || name === "tfrac") {
          const [a, i1] = readArg(s, i), [b, i2] = readArg(s, i1); i = i2; notes.complex++;
          const A = parse(a).map((r) => r.s).join(""), B = parse(b).map((r) => r.s).join("");
          add((A.length > 1 ? "(" + A + ")" : A) + "/" + (B.length > 1 ? "(" + B + ")" : B));
        } else if (name === "sqrt") {
          if (s[i] === "[") { const j = s.indexOf("]", i); i = j < 0 ? s.length : j + 1; }
          const [a, ni] = readArg(s, i); i = ni; notes.complex++; add("√(" + parse(a).map((r) => r.s).join("") + ")");
        } else if (name === "left" || name === "right") { if (s[i] === ".") i++; }
        else if (SKIP1.has(name)) { const [, ni] = readArg(s, i); i = ni; }
        else if (name === "begin" || name === "end") { const [, ni] = readArg(s, i); i = ni; notes.complex++; }
        else if (name === "\\" ) add("\n");
        else if (CF_CMD[name]) add(CF_CMD[name]);
        else if (name === "," || name === ";" || name === ":" || name === " " || name === "quad" || name === "qquad") add(" ");
        else if (name === "!") { /* bỏ */ }
        else if (/^[%$_&#{}]$/.test(name)) add(name);
        else { notes.unknown.push(name); add(name); }
      } else if (c === "_" || c === "^") {
        const d = c === "_" ? "sub" : "sup"; i++;
        const [a, ni] = readArg(s, i); i = ni;
        const t = parse(a).map((r) => r.s).join("");
        if (d === "sup" && (t === "°" || t === "∘")) add("°"); else add(t, d);
      } else if (c === "{") {
        const j = matchBrace(s, i);
        const inner = j < 0 ? s.slice(i + 1) : s.slice(i + 1, j); i = j < 0 ? s.length : j + 1;
        parse(inner).forEach((r) => add(r.s, r.d));
      } else if (c === "}") i++;
      else if (c === "~") { add(" "); i++; }
      else { add(c); i++; }
    }
    return cfMerge(res).map((r) => (r.d ? r : { s: r.s.replace(/ {2,}/g, " "), d: r.d }));
  };
  const runs = parse(String(src));
  if (runs.length) { runs[0].s = runs[0].s.replace(/^\s+/, ""); runs[runs.length - 1].s = runs[runs.length - 1].s.replace(/\s+$/, ""); }
  return runs.filter((r) => r.s);
}
function cfCeRuns(arg) {
  const t = String(arg).replace(/<=>|<-->/g, "⇌").replace(/<->/g, "↔").replace(/-->|->/g, "→");
  const runs = [];
  cfAutoChem(t, true).forEach((g) => { if (g.k === "t") runs.push({ s: g.s }); else g.r.forEach((r) => runs.push(r)); });
  return cfMerge(runs);
}

/* ---- Hàm chính: văn bản bị lỗi -> các đoạn (text / công thức) ---- */
function cfFix(text, opts) {
  opts = Object.assign({ auto: true, units: true, arrows: true }, opts || {});
  const src = String(text).replace(/\r/g, "");
  const notes = { complex: 0, unknown: [], ce: 0, math: 0, auto: 0, units: 0 };
  const segs = [];
  const plain = (s) => {
    if (!s) return;
    let t = s;
    if (opts.arrows) t = t.replace(/<=>|<-->|⇌/g, "⇌").replace(/<->/g, "↔").replace(/-->|->/g, "→");
    const parts = opts.auto ? cfAutoChem(t, false) : [{ k: "t", s: t }];
    parts.forEach((p) => {
      if (p.k === "f") { notes.auto++; segs.push(p); }
      else if (opts.units) cfUnits(p.s).forEach((u) => { if (u.k === "f") notes.units++; segs.push(u); });
      else segs.push(p);
    });
  };
  const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=\S)([^$\n]*?\S)\$/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    plain(src.slice(last, m.index));
    const inner = m[1] || m[2] || m[3] || m[4];
    const runs = cfTex(inner, notes);
    notes.math++;
    if (runs.length) segs.push({ k: "f", r: runs, chem: !!(notes.ce && /\\ce\s*\{/.test(inner)), src: inner, tex: true });
    last = m.index + m[0].length;
  }
  plain(src.slice(last));
  return { segs, notes };
}

/* ---- Xuất kết quả: HTML (chỉ số dưới/trên thật), Unicode, LaTeX, .docx ---- */
function cfHtml(segs) {
  const one = (r) => { const t = rbkEsc(r.d === "sup" ? cfSupText(r.s) : r.s); return r.d === "sub" ? "<sub>" + t + "</sub>" : r.d === "sup" ? "<sup>" + t + "</sup>" : t; };
  let h = "";
  segs.forEach((g) => { h += g.k === "t" ? rbkEsc(g.s) : g.r.map(one).join(""); });
  return h.replace(/\n/g, "<br>");
}
function cfUniChars(s, d) {
  const map = d === "sub" ? CF_SUB : CF_SUP; let o = "", lossy = false;
  for (const ch of s) { if (map[ch]) o += map[ch]; else { o += ch; if (ch !== " ") lossy = true; } }
  return { s: o, lossy };
}
function cfUni(segs) {
  let out = "", lossy = 0;
  segs.forEach((g) => {
    if (g.k === "t") { out += g.s; return; }
    g.r.forEach((r) => { if (!r.d) out += r.s; else { const u = cfUniChars(r.s, r.d); out += u.s; if (u.lossy) lossy++; } });
  });
  return { text: out, lossy };
}
function cfTexEsc(t) {
  const SP = { "%": "\\%", "&": "\\&", "#": "\\#", "_": "\\_", "{": "\\{", "}": "\\}", "$": "\\$", " ": "\\ ", "\n": " " };
  return Array.from(t).map((ch) => CF_REV[ch] || SP[ch] || ch).join("");
}
function cfTexMath(runs, rm) {
  const body = runs.map((r) => r.d === "sub" ? "_{" + cfTexEsc(r.s) + "}" : r.d === "sup" ? "^{" + cfTexEsc(r.s.replace(/\u2212/g, "-")) + "}" : cfTexEsc(r.s)).join("");
  return rm ? "\\mathrm{" + body + "}" : body;
}
function cfCeStr(runs) { return runs.map((r) => (r.d === "sup" ? "^{" + r.s.replace(/\u2212/g, "-") + "}" : r.s)).join(""); }
function cfLatexFull(segs, mode) {
  return segs.map((g) => {
    if (g.k === "t") return g.s;
    return "$" + (mode === "ce" && g.chem ? "\\ce{" + cfCeStr(g.r) + "}" : cfTexMath(g.r, true)) + "$";
  }).join("");
}
function cfFormulaList(segs) {
  const seen = new Set(), list = [];
  segs.forEach((g) => {
    if (g.k !== "f") return;
    const html = cfHtml([g]);
    if (seen.has(html) || list.length >= 60) return;
    seen.add(html);
    list.push({ html, mathrm: cfTexMath(g.r, true), plain: cfTexMath(g.r, false), uni: cfUni([g]).text });
  });
  return list;
}

/* ---- .docx: chỉ số dưới/trên thật, hoặc phương trình (OMML) ---- */
function cfXmlEsc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function cfMergeForEq(segs) {
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    const g = segs[i];
    if (g.k !== "f") { out.push(g); continue; }
    let runs = g.r.slice();
    while (i + 2 < segs.length && segs[i + 1].k === "t" && /^[ \t]*[+=\-−→⇌↔⇒·][ \t]*$/.test(segs[i + 1].s) && segs[i + 2].k === "f") {
      runs.push({ s: segs[i + 1].s }); runs = runs.concat(segs[i + 2].r); i += 2;
    }
    out.push({ k: "f", r: cfMerge(runs) });
  }
  return out;
}
function cfOmml(runs) {
  const FONT = '<w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr>';
  const mr = (t) => '<m:r><m:rPr><m:sty m:val="p"/></m:rPr>' + FONT + '<m:t xml:space="preserve">' + cfXmlEsc(t) + "</m:t></m:r>";
  const script = (base, sub, sup) => {
    const e = "<m:e>" + mr(base) + "</m:e>";
    if (sub !== null && sup !== null) return "<m:sSubSup>" + e + "<m:sub>" + mr(sub) + "</m:sub><m:sup>" + mr(sup) + "</m:sup></m:sSubSup>";
    if (sub !== null) return "<m:sSub>" + e + "<m:sub>" + mr(sub) + "</m:sub></m:sSub>";
    return "<m:sSup>" + e + "<m:sup>" + mr(sup) + "</m:sup></m:sSup>";
  };
  let out = "";
  for (let i = 0; i < runs.length; i++) {
    const r = runs[i], nx = runs[i + 1];
    if (!r.d && nx && nx.d) {
      const mm = r.s.match(/^([\s\S]*?)([A-Z][a-z]?|[\s\S])$/);
      if (mm[1]) out += mr(mm[1]);
      let sub = null, sup = null, j = i + 1;
      while (j < runs.length && runs[j].d && !(runs[j].d === "sub" && sub !== null) && !(runs[j].d === "sup" && sup !== null)) {
        if (runs[j].d === "sub") sub = runs[j].s; else sup = cfSupText(runs[j].s);
        j++;
      }
      out += script(mm[2], sub, sup);
      i = j - 1;
    } else out += mr(r.s);
  }
  return "<m:oMath>" + out + "</m:oMath>";
}
function cfLoadJSZip() {
  return window.JSZip ? Promise.resolve() : rbkLoadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
}
async function cfBuildDocx(segs, mode) {
  await cfLoadJSZip();
  const rp = (extra) => '<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="26"/><w:szCs w:val="26"/>' + (extra || "") + "</w:rPr>";
  const wr = (t, extra) => "<w:r>" + rp(extra) + '<w:t xml:space="preserve">' + cfXmlEsc(t) + "</w:t></w:r>";
  const list = mode === "eq" ? cfMergeForEq(segs) : segs;
  const paras = [""];
  const put = (x) => { paras[paras.length - 1] += x; };
  list.forEach((g) => {
    if (g.k === "t") {
      g.s.split("\n").forEach((line, j) => { if (j > 0) paras.push(""); if (line) put(wr(line)); });
    } else if (mode === "eq") put(cfOmml(g.r));
    else g.r.forEach((r) => put(wr(r.d === "sup" ? cfSupText(r.s) : r.s, r.d === "sub" ? '<w:vertAlign w:val="subscript"/>' : r.d === "sup" ? '<w:vertAlign w:val="superscript"/>' : "")));
  });
  const body = paras.map((p) => '<w:p><w:pPr><w:spacing w:after="120"/></w:pPr>' + p + "</w:p>").join("");
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><w:body>' + body +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const zip = new window.JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml", doc);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}
function cfDownloadBlob(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;

/* ---- Sao chép: HTML (giữ chỉ số dưới/trên khi dán vào Word) + chữ thuần ---- */
async function cfCopyRich(html, plain, btn, label) {
  const done = () => { if (btn) { const old = btn.getAttribute("data-old") || btn.textContent; btn.setAttribute("data-old", old); btn.textContent = label || "Đã sao chép"; setTimeout(() => { btn.textContent = old; }, 2200); } };
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([plain], { type: "text/plain" }) })]);
      done(); return true;
    }
  } catch (e) { /* dùng cách dự phòng */ }
  const div = document.createElement("div");
  div.contentEditable = "true"; div.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
  div.innerHTML = html; document.body.appendChild(div);
  const range = document.createRange(); range.selectNodeContents(div);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  sel.removeAllRanges(); document.body.removeChild(div);
  if (ok) done();
  return ok;
}
function cfCopyText(txt, btn, label) {
  return cfCopyRich(rbkEsc(txt).replace(/\n/g, "<br>"), txt, btn, label);
}

/* ---- Ô soạn thảo: làm sạch HTML và lấy chữ thuần ---- */
function cfCleanHtml(root) {
  const walk = (node) => {
    let o = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) o += rbkEsc(n.nodeValue);
      else if (n.nodeType === 1) {
        const t = n.tagName;
        if (t === "BR") o += "<br>";
        else if (t === "SUB" || t === "SUP") { const tg = t.toLowerCase(); o += "<" + tg + ">" + walk(n) + "</" + tg + ">"; }
        else if (t === "DIV" || t === "P") { if (o && !o.endsWith("<br>")) o += "<br>"; o += walk(n); }
        else o += walk(n);
      }
    });
    return o;
  };
  return walk(root);
}
function cfPlainOf(root, uni) {
  if (uni === undefined) uni = true;
  const walk = (node, d) => {
    let o = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) o += d && uni ? cfUniChars(n.nodeValue, d).s : n.nodeValue;
      else if (n.nodeType === 1) {
        const t = n.tagName;
        if (t === "BR") o += "\n";
        else if (t === "SUB") o += walk(n, "sub");
        else if (t === "SUP") o += walk(n, "sup");
        else if (t === "DIV" || t === "P") { if (o && !o.endsWith("\n")) o += "\n"; o += walk(n, d); }
        else o += walk(n, d);
      }
    });
    return o;
  };
  return walk(root, null);
}

    <li><b>Ngăn này có tạo ra công thức giống MathType không?</b> Không tạo được đối tượng MathType. Ngăn tạo (a) chữ có chỉ số dưới/trên thật và (b) file .docx có phương trình của Word. Cả hai sao chép sang bài Word được. Độ đẹp còn tùy phông chữ và cách bạn thích, hãy thử cả hai.</li>
    <li><b>Phương trình phức tạp có chuyển được không?</b> Phân số, căn, tích phân chỉ chuyển được thành dạng chữ đơn giản (a/b, √(...)), ngăn sẽ báo. Hãy dùng cách 2 ở trên.</li>
    <li><b>Dữ liệu của tôi có được lưu không?</b> Không. Mọi thứ chạy trên máy bạn. Chỉ khi xuất .docx, trình duyệt tải thêm một thư viện nén file lần đầu.</li></ul></div>`;

function cfRender(res, root) {
  const segs = res.segs, n = res.notes;
  const html = cfHtml(segs);
  const uni = cfUni(segs);
  const list = cfFormulaList(segs);
  const total = segs.filter((g) => g.k === "f").length;
  const warn = [];
  if (n.complex) warn.push(n.complex + " chỗ có phân số, căn hoặc cấu trúc phức tạp đã chuyển thành dạng chữ đơn giản. Với phương trình phức tạp, hãy dùng cách 2 ở tab 3 (phương trình của Word + LaTeX).");
  if (n.unknown.length) warn.push("Lệnh LaTeX chưa hỗ trợ (giữ lại dạng chữ): " + Array.from(new Set(n.unknown)).slice(0, 8).join(", ") + ".");
  if (uni.lossy) warn.push(uni.lossy + " chỗ có ký tự không có dạng chỉ số Unicode nên giữ nguyên trong bản chữ Unicode. Bản dán vào Word (chỉ số dưới/trên thật) không bị ảnh hưởng.");
  const rows = list.map((x, i) => `<tr><td>${x.html}</td><td><code>${rbkEsc(x.mathrm)}</code></td><td><code>${rbkEsc(x.plain)}</code></td><td><button class="pomo-btn pomo-btn-secondary" style="padding:3px 9px;font-size:12px;" data-cfrow="${i}">Chép</button></td></tr>`).join("");
  return `
    <h3 class="rbk-h">Kết quả</h3>
    <div class="rbk-card"><p>Đã xử lý <b>${total}</b> công thức và đơn vị: ${n.math} từ mã LaTeX, ${n.auto} tự nhận diện trong văn bản thường, ${n.units} đơn vị hoặc số mũ.</p>
      ${warn.length ? `<ul>${warn.map((w) => `<li>${rbkEsc(w)}</li>`).join("")}</ul>` : ""}
      <p class="tkb-note">Ngăn dùng quy tắc, nên có thể bỏ sót hoặc đổi nhầm vài chỗ (ví dụ mã sản phẩm giống công thức). Hãy đọc lại, và tắt các tùy chọn tự nhận diện nếu cần.</p></div>
    <div class="rbk-card"><h4>1. Dán vào Word (chỉ số dưới và trên thật)</h4>
      <div class="cf-prev" id="cfPrev">${html}</div>
      <div class="rbk-row"><button id="cfCopyRich" class="pomo-btn pomo-btn-primary">Sao chép để dán vào Word</button></div>
      <p class="tkb-note">Dán vào Word xong, nếu thấy chữ lạ phông, bấm biểu tượng Paste Options và chọn Merge Formatting (hợp nhất định dạng).</p></div>
    <div class="rbk-card"><h4>2. Chữ Unicode (dán vào nơi chỉ nhận chữ thuần: Zalo, Facebook, Excel...)</h4>
      <textarea id="cfUni" class="rbk-input" rows="5" readonly>${rbkEsc(uni.text)}</textarea>
      <div class="rbk-row"><button id="cfCopyUni" class="pomo-btn pomo-btn-secondary">Sao chép chữ Unicode</button></div></div>
    <div class="rbk-card"><h4>3. LaTeX sạch (dán vào phương trình của Word hoặc MathType)</h4>
      ${rows ? `<table class="rbk-tbl"><tr><th>Công thức</th><th>LaTeX in thẳng</th><th>LaTeX gọn</th><th></th></tr>${rows}</table>
      <p class="tkb-note">Trong Word: nhấn Alt + =, dán mã (không có dấu $), nhấn Enter. Dùng "LaTeX gọn" nếu Word không hiểu \\mathrm.</p>` : "<p>Chưa có công thức nào.</p>"}
      <p><b>Toàn bộ văn bản với mã LaTeX trong dấu $</b> (dùng cho Overleaf, Markdown):
        <select id="cfTexMode"><option value="mathrm">\\mathrm (in thẳng)</option><option value="ce">\\ce (gói mhchem)</option></select></p>
      <textarea id="cfTexAll" class="rbk-input" rows="5" readonly>${rbkEsc(cfLatexFull(segs, "mathrm"))}</textarea>
      <div class="rbk-row"><button id="cfCopyTex" class="pomo-btn pomo-btn-secondary">Sao chép</button></div></div>
    <div class="rbk-card"><h4>4. File Word (.docx)</h4>
      <p>Tải file rồi chép nội dung sang bài của bạn. Hai kiểu:</p>
      <div class="rbk-row"><button id="cfDocSub" class="pomo-btn pomo-btn-secondary">Tải .docx (chỉ số dưới/trên)</button>
        <button id="cfDocEq" class="pomo-btn pomo-btn-secondary">Tải .docx (phương trình của Word)</button><span id="cfDocMsg" class="rbk-prog"></span></div>
      <p class="tkb-note">Kiểu "phương trình" dùng công thức Office Math của Word (chữ thẳng, phông Cambria Math), gần với cách MathType hiển thị hơn nhưng không phải đối tượng MathType. Hãy thử cả hai xem kiểu nào bạn thấy đẹp hơn.</p></div>`;
}

function initChemFormula() {
  const $ = (id) => document.getElementById(id);
  if (!$("cfP-fix")) return;
  const panels = ["fix", "ed", "learn"];
  const showTab = (t) => {
    document.querySelectorAll("[data-cf-tab]").forEach((b) => b.classList.toggle("rbk-tab-on", b.getAttribute("data-cf-tab") === t));
    panels.forEach((p) => { $("cfP-" + p).style.display = p === t ? "" : "none"; });
  };
  document.querySelectorAll("[data-cf-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.getAttribute("data-cf-tab"))));

  // ---- Tab 1 ----
  let cur = null;
  const run = () => {
    const txt = $("cfIn").value;
    if (!txt.trim()) { $("cfOut").innerHTML = '<p class="rbk-miss">Hãy dán văn bản cần sửa vào ô bên trên.</p>'; return; }
    cur = cfFix(txt, { auto: $("cfOptAuto").checked, units: $("cfOptUnits").checked, arrows: $("cfOptArrows").checked });
    $("cfOut").innerHTML = cfRender(cur, $("cfOut"));
    const segs = cur.segs;
    $("cfCopyRich").addEventListener("click", () => cfCopyRich("<span>" + cfHtml(segs) + "</span>", cfUni(segs).text, $("cfCopyRich"), "Đã sao chép, hãy dán vào Word"));
    $("cfCopyUni").addEventListener("click", () => cfCopyText(cfUni(segs).text, $("cfCopyUni"), "Đã sao chép"));
    $("cfCopyTex").addEventListener("click", () => cfCopyText($("cfTexAll").value, $("cfCopyTex"), "Đã sao chép"));
    $("cfTexMode").addEventListener("change", () => { $("cfTexAll").value = cfLatexFull(segs, $("cfTexMode").value); });
    const list = cfFormulaList(segs);
    $("cfOut").querySelectorAll("[data-cfrow]").forEach((b) => b.addEventListener("click", () => cfCopyText(list[+b.getAttribute("data-cfrow")].mathrm, b, "Đã chép")));
    const doc = async (mode, name) => {
      $("cfDocMsg").textContent = "Đang tạo file...";
      try { cfDownloadBlob(name, await cfBuildDocx(segs, mode)); $("cfDocMsg").textContent = "Đã tạo file " + name + "."; }
      catch (e) { $("cfDocMsg").textContent = "Không tạo được file (kiểm tra kết nối mạng để tải thư viện nén)."; }
    };
    $("cfDocSub").addEventListener("click", () => doc("sub", "cong-thuc-chi-so.docx"));
    $("cfDocEq").addEventListener("click", () => doc("eq", "cong-thuc-phuong-trinh.docx"));
  };
  $("cfGo").addEventListener("click", run);
  $("cfSample").addEventListener("click", () => { $("cfIn").value = CF_SAMPLE; run(); });

  // ---- Tab 2: soạn nhanh ----
  const ed = $("cfEd");
  const insert = (html) => {
    ed.focus();
    let ok = false;
    try { ok = document.execCommand("insertHTML", false, html); } catch (e) { ok = false; }
    if (!ok) {
      const sel = window.getSelection();
      const range = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      const tmp = document.createElement("div"); tmp.innerHTML = html;
      if (range && ed.contains(range.commonAncestorContainer)) { range.deleteContents(); const frag = document.createDocumentFragment(); while (tmp.firstChild) frag.appendChild(tmp.firstChild); range.insertNode(frag); }
      else ed.insertAdjacentHTML("beforeend", html);
    }
  };
  const keepSel = (e) => e.preventDefault();
  document.querySelectorAll("#cfP-ed .cf-btn").forEach((b) => b.addEventListener("mousedown", keepSel));
  document.querySelectorAll("#cfP-ed [data-ins]").forEach((b) => b.addEventListener("click", () => insert(b.getAttribute("data-ins"))));
  document.querySelectorAll("#cfP-ed .cf-cmd").forEach((b) => b.addEventListener("click", () => { ed.focus(); try { document.execCommand(b.getAttribute("data-cmd")); } catch (e) { /* bỏ qua */ } }));
  $("cfAutoFmt").addEventListener("click", () => { const t = cfPlainOf(ed, false); ed.innerHTML = cfHtml(cfFix(t).segs); });
  ed.addEventListener("paste", (e) => {
    const cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    e.preventDefault();
    insert(cfHtml(cfFix(cd.getData("text/plain")).segs));
  });
  ed.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "=" && !e.shiftKey) { e.preventDefault(); try { document.execCommand("subscript"); } catch (x) { /* bỏ qua */ } }
    else if (e.key === "+" || (e.key === "=" && e.shiftKey)) { e.preventDefault(); try { document.execCommand("superscript"); } catch (x) { /* bỏ qua */ } }
  });
  const msg = (m) => { $("cfEdMsg").textContent = m; };
  $("cfEdCopy").addEventListener("click", async () => {
    const ok = await cfCopyRich("<span>" + cfCleanHtml(ed) + "</span>", cfPlainOf(ed, true), $("cfEdCopy"), "Đã sao chép, hãy dán vào Word");
    if (!ok) msg("Trình duyệt chặn sao chép. Hãy bôi đen nội dung và nhấn Ctrl + C.");
  });
  $("cfEdCopyUni").addEventListener("click", () => cfCopyText(cfPlainOf(ed, true), $("cfEdCopyUni"), "Đã sao chép"));
  $("cfEdToFix").addEventListener("click", () => { $("cfIn").value = cfPlainOf(ed, false); showTab("fix"); run(); });
  $("cfEdClear").addEventListener("click", () => { ed.innerHTML = ""; msg(""); });

  // ---- Tab 3 ----
  $("cfCopyPrompt").addEventListener("click", () => cfCopyText(CF_PROMPT, $("cfCopyPrompt"), "Đã sao chép"));
}

  return str.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function initDeXuatLichHocUI() {
  const tbody = document.getElementById("dxlhScheduleBody");
  let selectedType = null;
  let draggedSuggestFrom = null;
  const allCells = [];

  function renderTopBreakRow(entry) {
    const tr = document.createElement("tr");
    tr.className = "dxlh-break-row" + (entry.lunch ? " dxlh-lunch" : "");
    tr.appendChild(document.createElement("td"));
    const labelTd = document.createElement("td");
    labelTd.className = "dxlh-tiet-label";
    tr.appendChild(labelTd);
    const breakTd = document.createElement("td");
    breakTd.colSpan = DXLH_DAYS;
    breakTd.textContent = entry.lunch ? `${entry.label} (${entry.minutes} phút)` : `Nghỉ ${entry.minutes} phút`;
    tr.appendChild(breakTd);
    tbody.appendChild(tr);
  }

  DXLH_TIMETABLE.forEach(entry => {
    if (entry.kind === "break") { renderTopBreakRow(entry); return; }

    let firstSlotDone = false;
    entry.slots.forEach(row => {
      const tr = document.createElement("tr");

      if (row.kind === "break") {
        tr.className = "dxlh-break-row";
        const labelTd = document.createElement("td");
        labelTd.className = "dxlh-tiet-label";
        tr.appendChild(labelTd);
        const breakTd = document.createElement("td");
        breakTd.colSpan = DXLH_DAYS;
        breakTd.textContent = `Nghỉ ${row.minutes} phút`;
        tr.appendChild(breakTd);
        tbody.appendChild(tr);
        return;
      }

      if (!firstSlotDone) {
        const buoiTh = document.createElement("th");
        buoiTh.className = "dxlh-buoi-col";
        buoiTh.rowSpan = entry.slots.length;
        buoiTh.textContent = entry.name;
        tr.appendChild(buoiTh);
        firstSlotDone = true;
      }

      const labelTd = document.createElement("td");
      labelTd.className = "dxlh-tiet-label";
      labelTd.textContent = row.label;
      tr.appendChild(labelTd);

      for (let d = 0; d < DXLH_DAYS; d++) {
        const td = document.createElement("td");
        td.className = "dxlh-cell";
        td.dataset.type = "";
        td.dataset.subj = "";
        td.dataset.day = d;
        td.dataset.order = row.order;
        td.dataset.cap = row.cap;
        attachCellEvents(td);
        allCells.push({ el: td, day: d, order: row.order, cap: row.cap });
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });
  });

  function attachCellEvents(cell) {
    cell.addEventListener("click", () => {
      if (selectedType === null) {
        const input = cell.querySelector(".dxlh-subj-input");
        if (input) input.focus();
        return;
      }
      applyType(cell, selectedType);
      const input = cell.querySelector(".dxlh-subj-input");
      if (input) input.focus();
    });

    cell.addEventListener("dragstart", (e) => {
      if (!cell.classList.contains("dxlh-suggested")) { e.preventDefault(); return; }
      e.dataTransfer.setData("text/x-suggestion-swap", "1");
      draggedSuggestFrom = cell;
    });

    cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("dxlh-drag-over"); });
    cell.addEventListener("dragleave", () => cell.classList.remove("dxlh-drag-over"));
    cell.addEventListener("drop", (e) => {
      e.preventDefault();
      cell.classList.remove("dxlh-drag-over");

      const isSwap = e.dataTransfer.getData("text/x-suggestion-swap");
      if (isSwap) {
        if (draggedSuggestFrom && draggedSuggestFrom !== cell && cell.dataset.type === "") {
          swapSuggestions(draggedSuggestFrom, cell);
        }
        draggedSuggestFrom = null;
        return;
      }

      const type = e.dataTransfer.getData("text/plain");
      applyType(cell, type);
    });
  }

  function swapSuggestions(a, b) {
    const aHTML = a.innerHTML, bHTML = b.innerHTML;
    const aSug = a.classList.contains("dxlh-suggested");
    const bSug = b.classList.contains("dxlh-suggested");
    a.innerHTML = bHTML; b.innerHTML = aHTML;
    a.classList.toggle("dxlh-suggested", bSug);
    b.classList.toggle("dxlh-suggested", aSug);
    a.draggable = bSug; b.draggable = aSug;
  }

  function applyType(cell, type) {
    cell.classList.remove("dxlh-suggested");
    cell.draggable = false;
    cell.dataset.type = type;

    if (!type) {
      cell.dataset.subj = "";
      cell.innerHTML = "";
      saveState();
      return;
    }

    const subjValue = cell.dataset.subj || "";
    cell.innerHTML = `
      <div class="dxlh-cell-inner">
        <span class="dxlh-type-label">${DXLH_TYPE_NAMES[type]}</span>
        <input class="dxlh-subj-input" type="text" placeholder="Tên môn" value="${dxlhEscapeHtml(subjValue)}">
      </div>
    `;

    const input = cell.querySelector(".dxlh-subj-input");
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("mousedown", (e) => e.stopPropagation());
    input.addEventListener("input", (e) => { cell.dataset.subj = e.target.value; saveState(); });

    saveState();
  }

  // Palette
  const swatches = document.querySelectorAll("#dxlhPalette .dxlh-swatch");
  const selectedLabel = document.getElementById("dxlhSelectedLabel");
  swatches.forEach(sw => {
    sw.addEventListener("click", () => {
      swatches.forEach(s => s.classList.remove("dxlh-selected"));
      sw.classList.add("dxlh-selected");
      selectedType = sw.dataset.type;
      selectedLabel.textContent = sw.classList.contains("dxlh-eraser")
        ? "Xóa ô (bấm vào ô muốn xóa)"
        : sw.textContent.trim();
    });
    sw.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", sw.dataset.type); });
  });

  document.getElementById("dxlhResetAll").addEventListener("click", () => {
    allCells.forEach(c => applyType(c.el, ""));
    resetSummary();
  });

  // ---- Lưu / nạp lại (localStorage) ----
  const saveStatusEl = document.getElementById("dxlhSaveStatus");
  let saveTimer = null;

  function saveState() {
    const data = allCells.map(c => ({ type: c.el.dataset.type, subj: c.el.dataset.subj }));
    try { localStorage.setItem(DXLH_STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* bỏ qua nếu bị chặn */ }
    if (saveStatusEl) {
      saveStatusEl.textContent = "Đã tự lưu " + new Date().toLocaleTimeString("vi-VN");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveStatusEl.textContent = "\u00a0"; }, 2500);
    }
  }

  function loadState() {
    let raw;
    try { raw = localStorage.getItem(DXLH_STORAGE_KEY); } catch (e) { return; }
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    data.forEach((entry, i) => {
      if (!allCells[i] || !entry) return;
      const cell = allCells[i].el;
      cell.dataset.subj = entry.subj || "";
      if (entry.type) applyType(cell, entry.type);
    });
  }
  loadState();

  // ---- Đề xuất giờ tự học ----
  function computeNeeds() {
    const needs = {};
    const classCells = [];
    allCells.forEach(c => {
      const type = c.el.dataset.type;
      const subj = (c.el.dataset.subj || "").trim();
      if (type && type !== "thi" && type !== "tamhoan" && subj) {
        needs[subj] = (needs[subj] || 0) + DXLH_SELF_STUDY_PER_SESSION;
        classCells.push({ subject: subj, day: c.day, order: c.order });
      }
    });
    return { needs, classCells };
  }

  function clearSuggestions() {
    allCells.forEach(c => {
      if (c.el.classList.contains("dxlh-suggested")) {
        c.el.classList.remove("dxlh-suggested");
        c.el.draggable = false;
        c.el.innerHTML = "";
      }
    });
  }

  function resetSummary() {
    document.getElementById("dxlhSummaryPanel").innerHTML =
      '<p class="dxlh-summary-empty">Điền tên môn vào các ô lý thuyết/thực hành/trực tuyến, rồi bấm "Đề xuất giờ tự học" để xem nhu cầu từng môn.</p>';
  }

  function suggestSchedule() {
    clearSuggestions();
    const { needs, classCells } = computeNeeds();
    const subjects = Object.keys(needs);
    if (subjects.length === 0) { resetSummary(); return; }

    const emptySlots = allCells
      .filter(c => c.el.dataset.type === "")
      .map(c => ({ el: c.el, day: c.day, order: c.order, cap: c.cap, used: 0, allocations: [] }));

    function allocate(subj, remaining, pool) {
      for (const slot of pool) {
        if (remaining <= 0.001) break;
        const avail = slot.cap - slot.used;
        if (avail <= 0.001) continue;
        const take = Math.min(avail, remaining);
        slot.used += take;
        slot.allocations.push({ subject: subj, hours: take });
        remaining -= take;
      }
      return remaining;
    }

    const shortfall = {};
    subjects.sort((a, b) => needs[b] - needs[a]);

    subjects.forEach(subj => {
      let remaining = needs[subj];
      const subjDays = new Set(classCells.filter(c => c.subject === subj).map(c => c.day));

      const sameDay = emptySlots.filter(s => subjDays.has(s.day) && s.cap - s.used > 0.001).sort((a, b) => a.order - b.order);
      remaining = allocate(subj, remaining, sameDay);

      if (remaining > 0.001) {
        const rest = emptySlots.filter(s => s.cap - s.used > 0.001).sort((a, b) => a.day - b.day || a.order - b.order);
        remaining = allocate(subj, remaining, rest);
      }

      if (remaining > 0.001) shortfall[subj] = dxlhRound1(remaining);
    });

    emptySlots.forEach(slot => {
      if (slot.allocations.length === 0) return;
      slot.el.classList.add("dxlh-suggested");
      slot.el.draggable = true;
      const lines = slot.allocations.map(a => `<div class="dxlh-sugg-line">${dxlhEscapeHtml(a.subject)} · ${dxlhRound1(a.hours)}h</div>`).join("");
      slot.el.innerHTML = `<div class="dxlh-cell-inner dxlh-sugg-inner">${lines}</div>`;
    });

    renderSummary(needs, shortfall);
  }

  function renderSummary(needs, shortfall) {
    const subjects = Object.keys(needs);
    const rows = subjects.map(s => {
      const need = needs[s];
      const missing = shortfall[s] || 0;
      const done = dxlhRound1(need - missing);
      const status = missing > 0
        ? `xếp được ${done}h / cần ${need}h — <b>còn thiếu ${missing}h</b> (lịch trống không đủ chỗ)`
        : `xếp đủ ${need}h tự học`;
      return `<li><b>${dxlhEscapeHtml(s)}</b>: ${status}</li>`;
    }).join("");

    document.getElementById("dxlhSummaryPanel").innerHTML = `
      <p class="dxlh-summary-title">Nhu cầu tự học mỗi tuần (công thức 2×tiết − 1, 1 buổi = 3 tiết → ${DXLH_SELF_STUDY_PER_SESSION}h):</p>
      <ul class="dxlh-summary-list">${rows}</ul>
      <p class="dxlh-summary-empty" style="margin-top:8px;">Kéo các ô tím (đề xuất) thả sang ô trống/tím khác để đổi lại cho hợp ý bạn.</p>
    `;
  }

  document.getElementById("dxlhSuggestBtn").addEventListener("click", suggestSchedule);
  document.getElementById("dxlhClearSuggestBtn").addEventListener("click", () => { clearSuggestions(); resetSummary(); });
}

/* =========================================================
   NGĂN "TẠO TRẮC NGHIỆM TỪ FILE" — người dùng tự tải file câu hỏi
   lên, web đọc NGAY TRÊN TRÌNH DUYỆT của họ và dựng bài trắc nghiệm
   bằng đúng Quiz Engine có sẵn. Web không tự gửi file đi đâu.

   Hỗ trợ: .docx (đáp án đúng tô chữ đỏ hoặc tô nền vàng, hoặc gõ
   dấu * trước đáp án) và .txt / dán chữ (đáp án đúng có dấu *).
   Câu nào thiếu đáp án đúng, có nhiều đáp án được đánh dấu hoặc
   dưới 2 đáp án thì bị LOẠI RA và báo rõ lý do (không tự đoán).
   ========================================================= */

const UGC_ANS_RE = /^([A-Fa-f])\s*[\.\)]\s*(.+)$/;
const UGC_CHAPTER_RE = /^(CHƯƠNG|CHUONG|PHẦN|PHAN)\s*[0-9IVXivx]+/i;
const UGC_NEWQ_RE = /^(?:Câu|Cau|Question)\s*\d+\s*[:\.\)]?\s*/i;
const UGC_NUMQ_RE = /^\d+\s*[\.\)]\s+/;

/* Chống chèn mã HTML từ file người khác (nội dung được in thẳng vào trang) */
function ugcEsc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* Run (đoạn chữ) trong Word có được "đánh dấu" là đáp án đúng không:
   chữ màu đỏ (FF0000, C00000...) hoặc tô nền (trừ xám/đen/trắng) */
function ugcRunMarked(run) {
  const rPr = run.getElementsByTagName("w:rPr")[0];
  if (!rPr) return false;

  const hl = rPr.getElementsByTagName("w:highlight")[0];
  const hlVal = hl && hl.getAttribute("w:val");
  if (hlVal && !/^(none|lightGray|darkGray|black|white)$/i.test(hlVal)) return true;

  const c = rPr.getElementsByTagName("w:color")[0];
  const v = c && c.getAttribute("w:val");
  if (v && /^[0-9a-f]{6}$/i.test(v)) {
    const r = parseInt(v.slice(0, 2), 16);
    const g = parseInt(v.slice(2, 4), 16);
    const b = parseInt(v.slice(4, 6), 16);
    return r >= 0xb0 && g <= 0x70 && b <= 0x70;
  }
  return false;
}

/* word/document.xml -> danh sách dòng { text, marked }.
   Shift+Enter (xuống dòng mềm) cũng được tách thành dòng riêng. */
function ugcDocxXmlToLines(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const paras = doc.getElementsByTagName("w:p");
  const out = [];
  for (let i = 0; i < paras.length; i++) {
    const runs = paras[i].getElementsByTagName("w:r");
    let line = { text: "", marked: false };
    const lines = [line];
    for (let j = 0; j < runs.length; j++) {
      const run = runs[j];
      const marked = ugcRunMarked(run);
      for (let k = 0; k < run.childNodes.length; k++) {
        const n = run.childNodes[k];
        if (n.nodeName === "w:t") {
          line.text += n.textContent;
          if (marked && n.textContent.trim()) line.marked = true;
        } else if (n.nodeName === "w:br" || n.nodeName === "w:cr") {
          line = { text: "", marked: false };
          lines.push(line);
        } else if (n.nodeName === "w:tab") {
          line.text += " ";
        }
      }
    }
    lines.forEach((l) => out.push(l));
  }
  return out;
}

/* Danh sách dòng -> câu hỏi hợp lệ + danh sách câu bị loại (kèm lý do) */
function ugcBuildQuestions(lines) {
  const questions = [];
  const errors = [];
  let chuong = "Tất cả";
  let cur = null;

  function newQ(text) {
    cur = { cau: text, dapAn: [], marks: [], chuong: chuong };
  }
  function flush() {
    if (!cur) return;
    const marked = [];
    cur.marks.forEach((m, i) => { if (m) marked.push(i); });
    let ly = "";
    if (cur.dapAn.length < 2) ly = "Có ít hơn 2 đáp án";
    else if (marked.length === 0) ly = "Không thấy đáp án đúng (chưa tô đỏ / tô vàng / đánh dấu *)";
    else if (marked.length > 1) ly = "Có hơn 1 đáp án được đánh dấu là đúng";
    if (ly) {
      errors.push({ cau: ugcEsc(cur.cau), ly: ly });
    } else {
      questions.push({
        cau: ugcEsc(cur.cau),
        dapAn: cur.dapAn.map(ugcEsc),
        dungIndex: marked[0],
        chuong: ugcEsc(cur.chuong),
      });
    }
    cur = null;
  }

  lines.forEach((ln) => {
    let t = String(ln.text).replace(/\s+/g, " ").trim();
    if (!t) return;
    let marked = !!ln.marked;
    if (t.startsWith("*")) {
      marked = true;
      t = t.replace(/^\*+\s*/, "");
      if (!t) return;
    }

    if (UGC_CHAPTER_RE.test(t) && !t.endsWith("?") && t.length < 120) {
      flush();
      chuong = t;
      return;
    }

    if (UGC_NEWQ_RE.test(t) || UGC_NUMQ_RE.test(t) || t.endsWith("?")) {
      flush();
      const cleaned = t.replace(UGC_NEWQ_RE, "").replace(UGC_NUMQ_RE, "").trim();
      newQ(cleaned || t);
      return;
    }

    const m = t.match(UGC_ANS_RE);
    if (m && cur) {
      let ansText = m[2].trim();
      if (ansText.startsWith("*")) {
        marked = true;
        ansText = ansText.replace(/^\*+\s*/, "");
      }
      cur.dapAn.push(ansText);
      cur.marks.push(marked);
      return;
    }

    // Không khớp mẫu nào: nối vào đáp án / câu hỏi đang dang dở
    if (cur && cur.dapAn.length > 0) {
      if (cur.dapAn.length >= 4) {
        flush();
        newQ(t);
      } else {
        const last = cur.dapAn.length - 1;
        cur.dapAn[last] += " " + t;
        if (marked) cur.marks[last] = true;
      }
    } else if (cur) {
      cur.cau += " " + t;
    } else {
      newQ(t);
    }
  });
  flush();

  return { questions: questions, errors: errors };
}

/* Dự phòng cho file .txt kiểu cũ của web: không có A./B., mỗi câu 1 khối cách
   nhau dòng trống, dòng đầu là câu hỏi, đáp án đúng có dấu * ngay trước. */
function ugcParseStarBlocks(raw) {
  const questions = [];
  const errors = [];
  let chuong = "Tất cả";
  raw.replace(/\r\n/g, "\n").split(/\n\s*\n/).forEach((block) => {
    const ls = block.split("\n").map((s) => s.trim()).filter(Boolean);
    while (ls.length && ls[0].startsWith("##")) chuong = ls.shift().replace(/^##\s*/, "");
    if (!ls.length) return;
    const cau = ls[0];
    const opts = ls.slice(1);
    const stars = [];
    opts.forEach((o, i) => { if (o.startsWith("*")) stars.push(i); });
    let ly = "";
    if (opts.length < 2) ly = "Có ít hơn 2 đáp án";
    else if (stars.length === 0) ly = "Không thấy đáp án đúng (thiếu dấu *)";
    else if (stars.length > 1) ly = "Có hơn 1 đáp án được đánh dấu *";
    if (ly) {
      errors.push({ cau: ugcEsc(cau), ly: ly });
    } else {
      questions.push({
        cau: ugcEsc(cau),
        dapAn: opts.map((o) => ugcEsc(o.replace(/^\*+\s*/, ""))),
        dungIndex: stars[0],
        chuong: ugcEsc(chuong),
      });
    }
  });
  return { questions: questions, errors: errors };
}

/* Gộp: thử đọc kiểu A./B./C./D. trước; nếu không ra câu nào mà là chữ thuần
   thì thử kiểu khối có dấu * */
function ugcParseAll(src) {
  let r = ugcBuildQuestions(src.lines);
  if (!r.questions.length && src.rawText) {
    const alt = ugcParseStarBlocks(src.rawText);
    if (alt.questions.length) r = alt;
  }
  return r;
}

   Để trống cả 2 thì web tự hiện link tới mục "Góp Ý / Báo Lỗi / Bản Quyền".
   Gợi ý: dùng Gmail/Zalo riêng cho web, đừng dùng tài khoản mang tên thật. */
const UGC_CONTACT_GMAIL = "";
const UGC_CONTACT_ZALO = "";

const UGC_BANK_KEY = "bungcavoi_ugc_bank";
const UGC_MAX_FILE_BYTES = 10 * 1024 * 1024;

function ugcTrack(name, params) {
  if (window.gtag) gtag("event", name, params || {});
}

function ugcContactHtml() {
  const parts = [];
  if (UGC_CONTACT_GMAIL) parts.push(`Gmail: <b>${UGC_CONTACT_GMAIL}</b>`);
  if (UGC_CONTACT_ZALO) parts.push(`Zalo: <b>${UGC_CONTACT_ZALO}</b>`);
  if (!parts.length) {
    return `mục <a href="${GOP_Y_URL}" target="_blank" rel="noopener">💬 Góp Ý / Báo Lỗi / Bản Quyền</a> trên thanh menu`;
  }
  return parts.join(" &nbsp;•&nbsp; ");
}

function ugcLoadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = () => resolve(window.JSZip);
    s.onerror = () => reject(new Error("Không tải được thư viện đọc file Word. Bạn kiểm tra kết nối mạng rồi thử lại nhé."));
    document.head.appendChild(s);
  });
}

async function ugcReadFile(file) {
  const name = (file.name || "").toLowerCase();
  if (file.size > UGC_MAX_FILE_BYTES) throw new Error("File quá lớn (tối đa 10MB).");
  if (name.endsWith(".docx")) {
    const JSZip = await ugcLoadJSZip();
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const entry = zip.file("word/document.xml");
    if (!entry) throw new Error("File .docx này không đúng cấu trúc (không tìm thấy nội dung).");
    return { lines: ugcDocxXmlToLines(await entry.async("string")), rawText: "" };
  }
  if (name.endsWith(".txt")) {
    const text = await file.text();
    return { lines: text.split(/\r?\n/).map((t) => ({ text: t, marked: false })), rawText: text };
  }
  if (name.endsWith(".doc")) {
    throw new Error("File .doc (Word đời cũ) chưa đọc được. Bạn mở bằng Word → Lưu thành (Save As) → chọn .docx rồi tải lên lại nhé.");
  }
  if (name.endsWith(".pdf")) {
    throw new Error("Hiện web chưa đọc được PDF. Bạn chuyển sang Word (.docx) hoặc dán nội dung vào ô bên dưới nhé.");
  }
  throw new Error("Định dạng này chưa được hỗ trợ. Hãy dùng file .docx hoặc .txt (hoặc dán chữ vào ô bên dưới).");
}

  function startQuiz(questions, resume) {

  }

  showChoice();
}

/* ---------- 3. GHIM (PIN) ---------- */

const PIN_KEY = "bungcavoi_pinned";

function getPinned() {
  try { return JSON.parse(localStorage.getItem(PIN_KEY)) || []; }
  catch { return []; }
}

function togglePin(id) {
  const pinned = getPinned();
  const idx = pinned.indexOf(id);
  if (idx === -1) pinned.push(id);
  else pinned.splice(idx, 1);
  localStorage.setItem(PIN_KEY, JSON.stringify(pinned));
}

/* ---------- 4. ĐIỀU HƯỚNG ---------- */

function goHome() { location.hash = ""; renderHome(); }
/* Ngăn có trường externalUrl (vd Google Sheet): bấm vào là mở thẳng link ở tab mới,
   không chuyển trang con, không đổi #hash. Vẫn ghi sự kiện GA4 xem_ngan như các ngăn khác. */
function openExternalSubject(subject) {
  if (window.gtag) gtag("event", "xem_ngan", { ngan_ten: subject.title });
  const w = window.open(subject.externalUrl, "_blank");
  if (w) {
    try { w.opener = null; } catch (e) {}
  } else {
    location.href = subject.externalUrl; // trình duyệt chặn popup thì mở ngay tại tab này
  }
}

function goToSubject(id) {
  const s = SUBJECTS.find((x) => x.id === id);
  if (s && s.externalUrl) { openExternalSubject(s); return; }
  location.hash = id;
  renderDetail(id);
}

function renderHome() {
  const pinned = getPinned();
  const visibleSubjects = SUBJECTS.filter((s) => hiddenSubjectsIsUnlocked() || !hiddenSubjectsIsHidden(s.id));
  const sorted = [...visibleSubjects].sort((a, b) => {
    const aPinned = pinned.includes(a.id);
    const bPinned = pinned.includes(b.id);
    return aPinned === bPinned ? 0 : aPinned ? -1 : 1;
  });

  const cards = sorted.map((s) => {
    const isPinned = pinned.includes(s.id);
    return `
      <div class="drawer-card" data-id="${s.id}">
        <button class="pin-btn ${isPinned ? "pinned" : ""}" data-pin="${s.id}" title="Ghim / bỏ ghim">
          ${isPinned ? "★" : "☆"}
        </button>
        ${isPinned ? `<span class="pinned-label">Đã ghim</span><br/>` : ""}
        <span class="drawer-icon">${s.icon}</span>
        <p class="drawer-title">${s.title}</p>
        <p class="drawer-desc">${s.desc}</p>
      </div>
    `;
  }).join("");

  app.innerHTML = `<div class="drawer-grid">${cards}</div>`;

  app.querySelectorAll(".drawer-card").forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.target.closest(".pin-btn")) return;
      goToSubject(card.dataset.id);
    });
  });

  app.querySelectorAll(".pin-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePin(btn.dataset.pin);
      renderHome();
    });
  });
}

function renderDetail(id) {
  const subject = SUBJECTS.find((s) => s.id === id);
  if (!subject) { goHome(); return; }

  if (window.gtag) {
    gtag("event", "xem_ngan", { ngan_ten: subject.title });
  }

  app.innerHTML = `
    <div class="detail-view">
      <div class="detail-toolbar">
        <button class="back-btn" id="backBtn">← Quay lại</button>
        <button class="print-btn" id="printBtn">🖨️ Tải / In trang này (PDF)</button>
      </div>
      <h1 class="detail-title">${subject.icon} ${subject.title}</h1>
      <div class="detail-content">${subject.render()}</div>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", goHome);
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  if (typeof subject.afterRender === "function") {
    subject.afterRender();
  }
}

  });
}

function init() {
  const currentId = location.hash.replace("#", "");
  if (currentId) renderDetail(currentId);
  else renderHome();
}

/* =========================================================
   NHẠC NỀN — phát nhạc nhẹ nền, tắt/bật, đổi bài, chỉnh âm
   lượng. Trạng thái tự lưu localStorage (giống các phần khác
   của trang). Tự phát bị trình duyệt chặn tới khi có tương
   tác đầu tiên — code tự thử lại ngay khi đó xảy ra.
   ========================================================= */

const NHAC_PLAYLIST = [
  { ten: "Dream Aria", path: "NHẠC/Dream Aria.mp4" },
  { ten: "My Eden", path: "NHẠC/My Eden.mp4" },
  { ten: "Nod-Krai Main Theme", path: "NHẠC/Nod-Krai Main Theme.mp4" },
];

const NHAC_STORAGE_KEY = "bungcavoi_nhac_state_v1";
const nhacState = { on: false, volume: 0.25, trackIndex: 0 };

function nhacLoadState() {
  try {
    const raw = localStorage.getItem(NHAC_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.on === "boolean") nhacState.on = data.on;
    if (typeof data.volume === "number") nhacState.volume = data.volume;
    if (Number.isInteger(data.trackIndex) && data.trackIndex >= 0 && data.trackIndex < NHAC_PLAYLIST.length) {
      nhacState.trackIndex = data.trackIndex;
    }
  } catch (e) {}
}
function nhacSaveState() {
  try { localStorage.setItem(NHAC_STORAGE_KEY, JSON.stringify(nhacState)); } catch (e) {}
}

let nhacAudioEl = null;
function nhacCreateAudioElement() {
  if (nhacAudioEl) return nhacAudioEl;
  nhacAudioEl = document.createElement("audio");
  nhacAudioEl.id = "nhacAudioEl";
  nhacAudioEl.preload = "none";
  nhacAudioEl.addEventListener("ended", nhacPlayNextTrack);
  document.body.appendChild(nhacAudioEl);
  return nhacAudioEl;
}

function nhacUpdateUI() {
  const btn = document.getElementById("nhacToggleBtn");
  const playPauseBtn = document.getElementById("nhacPlayPauseBtn");
  const nowPlaying = document.getElementById("nhacNowPlaying");
  const volumeSlider = document.getElementById("nhacVolumeSlider");
  const trackListEl = document.getElementById("nhacTrackList");
  if (!btn) return;

  const track = NHAC_PLAYLIST[nhacState.trackIndex];
  btn.textContent = nhacState.on ? "🎵 Nhạc Nền (Đang bật)" : "🎵 Nhạc Nền";
  playPauseBtn.textContent = nhacState.on ? "⏸" : "▶";
  nowPlaying.textContent = nhacState.on ? `Đang phát: ${track.ten}` : "Đang tắt nhạc";
  volumeSlider.value = Math.round(nhacState.volume * 100);

  trackListEl.innerHTML = NHAC_PLAYLIST
    .map((t, i) => `<button type="button" class="nhac-track-btn ${i === nhacState.trackIndex ? "playing" : ""}" data-track="${i}">${i === nhacState.trackIndex ? "▶ " : ""}${t.ten}</button>`)
    .join("");
  trackListEl.querySelectorAll(".nhac-track-btn").forEach((b) => {
    b.addEventListener("click", () => nhacSwitchTrack(parseInt(b.dataset.track, 10)));
  });
}

function nhacLoadCurrentTrack() {
  const audio = nhacCreateAudioElement();
  audio.src = NHAC_PLAYLIST[nhacState.trackIndex].path;
  audio.volume = nhacState.volume;
}

function nhacPlay() {
  const audio = nhacCreateAudioElement();
  if (!audio.src) nhacLoadCurrentTrack();
  audio.volume = nhacState.volume;
  audio.play().catch(() => {});
  nhacState.on = true;
  nhacSaveState();
  nhacUpdateUI();
}
function nhacPause() {
  if (nhacAudioEl) nhacAudioEl.pause();
  nhacState.on = false;
  nhacSaveState();
  nhacUpdateUI();
}
function nhacToggle() { nhacState.on ? nhacPause() : nhacPlay(); }

function nhacSwitchTrack(index) {
  nhacState.trackIndex = index;
  nhacSaveState();
  nhacLoadCurrentTrack();
  if (nhacState.on) nhacCreateAudioElement().play().catch(() => {});
  nhacUpdateUI();
}
function nhacPlayNextTrack() {
  nhacSwitchTrack((nhacState.trackIndex + 1) % NHAC_PLAYLIST.length);
}
function nhacSetVolume(v) {
  nhacState.volume = v;
  if (nhacAudioEl) nhacAudioEl.volume = v;
  nhacSaveState();
}

function initNhacNen() {
  nhacLoadState();
  nhacCreateAudioElement();
  nhacLoadCurrentTrack();

  const toggleBtn = document.getElementById("nhacToggleBtn");
  const panel = document.getElementById("nhacPanel");
  const playPauseBtn = document.getElementById("nhacPlayPauseBtn");
  const volumeSlider = document.getElementById("nhacVolumeSlider");

  toggleBtn.addEventListener("click", (e) => { e.stopPropagation(); panel.classList.toggle("open"); });
  document.addEventListener("click", (e) => {
    if (!panel.contains(e.target) && e.target !== toggleBtn) panel.classList.remove("open");
  });
  playPauseBtn.addEventListener("click", nhacToggle);
  volumeSlider.addEventListener("input", (e) => nhacSetVolume(parseInt(e.target.value, 10) / 100));

  nhacUpdateUI();

  if (nhacState.on) {
    nhacCreateAudioElement().play().catch(() => {
      const resumeOnInteract = () => {
        if (nhacState.on) nhacCreateAudioElement().play().catch(() => {});
      };
      document.addEventListener("click", resumeOnInteract, { once: true });
      document.addEventListener("keydown", resumeOnInteract, { once: true });
    });
  }
}

/* =========================================================
   BỘ ĐẾM LƯỢT TRUY CẬP RIÊNG - gọi tới server tự triển khai
   trên Render + database Supabase.

   Cách hoạt động:
   - Số THẬT trên server luôn được cộng thêm ở MỌI lần mở trang
     (kể cả F5 liên tục) - không giới hạn, ghi nhận đầy đủ ngầm.
   - Số HIỂN THỊ trên màn hình thì "để dành" - chỉ cập nhật lại
     mỗi 5 phút/lần. Trong 5 phút đó dù F5 bao nhiêu lần, số hiện
     ra vẫn đứng yên; qua khỏi 5 phút, số mới "bùng" lên đúng bằng
     số thật đã tích lũy được lúc đó.
   Lưu ý: server Render gói miễn phí sẽ "ngủ" sau 15 phút không
   ai gọi, nên lần đầu tiên sau khi ngủ có thể mất tới ~50
   giây mới trả về kết quả (bình thường, không phải lỗi).
   ========================================================= */

const CHEMCETUS_COUNTER_API = "https://chemcetus-counter.onrender.com";
const CHEMCETUS_DISPLAY_REFRESH_MS = 5 * 60 * 1000; // 5 phút - chu kỳ "bùng" số hiển thị
const CHEMCETUS_DISPLAY_CACHE_KEY = "bungcavoi_display_cache";

function chemcetusDisplayCount(count) {
  const el = document.getElementById("chemcetusVisitCount");
  if (el) el.textContent = Number(count).toLocaleString("vi-VN");
}

function chemcetusReadDisplayCache() {
  try {
    const raw = localStorage.getItem(CHEMCETUS_DISPLAY_CACHE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (typeof data.value !== "number" || typeof data.time !== "number") return null;
    return data;
  } catch (e) {
    return null;
  }
}

function chemcetusSaveDisplayCache(value) {
  try {
    localStorage.setItem(CHEMCETUS_DISPLAY_CACHE_KEY, JSON.stringify({ value: value, time: Date.now() }));
  } catch (e) {}
}

function chemcetusInitVisitCounter() {
  const el = document.getElementById("chemcetusVisitCount");
  if (!el) return;

  // Hiện tạm số đã lưu từ lần trước ngay lập tức (đỡ trống/giật trong lúc chờ mạng)
  const cache = chemcetusReadDisplayCache();
  if (cache) chemcetusDisplayCount(cache.value);

  // Luôn âm thầm cộng thêm 1 lượt thật vào server, bất kể có hiện số mới hay không
  fetch(CHEMCETUS_COUNTER_API + "/api/hit", { method: "POST" })
    .then((res) => res.json())
    .then((data) => {
      const realCount = Number(data.count);
      const now = Date.now();
      const daDuThoiGianCho = !cache || now - cache.time >= CHEMCETUS_DISPLAY_REFRESH_MS;

      if (daDuThoiGianCho) {
        // Đủ 5 phút -> cho số hiển thị "bùng" lên khớp đúng số thật
        chemcetusDisplayCount(realCount);
        chemcetusSaveDisplayCache(realCount);
      }
      // Chưa đủ 5 phút -> giữ nguyên số cũ đang hiện, dù số thật trên server đã tăng ngầm rồi
    })
    .catch((err) => {
      console.error("Không gọi được bộ đếm lượt truy cập:", err);
      if (!cache) el.textContent = "?";
    });
}

/* =========================================================
   ẨN NGĂN THEO MẶC ĐỊNH (danh sách trắng VISIBLE_SUBJECT_IDS) - để tôn
   trọng bản quyền slide của giảng viên, các ngăn KHÔNG nằm trong danh
   sách cho phép sẽ không hiện trên trang chủ và menu
   "Tài Liệu Môn Học" theo mặc định. Bấm vào dòng chữ phụ đề
   ở đầu trang (Нгок Хюинь · ph) rồi nhập đúng mật khẩu sẽ hiện
   lại đầy đủ như trước. Trạng thái mở khóa chỉ tồn tại trong
   PHIÊN TRUY CẬP hiện tại (sessionStorage) - đóng tab/trình
   duyệt hoặc mở lại web lần sau sẽ phải nhập mật khẩu lại từ đầu.
   Lưu ý: đây chỉ là ẩn ở giao diện, không khóa truy cập thật -
   ai biết đúng id ngăn (qua URL #...) vẫn mở được bình thường.
   ========================================================= */

/* DANH SÁCH TRẮNG: CHỈ các ngăn có id nằm trong đây mới hiện mặc định.
   Mọi ngăn khác (kể cả ngăn MỚI thêm sau này) đều tự động bị ẨN cho đến khi
   bấm chữ phụ đề + nhập mật khẩu. Muốn cho 1 ngăn hiện công khai -> thêm id
   của nó vào mảng này. Muốn ẩn lại -> xóa id khỏi mảng. */
const VISIBLE_SUBJECT_IDS = [
  "tkb",
  "ctdt",
  "pomodoro",
  "de-xuat-lich-hoc",
  "tao-trac-nghiem",
  "ghi-chu-ca-nhan",
  "tu-vung-chuyen-nganh",
  "cnxhkh",
  "lich-su-dang",
  "tu-tuong-hcm",
  "triet-hoc",
  "ktct",
  "qpan",
  "anh-van",
  "avdv",
  "thcn-nc",
];
function hiddenSubjectsIsHidden(id) {
  return !VISIBLE_SUBJECT_IDS.includes(id);
}
const HIDDEN_UNLOCK_CODE = "1111";
const HIDDEN_UNLOCK_KEY = "bungcavoi_hidden_unlocked";

function hiddenSubjectsIsUnlocked() {
  try {
    return sessionStorage.getItem(HIDDEN_UNLOCK_KEY) === "1";
  } catch (e) {
    return false;
  }
}

function hiddenSubjectsSetUnlocked() {
  try {
    sessionStorage.setItem(HIDDEN_UNLOCK_KEY, "1");
  } catch (e) {}
}

function hiddenSubjectsShowPrompt(onSuccess) {
  const overlay = document.createElement("div");
  overlay.className = "hsp-overlay";
  overlay.innerHTML = `
    <style>
      .hsp-overlay{ position:fixed; inset:0; background:rgba(11,61,145,.35); z-index:9999;
        display:flex; align-items:center; justify-content:center; padding:16px; }
      .hsp-box{ background:#fff; border-radius:16px; max-width:360px; width:100%;
        padding:26px 22px 20px; position:relative; box-shadow:0 12px 32px rgba(0,0,0,.25);
        font-family:inherit; text-align:center; }
      .hsp-close{ position:absolute; top:10px; right:10px; width:28px; height:28px;
        border-radius:50%; border:none; background:#eef2f7; color:#5b7590; font-size:15px;
        font-weight:700; cursor:pointer; line-height:1; }
      .hsp-close:hover{ background:#dde6f0; }
      .hsp-title{ font-weight:700; font-size:1.05rem; margin:0 0 8px; color:#0b3d91; }
      .hsp-msg{ font-size:0.86rem; color:#5b7590; line-height:1.5; margin:0 0 16px; }
      .hsp-input{ width:100%; border:1px solid #cfe4f5; border-radius:10px; padding:10px 12px;
        font-size:1rem; text-align:center; margin-bottom:10px; box-sizing:border-box; }
      .hsp-confirm{ border:none; background:#0b3d91; color:#fff; border-radius:10px; width:100%;
        padding:10px 14px; font-size:0.9rem; font-weight:600; cursor:pointer; }
      .hsp-confirm:hover{ background:#092e6e; }
      .hsp-err{ font-size:0.78rem; color:#c0392b; margin:8px 0 0; display:none; }
    </style>
    <div class="hsp-box">
      <button type="button" class="hsp-close" id="hspClose">✕</button>
      <p class="hsp-title">🔒 Câu hỏi kì cục</p>
      <p class="hsp-msg">1 quyển sách dày là quyển sách có bao nhiêu trang?</p>
      <input type="password" inputmode="numeric" class="hsp-input" id="hspInput" />
      <button type="button" class="hsp-confirm" id="hspConfirm">Xác nhận</button>
      <p class="hsp-err" id="hspErr">Mật khẩu không đúng, thử lại nhé.</p>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector("#hspClose").addEventListener("click", close);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) close();
  });

  const input = overlay.querySelector("#hspInput");
  const errMsg = overlay.querySelector("#hspErr");
  const confirmBtn = overlay.querySelector("#hspConfirm");
  input.focus();

  function tryUnlock() {
    if (input.value.trim() === HIDDEN_UNLOCK_CODE) {
      hiddenSubjectsSetUnlocked();
      close();
      if (typeof onSuccess === "function") onSuccess();
    } else {
      errMsg.style.display = "block";
      input.value = "";
      input.focus();
    }
  }
  confirmBtn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });
}

function initHiddenSubjectsToggle() {
  const subtitleEl = document.getElementById("appSubtitle");
  if (!subtitleEl) return;
  subtitleEl.style.cursor = "pointer";
  subtitleEl.addEventListener("click", () => {
    if (hiddenSubjectsIsUnlocked()) return; // đã mở khóa rồi thì thôi, khỏi hỏi lại
    hiddenSubjectsShowPrompt(() => {
      renderTopNav(); // vẽ lại menu trên cho đủ ngăn
      if (!location.hash) renderHome(); // nếu đang ở trang chủ thì vẽ lại luôn
    });
  });
}

renderTopNav();
initNhacNen();
chemcetusInitVisitCounter();
initHiddenSubjectsToggle();
window.addEventListener("hashchange", init);
init();
</script>
