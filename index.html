<title>ChemCetus</title>
<style>
/* ===== Thiết lập chung ===== */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", "Roboto", Arial, sans-serif;
  background-color: #eaf4fb; /* nền xanh nhạt */
  color: #1b2a41;
  min-height: 100vh;
}

/* ===== Header ===== */
.site-header { text-align: center; padding: 32px 16px 20px; }
.logo { margin: 0; font-size: 40px; color: #0b3d91; letter-spacing: 1px; }
.subtitle { margin: 6px 0 0; color: #4a6b8a; font-size: 15px; }

/* ===== Khu vực chính ===== */
#app { max-width: 1000px; margin: 0 auto; padding: 10px 20px 60px; }

/* ===== Trang chủ: lưới các "ngăn" ===== */
.drawer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.drawer-card {
  position: relative;
  background: #ffffff;
  border: 2px solid #cfe4f5;
  border-radius: 16px;
  padding: 22px 18px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  text-align: left;
}
.drawer-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(11, 61, 145, 0.15);
  border-color: #0b3d91;
}
.drawer-icon { font-size: 30px; margin-bottom: 10px; display: block; }
.drawer-title { font-size: 18px; font-weight: 600; color: #0b3d91; margin: 0 0 4px; }
.drawer-desc { font-size: 13px; color: #5b7590; margin: 0; }

.pin-btn {
  position: absolute;
  top: 10px; right: 10px;
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  color: #b9c9db; line-height: 1; padding: 4px;
}
.pin-btn.pinned { color: #f4b400; }
.pin-btn:hover { transform: scale(1.15); }

.pinned-label {
  display: inline-block;
  font-size: 11px;
  background: #fff4d6;
  color: #a8760a;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}

/* ===== Trang chi tiết ===== */
.detail-view { animation: fadeIn 0.2s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.back-btn {
  background: #0b3d91;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  margin-bottom: 20px;
}
.back-btn:hover { background: #092e6e; }

.detail-title { color: #0b3d91; font-size: 26px; margin-bottom: 18px; }

/* ===== Bảng thời khóa biểu ===== */
.tkb-section { margin-bottom: 34px; }
.tkb-section h2 {
  font-size: 18px;
  color: #0b3d91;
  border-left: 5px solid #0b3d91;
  padding-left: 10px;
  margin-bottom: 6px;
}
.tkb-note { font-size: 13px; color: #6a7f96; font-style: italic; margin: 0 0 12px 15px; }

.tkb-table-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #cfe4f5;
}
table.tkb { width: 100%; border-collapse: collapse; background: #fff; min-width: 200px; }
table.tkb th, table.tkb td {
  border: 1px solid #dbe9f5;
  padding: 8px 12px;
  text-align: center;
  font-size: 14px;
}
table.tkb thead th { background: #0b3d91; color: #fff; font-size: 13px; }
table.tkb .buoi-header { background: #1857c4; }
table.tkb tbody tr:nth-child(even) td { background: #f7fbff; }

.source-note { text-align: center; font-size: 13px; color: #3a5a80; margin-top: 10px; }

/* ===== Chương Trình Khung ===== */
.ctdt-meta {
  font-size: 14px;
  color: #3a5a80;
  background: #eef6ff;
  border: 1px solid #cfe4f5;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.hocky-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}

.hocky-col {
  background: #fff;
  border: 1px solid #cfe4f5;
  border-radius: 12px;
  overflow: hidden;
}

.hocky-header {
  background: #0b3d91;
  color: #fff;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
}

.hocky-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mon-card {
  background: #f7fbff;
  border: 1px solid #e2eef8;
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12.5px;
  line-height: 1.4;
}

.mon-ma { display: block; font-size: 10.5px; color: #8098b3; }
.mon-tc { display: inline-block; color: #0b3d91; font-weight: 600; margin-right: 4px; }
.mon-ten { color: #1b2a41; }
.mon-core { color: #d1342b; font-weight: 700; }

.nhom-box {
  border: 1px dashed #f4b400;
  background: #fffdf3;
  border-radius: 8px;
  padding: 8px;
  margin-top: 4px;
}

.nhom-ten { font-size: 12px; font-weight: 700; color: #a8760a; margin: 0 0 6px; }
.nhom-chuyennganh { border-color: #0b3d91; background: #eef6ff; }

.cn-list { display: flex; flex-direction: column; gap: 10px; }

.cn-details {
  border: 1px solid #cfe4f5;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}

.cn-details summary {
  cursor: pointer;
  list-style: none;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  color: #0b3d91;
  background: #eef6ff;
}

.cn-details summary::-webkit-details-marker { display: none; }

.cn-tc { font-size: 12px; font-weight: 500; color: #4a6b8a; }

.cn-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cn-group {
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid transparent;
}

.cn-group-ten {
  font-size: 12.5px;
  font-weight: 700;
  margin: 0 0 8px;
}

.cn-group-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
}

/* Bắt buộc theo chuyên ngành: xanh biển lam */
.cn-group-bb {
  background: #e3edfb;
  border-color: #9fbfec;
}
.cn-group-bb .cn-group-ten { color: #0b3d91; }
.cn-group-bb .mon-card { background: #f2f7fd; border-color: #cddff5; }

/* Nhóm A tự chọn: vàng nhạt */
.cn-group-a {
  background: #fffaeb;
  border-color: #f6d98a;
}
.cn-group-a .cn-group-ten { color: #a8760a; }
.cn-group-a .mon-card { background: #fffdf5; border-color: #f4e6bd; }

/* Nhóm B tự chọn (4 chuyên ngành): vàng đậm hơn để phân biệt rõ với nhóm A */
.cn-group-b-dam {
  background: #fdedb0;
  border-color: #e0ac0c;
}
.cn-group-b-dam .cn-group-ten { color: #7a5300; }
.cn-group-b-dam .mon-card { background: #fff2c2; border-color: #e8c455; }

/* ===== Đồng hồ Pomodoro ===== */
.pomo-wrap {
  max-width: 420px;
  margin: 20px auto 0;
  text-align: center;
  background: #fff;
  border: 1px solid #cfe4f5;
  border-radius: 20px;
  padding: 36px 24px;
}

.pomo-mode {
  display: inline-block;
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 14px;
  padding: 6px 16px;
  border-radius: 999px;
}
.pomo-mode-work { background: #eef6ff; color: #0b3d91; }
.pomo-mode-break { background: #fff4d6; color: #a8760a; }

.pomo-time {
  font-size: 68px;
  font-weight: 700;
  letter-spacing: 2px;
  margin: 6px 0 14px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}
.pomo-time-work { color: #0b3d91; }
.pomo-time-break { color: #a8760a; }

.pomo-cycles { font-size: 13px; color: #5b7590; margin: 0 0 24px; }

.pomo-buttons { display: flex; gap: 12px; justify-content: center; }

.pomo-btn {
  border: none;
  padding: 12px 26px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.pomo-btn-primary { background: #0b3d91; color: #fff; }
.pomo-btn-primary:hover { background: #092e6e; }
.pomo-btn-secondary { background: #eef2f7; color: #3a5a80; }
.pomo-btn-secondary:hover { background: #dde6f0; }
.pomo-btn-danger { background: #fdeaea; color: #c0392b; }
.pomo-btn-danger:hover { background: #fad9d9; }

/* ===== Watermark chống sao chép ===== */
.watermark-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.5px;
  color: #1b2a41;
  opacity: 0.75;
  pointer-events: none;
  z-index: 999;
  user-select: none;
  padding: 0 16px;
}
.watermark-bar a {
  pointer-events: auto;
  color: inherit;
  text-decoration: underline;
  cursor: pointer;
}
.watermark-brand {
  font-size: 20px;
  font-weight: 800;
  color: #ff5722;
  text-decoration: none;
  letter-spacing: 0.5px;
}

@media (max-width: 480px) {
  .watermark-bar { font-size: 10.5px; line-height: 1.4; bottom: 6px; }
  .watermark-brand { font-size: 16px; }
}

/* ===== Thanh nút trên mỗi trang chi tiết ===== */
.detail-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.print-btn {
  background: #eef2f7;
  color: #3a5a80;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}
.print-btn:hover { background: #dde6f0; }

/* ===== Danh sách file trong 1 thư mục tài liệu ===== */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  padding: 12px 14px;
  text-decoration: none;
  color: #1b2a41;
  font: inherit;
  width: 100%;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}
.file-item:hover {
  border-color: #0b3d91;
  box-shadow: 0 4px 14px rgba(11, 61, 145, 0.14);
  transform: translateY(-1px);
}
.file-icon { font-size: 20px; flex-shrink: 0; }
.file-name { flex: 1; font-size: 14px; text-align: left; }
.file-download {
  font-size: 12px;
  font-weight: 600;
  color: #0b3d91;
  white-space: nowrap;
}

/* ===== Màn xem trước 1 file ===== */
.file-preview-title {
  color: #0b3d91;
  font-size: 18px;
  margin: 0 0 14px;
}
.file-preview-frame-wrap {
  width: 100%;
  aspect-ratio: 16 / 10;
  border: 1px solid #cfe4f5;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
}
.file-preview-frame { width: 100%; height: 100%; border: 0; }

.folder-block { margin-bottom: 6px; }
.folder-ten {
  font-size: 13px;
  font-weight: 700;
  color: #3a5a80;
  margin: 0 0 8px;
}

/* ===== Thanh điều hướng ngang (Tính năng & Tài liệu) ===== */
.top-nav {
  background: #0b3d91;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  padding: 8px 10px;
  position: relative;
  z-index: 80;
}
.top-nav-btn {
  background: none;
  border: none;
  color: #fff;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 8px;
  font-family: inherit;
}
.top-nav-btn:hover, .top-nav-btn.active { background: rgba(255,255,255,0.18); }

.top-nav-panel {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 3px solid #0b3d91;
  box-shadow: 0 12px 24px rgba(11,61,145,0.25);
  padding: 18px 20px;
  max-width: 900px;
  margin: 0 auto;
  display: none;
  max-height: 70vh;
  overflow-y: auto;
  text-align: left;
}
.top-nav-panel.open { display: block; }

.top-nav-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}
.top-nav-group-title {
  font-size: 12px;
  font-weight: 700;
  color: #0b3d91;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 0 0 8px;
  border-left: 3px solid #0b3d91;
  padding-left: 8px;
}
.top-nav-links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.top-nav-link {
  background: #eef6ff;
  border: 1px solid #cfe4f5;
  color: #0b3d91;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
}
.top-nav-link:hover { background: #0b3d91; color: #fff; }
.top-nav-empty { font-size: 12px; color: #98a8bd; font-style: italic; margin: 0 0 4px; }

@media (max-width: 640px) {
  .top-nav-btn { padding: 8px 12px; font-size: 13px; }
  .top-nav-panel { max-height: 60vh; }
}

/* ===== Khi in trang / lưu thành PDF ===== */
@media print {
  .back-btn, .print-btn, .pin-btn, .drawer-grid { display: none !important; }
  body { background: #fff; }
  .watermark-bar {
    opacity: 0.7;
    position: fixed;
    /* in lặp lại watermark ở cả đầu trang khi in nhiều trang */
  }
  .detail-title { color: #000; }
}

/* ===== Trắc nghiệm (Quiz) ===== */
.quiz-start {
  text-align: center;
  background: #fff;
  border: 1px solid #cfe4f5;
  border-radius: 16px;
  padding: 40px 20px;
}
.quiz-start-total { font-size: 15px; color: #3a5a80; margin-bottom: 20px; }

.quiz-start-block {
  background: #f7fbff;
  border: 1px solid #e2eef8;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  text-align: left;
}
.quiz-start-label { font-weight: 600; color: #0b3d91; margin: 0 0 10px; font-size: 14px; }
.quiz-start-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }

.quiz-number-input {
  width: 90px;
  padding: 10px 12px;
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  font-size: 15px;
  text-align: center;
}
.quiz-select-input {
  flex: 1;
  min-width: 180px;
  padding: 10px 12px;
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  font-size: 14px;
  background: #fff;
}

.quiz-start-block-glossary { background: #eef6ff; border-color: #9fbfec; }
.quiz-glossary-hint { font-size: 12.5px; color: #5b7590; margin: 0 0 10px; }

.glossary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
}
.glossary-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f7fbff;
  border: 1px solid #e2eef8;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13.5px;
}
.glossary-a { color: #1b2a41; font-weight: 600; }
.glossary-arrow { color: #9fbfec; flex-shrink: 0; }
.glossary-b { color: #0b3d91; }

.quiz-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  color: #3a5a80;
  background: #eef6ff;
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  padding: 8px 14px;
  margin-bottom: 16px;
}
.quiz-back-link {
  background: none;
  border: 1px solid #9fbfec;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12.5px;
  color: #0b3d91;
  cursor: pointer;
}
.quiz-back-link:hover { background: #dce9fb; }

.quiz-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.quiz-question-col { flex: 1; min-width: 260px; }
.quiz-nav-col {
  width: 220px;
  background: #fff;
  border: 1px solid #cfe4f5;
  border-radius: 12px;
  padding: 12px;
}

.quiz-question-text {
  font-size: 16px;
  font-weight: 600;
  color: #1b2a41;
  margin: 0 0 16px;
}

.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.quiz-option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  background: #fff;
  font: inherit;
  color: #1b2a41;
  cursor: pointer;
}
.quiz-option:hover:not(:disabled) { border-color: #9fbfec; }
.quiz-option:disabled { cursor: default; }
.quiz-option-text { flex: 1; }

/* Vòng tròn radio bên trái: rỗng khi chưa chọn, đặc xanh khi đã chọn */
.quiz-radio {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #b9c9db;
  flex-shrink: 0;
  position: relative;
}
.quiz-radio.filled { border-color: #0b3d91; }
.quiz-radio.filled::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: #0b3d91;
}

/* Đáp án đúng (luôn hiện xanh sau khi đã trả lời, kể cả không phải ô mình chọn) */
.quiz-option.correct { border-color: #2e7d32; background: #eaf7ea; }
.quiz-option.correct .quiz-radio.filled { border-color: #2e7d32; }
.quiz-option.correct .quiz-radio.filled::after { background: #2e7d32; }

/* Ô mình chọn mà sai thì đỏ */
.quiz-option.wrong { border-color: #c0392b; background: #fdeceb; }
.quiz-option.wrong .quiz-radio.filled { border-color: #c0392b; }
.quiz-option.wrong .quiz-radio.filled::after { background: #c0392b; }

/* Icon tròn ✓ / ✕ bên phải */
.quiz-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #fff;
  font-weight: 700;
}
.quiz-icon-check { background: #2e7d32; }
.quiz-icon-cross { background: #c0392b; }

.quiz-footer-buttons { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.quiz-nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.quiz-nav-btn {
  aspect-ratio: 1;
  border: 1px solid #cfe4f5;
  border-radius: 8px;
  background: #f7fbff;
  font-size: 12.5px;
  color: #3a5a80;
  cursor: pointer;
}
.quiz-nav-btn:hover { border-color: #0b3d91; }
.quiz-nav-btn.done { background: #0b3d91; color: #fff; border-color: #0b3d91; }
.quiz-nav-btn.current { outline: 2px solid #f4b400; outline-offset: 1px; }

.quiz-result-summary {
  text-align: center;
  background: #eef6ff;
  border: 1px solid #cfe4f5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
}
.quiz-score { font-size: 17px; color: #0b3d91; margin: 0 0 14px; }

.quiz-result-item {
  border: 1px solid #cfe4f5;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
}
.quiz-result-item.correct { border-color: #8fc98f; background: #f3faf3; }
.quiz-result-item.wrong { border-color: #e39b93; background: #fdf3f3; }
.quiz-result-item p { margin: 3px 0; }

/* ===== Nhạc nền ===== */
.nhac-panel {

/* Vẽ 1 thẻ môn học nhỏ */
function renderMonHocCard(m) {
  return `
    <div class="mon-card">
      ${m.ma ? `<span class="mon-ma">${m.ma}</span>` : ""}
      <span class="mon-tc">${m.tc}</span>
      <span class="mon-ten">${m.ten}${m.core ? ' <span class="mon-core" title="Học phần cốt lõi">(*)</span>' : ""}</span>
    </div>
  `;
}

/* Vẽ 1 cột học kỳ trong chương trình khung */
function renderHocKyCard(hk) {
  const monHocHtml = hk.monHoc.map(renderMonHocCard).join("");
  const nhomHtml = hk.nhom
    .map(
      (n) => `
      <div class="nhom-box">
        <p class="nhom-ten">${n.ten}</p>
        ${n.options.map(renderMonHocCard).join("")}
      </div>
    `
    )
    .join("");

  const chuyenNganhHtml = hk.ghiChuChuyenNganh
    ? `<div class="nhom-box nhom-chuyennganh">
         <p class="nhom-ten">Học phần bắt buộc + tự chọn theo chuyên ngành**</p>
         <p class="tkb-note" style="margin:4px 0 0;">** Xem chi tiết 6 chuyên ngành ở bảng bên dưới trang này.</p>
       </div>`
    : "";

  return `
    <div class="hocky-col">
      <div class="hocky-header">
        <span>HỌC KỲ ${hk.so}</span>
        <span class="hocky-tc">${hk.tinChi} tín chỉ</span>
      </div>
      <div class="hocky-body">
        ${monHocHtml}
        ${nhomHtml}
        ${chuyenNganhHtml}
      </div>
    </div>
  `;
}

/* Vẽ 1 nhóm môn (bắt buộc / nhóm A / nhóm B) với màu riêng */
function renderCnGroup(tenNhom, dsMon, mauClass) {
  return `
    <div class="cn-group ${mauClass}">
      <p class="cn-group-ten">${tenNhom}</p>
      <div class="cn-group-body">${dsMon.map(renderMonHocCard).join("")}</div>
    </div>
  `;
}

/* Vẽ 1 chuyên ngành (dùng thẻ <details> để bấm mở/đóng gọn gàng) */
function renderChuyenNganh(cn, index) {
  const batBuocHtml = renderCnGroup("Học phần bắt buộc theo chuyên ngành", cn.batBuoc, "cn-group-bb");
  const nhomAHtml = renderCnGroup(cn.nhomA.ten, cn.nhomA.options, "cn-group-a");
  // Nhóm B: 4 chuyên ngành tô vàng đậm hơn để phân biệt, 2 chuyên ngành còn lại dùng chung màu với nhóm A
  const nhomBClass = cn.nhomBDam ? "cn-group-b-dam" : "cn-group-a";
  const nhomBHtml = renderCnGroup(cn.nhomB.ten, cn.nhomB.options, nhomBClass);

  return `
    <details class="cn-details" ${index === 0 ? "open" : ""}>
      <summary>
        <span class="cn-ten">${cn.ten}</span>
        <span class="cn-tc">${cn.tongTinChi}</span>
      </summary>
      <div class="cn-body">
        ${batBuocHtml}
        ${nhomAHtml}
        ${nhomBHtml}
      </div>
    </details>
  `;
}

function renderChuongTrinhKhung() {
  const hocKyHtml = CTDT_HOC_KY.map(renderHocKyCard).join("");
  const chuyenNganhHtml = CTDT_CHUYEN_NGANH.map(renderChuyenNganh).join("");

/* =========================================================
   ĐỒNG HỒ POMODORO
   25 phút tập trung -> 5 phút nghỉ -> lặp lại.
   Bộ đếm giờ chạy ở phạm vi toàn cục (module scope) nên vẫn
   tiếp tục chạy ngầm kể cả khi bạn chuyển sang xem ngăn khác,
   giống hệt đồng hồ pomodoro thật.
   ========================================================= */

const POMO_WORK_SECONDS = 25 * 60;
const POMO_BREAK_SECONDS = 5 * 60;

const pomoState = {
  mode: "work", // "work" | "break"
  running: false,
  cyclesDone: 0,
  remainingMs: POMO_WORK_SECONDS * 1000, // dùng khi đang tạm dừng / chưa bắt đầu
  phaseEndTime: null, // mốc thời gian thực (Date.now()) khi phase hiện tại kết thúc; null nếu đang tạm dừng
  timerId: null,
};

function pomoFormatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = (totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

/* Dùng chung 1 AudioContext cho cả trang, tránh tạo quá nhiều context khi báo chuông liên tục */
let pomoAudioCtx = null;
function pomoGetAudioCtx() {
  if (!pomoAudioCtx) {
    try {
      pomoAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      pomoAudioCtx = null;
    }
  }
  return pomoAudioCtx;
}

/* Phát 1 tiếng "beep" ngắn bằng Web Audio API, không cần file âm thanh nào */
function pomoPlayOneBeep() {
  const ctx = pomoGetAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } catch (e) {
    /* Một số trình duyệt chặn âm thanh tự động, bỏ qua lỗi này */
  }
}

/* Chuông báo hết giờ: kêu liên tục (1 beep mỗi 0.7s) tối đa 10 giây,
   hoặc tắt sớm nếu bồ bấm nút "Tắt âm thanh" */
let pomoAlarmIntervalId = null;
let pomoAlarmTimeoutId = null;

function pomoStartAlarm() {
  pomoStopAlarm(); // phòng khi còn chuông cũ chưa tắt hết
  pomoPlayOneBeep();
  pomoAlarmIntervalId = setInterval(pomoPlayOneBeep, 700);
  pomoAlarmTimeoutId = setTimeout(pomoStopAlarm, 10000); // tự tắt sau 10 giây
  pomoShowStopAlarmBtn(true);
}

function pomoStopAlarm() {
  clearInterval(pomoAlarmIntervalId);
  clearTimeout(pomoAlarmTimeoutId);
  pomoAlarmIntervalId = null;
  pomoAlarmTimeoutId = null;
  pomoShowStopAlarmBtn(false);
}

function pomoShowStopAlarmBtn(show) {
  const btn = document.getElementById("pomoStopAlarmBtn");
  if (btn) btn.style.display = show ? "inline-block" : "none";
}

/* Xin quyền hiện thông báo (chỉ hỏi 1 lần khi bồ bấm Bắt đầu lần đầu) */
function pomoRequestNotifyPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

/* Hiện thông báo đẩy góc màn hình khi hết 1 chu kỳ */
function pomoShowNotification(text) {
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Bụng Cá Voi 🍅", { body: text });
    } catch (e) {
      /* bỏ qua nếu trình duyệt chặn */
    }
  }
}

/* Nhấp nháy tiêu đề tab vài giây để báo hết giờ, kể cả khi đang ở tab khác */
let pomoTitleFlashId = null;
function pomoFlashTitle(text) {
  let showAlert = true;
  let ticks = 0;
  clearInterval(pomoTitleFlashId);
  pomoTitleFlashId = setInterval(() => {
    document.title = showAlert ? `⏰ ${text}` : "Bụng Cá Voi";
    showAlert = !showAlert;
    ticks++;
    if (ticks >= 6) {
      clearInterval(pomoTitleFlashId);
      pomoTitleFlashId = null;
    }
  }, 600);
}

/* Cập nhật lại giao diện đồng hồ (nếu đang mở đúng ngăn Pomodoro) */
function pomoUpdateDisplay() {
  const timeEl = document.getElementById("pomoTime");
  if (!timeEl) return; // đang không ở trang Pomodoro thì thôi, khỏi vẽ

  const modeEl = document.getElementById("pomoMode");
  const cycleEl = document.getElementById("pomoCycles");
  const startBtn = document.getElementById("pomoStartBtn");

  const secondsLeft = Math.max(0, Math.round(pomoState.remainingMs / 1000));
  timeEl.textContent = pomoFormatTime(secondsLeft);

  const isWork = pomoState.mode === "work";
  modeEl.textContent = isWork ? "🍅 Thời gian tập trung" : "☕ Giờ nghỉ ngơi";
  modeEl.className = "pomo-mode " + (isWork ? "pomo-mode-work" : "pomo-mode-break");
  timeEl.className = "pomo-time " + (isWork ? "pomo-time-work" : "pomo-time-break");

  cycleEl.textContent = `Đã hoàn thành: ${pomoState.cyclesDone} chu kỳ`;
  startBtn.textContent = pomoState.running ? "Tạm dừng" : "Bắt đầu";

  // Hiện thời gian đếm ngược ngay trên tiêu đề tab, để bồ chỉ cần liếc
  // qua thanh tab trình duyệt là biết còn bao lâu, không cần mở đúng trang.
  if (pomoState.running && !pomoTitleFlashId) {
    const icon = isWork ? "🍅" : "☕";
    document.title = `${pomoFormatTime(secondsLeft)} ${icon} Bụng Cá Voi`;
  } else if (!pomoState.running && !pomoTitleFlashId) {
    document.title = "Bụng Cá Voi";
  }
}

/* Gọi định kỳ để cập nhật giao diện. Vì tính theo mốc thời gian thực
   (Date.now()) chứ không đếm lùi từng giây, nên dù trình duyệt "ghìm"
   interval khi tab chạy nền (throttle), lúc quay lại nó vẫn tự tính ra
   đúng thời gian thực còn lại, không bị chạy chậm/lệch giờ. */
function pomoTick() {
  if (!pomoState.running || pomoState.phaseEndTime == null) return;

  let now = Date.now();

  // Dùng vòng lặp để xử lý cả trường hợp bị ghìm lâu, trôi qua nhiều
  // chu kỳ cùng lúc (ví dụ để tab chạy nền cả tiếng đồng hồ)
  while (pomoState.phaseEndTime - now <= 0) {
    if (pomoState.mode === "work") {
      pomoState.cyclesDone++;
      pomoState.mode = "break";
      pomoState.phaseEndTime += POMO_BREAK_SECONDS * 1000;
      pomoStartAlarm();
      pomoFlashTitle("Hết giờ! Nghỉ 5 phút nhé");
      pomoShowNotification("Hết 25 phút tập trung rồi, nghỉ 5 phút thôi 🎉");
    } else {
      pomoState.mode = "work";
      pomoState.phaseEndTime += POMO_WORK_SECONDS * 1000;
      pomoStartAlarm();
      pomoFlashTitle("Hết giờ nghỉ! Bắt đầu tập trung");
      pomoShowNotification("Hết giờ nghỉ, quay lại tập trung 25 phút nào 🍅");
    }
    now = Date.now();
  }

  pomoState.remainingMs = pomoState.phaseEndTime - now;
  pomoUpdateDisplay();
}

function pomoEnsureIntervalRunning() {
  if (pomoState.timerId) return; // đã có 1 interval chạy rồi, khỏi tạo thêm
  // Chạy mỗi 250ms cho mượt (giá trị hiển thị vẫn luôn đúng vì tính từ
  // mốc thời gian thực, không phụ thuộc tick có đều đặn hay không)
  pomoState.timerId = setInterval(pomoTick, 250);
}

// Khi tab bị ẩn đi rồi quay lại (chuyển tab, thu nhỏ trình duyệt...),
// trình duyệt thường ghìm interval; nghe sự kiện này để cập nhật lại
// đúng thời gian thực ngay lập tức thay vì đợi tick tiếp theo.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) pomoTick();
});

function pomoToggleStartPause() {
  pomoRequestNotifyPermission();

  if (pomoState.running) {
    // Tạm dừng: lưu lại số ms còn thiếu, xoá mốc kết thúc
    pomoState.remainingMs = Math.max(0, pomoState.phaseEndTime - Date.now());
    pomoState.phaseEndTime = null;
    pomoState.running = false;
  } else {
    // Bắt đầu / tiếp tục: tính mốc kết thúc mới dựa trên số ms còn lại
    pomoState.phaseEndTime = Date.now() + pomoState.remainingMs;
    pomoState.running = true;
    pomoEnsureIntervalRunning();
  }

  pomoUpdateDisplay();
}

function pomoReset() {
  pomoState.running = false;
  pomoState.mode = "work";
  pomoState.remainingMs = POMO_WORK_SECONDS * 1000;
  pomoState.phaseEndTime = null;
  pomoStopAlarm();
  clearInterval(pomoTitleFlashId);
  pomoTitleFlashId = null;
  document.title = "Bụng Cá Voi";
  pomoUpdateDisplay();
}

function renderPomodoro() {
  return `
    <div class="pomo-wrap">
      <p id="pomoMode" class="pomo-mode pomo-mode-work">🍅 Thời gian tập trung</p>
      <div id="pomoTime" class="pomo-time pomo-time-work">${pomoFormatTime(Math.round(pomoState.remainingMs / 1000))}</div>
      <p id="pomoCycles" class="pomo-cycles">Đã hoàn thành: ${pomoState.cyclesDone} chu kỳ</p>
      <div class="pomo-buttons">
        <button id="pomoStartBtn" class="pomo-btn pomo-btn-primary">${pomoState.running ? "Tạm dừng" : "Bắt đầu"}</button>
        <button id="pomoResetBtn" class="pomo-btn pomo-btn-secondary">Đặt lại</button>
        <button id="pomoStopAlarmBtn" class="pomo-btn pomo-btn-danger" style="display:none;">🔕 Tắt âm thanh</button>
      </div>
      <p class="tkb-note" style="text-align:center; margin-top:22px;">
        Phương pháp Pomodoro: tập trung làm việc 25 phút, sau đó nghỉ 5 phút, rồi lặp lại chu kỳ.
        Hết mỗi chu kỳ, chuông sẽ kêu liên tục tối đa 10 giây (hoặc bấm "Tắt âm thanh" để tắt sớm),
        tiêu đề tab cũng nhấp nháy báo hết giờ và có thể hiện thông báo góc màn hình nếu bồ cho phép.
      </p>
    </div>
  `;
}

/* Gắn sự kiện cho nút bấm ngay sau khi trang Pomodoro được vẽ ra màn hình */
function initPomodoroUI() {
  document.getElementById("pomoStartBtn").addEventListener("click", pomoToggleStartPause);
  document.getElementById("pomoResetBtn").addEventListener("click", pomoReset);
  document.getElementById("pomoStopAlarmBtn").addEventListener("click", pomoStopAlarm);
  pomoEnsureIntervalRunning();
  pomoUpdateDisplay();
  // Nếu chuông đang kêu từ trước (do bồ rời trang giữa lúc báo hết giờ) thì hiện lại nút tắt
  pomoShowStopAlarmBtn(!!pomoAlarmIntervalId);
}

/* =========================================================
   NGĂN TÀI LIỆU DẠNG CÂY: TRƯỜNG -> THƯ MỤC -> FILE
   Dùng chung cho mọi môn học (không riêng Hóa Đại Cương).
   - Mỗi môn (school-subject) có thể có tài liệu sưu tầm từ NHIỀU
     TRƯỜNG khác nhau (HUIT, HCMUS, HCMUT...)
   - Mỗi trường có 1 hoặc nhiều THƯ MỤC (Bài giảng thầy X, Bài tập,
     Đề thi, Tài liệu sưu tầm...)
   - Mỗi thư mục có nhiều FILE
   - Bấm vào tên file sẽ MỞ XEM TRƯỚC ngay trên web (không tải về
     ngay), bên trong màn xem trước mới có nút "Tải xuống" — để
     người xem biết rõ nội dung trước khi quyết định tải.
   - path: đường dẫn tương đối NGUYÊN VĂN tới file trong repo GitHub
     (kể cả có dấu / khoảng trắng / ngoặc [] cũng viết y hệt tên file
     thật đã tải lên GitHub — trình duyệt tự hiểu, KHÔNG cần đổi tên
     file trên GitHub cho khớp code)
   - Nếu file quá lớn (>25MB) không kéo-thả lên GitHub được, dùng
     link ngoài (Google Drive...) bằng cách để thẳng URL đầy đủ
     (https://...) vào path
   - LƯU Ý: xem trước PPTX/DOCX/XLSX cần chạy trên web đã đưa lên
     mạng (GitHub Pages), không xem trước được khi mở file index.html
     trực tiếp trên máy (do trình xem cần tải file qua internet).
     Riêng PDF thì mở trực tiếp trên máy vẫn xem trước được bình thường.
   ========================================================= */

/* Chuyển 1 chuỗi thành dạng an toàn để nhét vào data-* attribute
   (dùng encodeURIComponent cho chắc, tránh lỗi dấu ngoặc kép/ký tự lạ) */
function fbEncode(str) {
  return encodeURIComponent(str);
}

/* ---- MÀN DANH SÁCH: Trường -> Thư mục -> tên file (bấm để xem trước) ---- */

function renderFbFileButton(f) {
  const locked = !!f.khoa;
  const isLink = !!f.link;
  return `
    <button type="button" class="file-item" data-path="${fbEncode(f.path)}" data-name="${fbEncode(f.ten)}" data-khoa="${locked ? "1" : "0"}" data-link="${isLink ? "1" : "0"}">
      <span class="file-icon">${isLink ? "🌐" : "📄"}</span>
      <span class="file-name">${f.ten}</span>
      <span class="file-download">${isLink ? "Mở web ↗" : "Xem trước 👁"}</span>
    </button>
  `;
}

function renderFbFolder(folder) {
  return `
    <div class="folder-block">
      <p class="folder-ten">📁 ${folder.ten}</p>
      <div class="file-list">${folder.files.map(renderFbFileButton).join("")}</div>
    </div>
  `;
}

function renderFbSchool(truong, index) {
  return `
    <details class="cn-details" ${index === 0 ? "open" : ""}>
      <summary><span class="cn-ten">🏫 ${truong.ten}</span></summary>
      <div class="cn-body">${truong.folders.map(renderFbFolder).join("")}</div>
    </details>
  `;
}

function renderFbList(schools) {
  return `<div class="cn-list">${schools.map(renderFbSchool).join("")}</div>`;
}

/* ---- MÀN XEM TRƯỚC 1 FILE ---- */

/* Chọn trình xem phù hợp theo đuôi file: PDF thì trình duyệt tự đọc được,
   PPTX/DOCX/XLSX thì nhờ Microsoft Office Viewer đọc qua internet */
function fbBuildViewerSrc(absoluteUrl, path) {
  const ext = path.split(".").pop().toLowerCase();
  const officeExts = ["ppt", "pptx", "doc", "docx", "xls", "xlsx"];
  if (officeExts.includes(ext)) {
    return "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(absoluteUrl);
  }
  return absoluteUrl; // pdf và các loại trình duyệt tự đọc được
}

function renderFbPreview(path, name) {
  const absoluteUrl = new URL(path, window.location.href).href;
  const viewerSrc = fbBuildViewerSrc(absoluteUrl, path);

  return `
    <div class="file-preview">
      <div class="detail-toolbar">
        <button type="button" class="back-btn" id="fbBackBtn">← Quay lại danh sách</button>
        <a class="print-btn" href="${path}" download target="_blank" rel="noopener">⬇ Tải xuống file gốc</a>
      </div>
      <h3 class="file-preview-title">${name}</h3>
      <div class="file-preview-frame-wrap">
        <iframe src="${viewerSrc}" class="file-preview-frame" allowfullscreen></iframe>
      </div>
      <p class="tkb-note">
        Không xem được bản xem trước (thường do đang mở file index.html trực tiếp
        trên máy thay vì bản đã đưa lên mạng)? Bấm "Tải xuống file gốc" ở trên để
        mở bằng PowerPoint / trình đọc PDF trên máy nhé.
      </p>
    </div>
  `;
}

/* ---- Gắn tương tác: bấm tên file -> xem trước, bấm "Quay lại" -> về danh sách ---- */

function initFileBrowser(containerId, schools, nganTen) {
  const container = document.getElementById(containerId);
  if (!container) return;

  function showList() {
    container.innerHTML = renderFbList(schools);
    container.querySelectorAll(".file-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        const path = decodeURIComponent(btn.dataset.path);
        const name = decodeURIComponent(btn.dataset.name);
        if (window.gtag) {
          gtag("event", "xem_file", { file_ten: name, ngan_ten: nganTen || "" });
        }
        if (btn.dataset.link === "1") {
          window.open(path, "_blank", "noopener");
          return;
        }
        if (btn.dataset.khoa === "1") {
          fbShowLockedNotice(() => showPreview(path, name));
        } else {
          showPreview(path, name);
        }
      });
    });
  }

  function showPreview(path, name) {
    container.innerHTML = renderFbPreview(path, name);
    document.getElementById("fbBackBtn").addEventListener("click", showList);
  }

  showList();
}

/* ---- "Thông báo lỗi" giả che tài liệu bị khoá (khoa: true) ----
   Trông y hệt 1 lỗi tải xem trước thông thường. Bấm nút đỏ X thì
   đóng lại (thoát về danh sách như chưa có gì xảy ra). Bấm "Sửa lỗi"
   mới lộ ra ô nhập mã — nhập đúng mã thì mở xem trước file thật.
   LƯU Ý: đây chỉ là rào chắn ở giao diện, không phải bảo mật thật sự
   (mã và đường link file vẫn nằm trong mã nguồn trang), chỉ đủ để
   người thường không cố ý bấm sai vào phá đám thôi. */
const FB_UNLOCK_CODE = "1111";

function fbShowLockedNotice(onUnlock) {
  const overlay = document.createElement("div");
  overlay.className = "fb-lock-overlay";
  overlay.innerHTML = `
    <style>
      .fb-lock-overlay{ position:fixed; inset:0; background:rgba(20,24,30,.55); z-index:9999;
        display:flex; align-items:center; justify-content:center; padding:16px; }
      .fb-lock-box{ background:#fff; border-radius:12px; max-width:380px; width:100%;
        padding:22px 20px 18px; position:relative; box-shadow:0 12px 32px rgba(0,0,0,.25);
        font-family:inherit; text-align:left; }
      .fb-lock-close{ position:absolute; top:10px; right:10px; width:28px; height:28px;
        border-radius:50%; border:none; background:#e74c3c; color:#fff; font-size:15px;
        font-weight:700; cursor:pointer; line-height:1; }
      .fb-lock-close:hover{ background:#c0392b; }
      .fb-lock-title{ font-weight:700; font-size:0.98rem; margin:0 0 8px; color:#2c2c2c; }
      .fb-lock-msg{ font-size:0.86rem; color:#555; line-height:1.5; margin:0 0 14px; }
      .fb-lock-code{ font-size:0.74rem; color:#999; margin:0 0 14px; font-family:monospace; }
      .fb-lock-fixlink{ font-size:0.78rem; color:#8a8f98; background:none; border:none;
        cursor:pointer; text-decoration:underline; padding:0; }
      .fb-lock-input-row{ display:none; margin-top:12px; gap:8px; }
      .fb-lock-input-row.fb-show{ display:flex; }
      .fb-lock-input{ flex:1; border:1px solid #d7d7d7; border-radius:7px; padding:7px 10px;
        font-size:0.86rem; }
      .fb-lock-confirm{ border:none; background:#1f3a5f; color:#fff; border-radius:7px;
        padding:7px 14px; font-size:0.84rem; font-weight:600; cursor:pointer; }
      .fb-lock-err{ font-size:0.78rem; color:#c0392b; margin:6px 0 0; display:none; }
    </style>
    <div class="fb-lock-box">
      <button type="button" class="fb-lock-close" id="fbLockClose">✕</button>
      <p class="fb-lock-title">⚠️ Không thể tải bản xem trước</p>
      <p class="fb-lock-msg">
        Đã xảy ra lỗi khi tải nội dung tài liệu này. Vui lòng thử lại sau,
        hoặc chọn tài liệu khác trong danh sách.
      </p>
      <p class="fb-lock-code">Mã lỗi: DOC_PREVIEW_UNAVAILABLE</p>
      <button type="button" class="fb-lock-fixlink" id="fbLockFixLink">Sửa lỗi</button>
      <div class="fb-lock-input-row" id="fbLockInputRow">
        <input type="password" inputmode="numeric" class="fb-lock-input" id="fbLockInput" />
        <button type="button" class="fb-lock-confirm" id="fbLockConfirm">Xác nhận</button>
      </div>
      <p class="fb-lock-err" id="fbLockErr">Mã không đúng, thử lại nhé.</p>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector("#fbLockClose").addEventListener("click", close);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) close(); // bấm ra ngoài hộp cũng đóng lại
  });

  const fixLink = overlay.querySelector("#fbLockFixLink");
  const inputRow = overlay.querySelector("#fbLockInputRow");
  const input = overlay.querySelector("#fbLockInput");
  const errMsg = overlay.querySelector("#fbLockErr");
  const confirmBtn = overlay.querySelector("#fbLockConfirm");

  fixLink.addEventListener("click", () => {
    inputRow.classList.add("fb-show");
    fixLink.style.display = "none";
    input.focus();
  });

  function tryUnlock() {
    if (input.value.trim() === FB_UNLOCK_CODE) {
      close();
      onUnlock();
    } else {
      errMsg.style.display = "block";
      input.value = "";
      input.focus();
    }
  }
  confirmBtn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });
}

/* =========================================================
   NGĂN TRẮC NGHIỆM (dùng chung cho mọi bộ câu hỏi: từ vựng,
   ôn tập lý thuyết...) — kiểu giao diện giống Azota/NLDK:
   có màn Bắt đầu -> làm bài (chọn đáp án, nhảy câu tự do qua ô
   số bên phải) -> Kết thúc ra màn chấm điểm.

   CÁCH NHẬP CÂU HỎI (không cần biết code, chỉ cần đúng khuôn):
   - Mỗi câu là 1 khối gồm: dòng đầu là câu hỏi, các dòng sau là
     đáp án, đáp án ĐÚNG có dấu * ngay trước (dán sát, không cách)
   - Giữa 2 câu cách nhau ĐÚNG 1 dòng trống
   - Số lượng đáp án mỗi câu tuỳ ý (2, 4, 5... đều được, không bắt
     buộc đúng 4)

   Ví dụ 1 khối hợp lệ:
     Kết tinh là gì?
     *Crystallization
     Filtration
     Drying
     Evaporation
   ========================================================= */

/* Tách 1 khối text lớn (dán từ Excel/Azota) thành mảng câu hỏi */
/* Đọc thẳng dữ liệu dạng JSON (mảng object { chapter, question, options, answer })
   — không cần đi qua quizParseText. Dùng cho bộ câu hỏi trích từ DOCX theo màu chữ,
   như Chủ Nghĩa Xã Hội Khoa Học. Trả về đúng shape nội bộ { cau, dapAn, dungIndex, chuong }
   giống hệt quizParseText, nên phần hiển thị/chấm điểm dùng chung 100%. */
function quizFromJSON(list) {
  if (!Array.isArray(list)) return [];
  return list
    .filter((q) => q && q.question && Array.isArray(q.options) && q.options.length >= 2)
    .map((q) => ({
      cau: q.question,
      dapAn: q.options,
      dungIndex: Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length ? q.answer : 0,
      chuong: q.chapter || "Tất cả",
    }));
}

function quizParseText(raw) {
  const lines = raw.replace(/\r\n/g, "\n").split("\n");
  const questions = [];
  let currentChuong = "";
  let buffer = [];

  function flushBuffer() {
    const cleaned = buffer.map((l) => l.trim()).filter(Boolean);
    if (cleaned.length >= 3) {
      // cần ít nhất: 1 câu hỏi + 2 đáp án
      const cau = cleaned[0];
      let dungIndex = 0;
      const dapAn = cleaned.slice(1).map((line, i) => {
        if (line.startsWith("*")) {
          dungIndex = i;
          return line.slice(1).trim();
        }
        return line;
      });
      questions.push({ cau, dapAn, dungIndex, chuong: currentChuong });
    }
    buffer = [];
  }

  lines.forEach((rawLine) => {
    const trimmed = rawLine.trim();
    if (trimmed.startsWith("##")) {
      // Dòng bắt đầu bằng ## = tên chương/phần cho các câu phía sau nó
      flushBuffer();
      currentChuong = trimmed.replace(/^##\s*/, "");
      return;
    }
    if (trimmed === "") {
      flushBuffer(); // dòng trống = ranh giới giữa 2 câu
      return;
    }
    buffer.push(rawLine);
  });
  flushBuffer();

  return questions;
}

/* Trộn ngẫu nhiên 1 mảng (không đụng tới mảng gốc) */
function quizShuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/* Lấy danh sách các chương/phần khác nhau có trong bộ câu hỏi, kèm số câu mỗi phần */
function quizGetCategories(allQuestions) {
  const list = [];
  allQuestions.forEach((q) => {
    const ten = q.chuong || "Tất cả";
    let found = list.find((c) => c.ten === ten);
    if (!found) {
      found = { ten, soCau: 0 };
      list.push(found);
    }
    found.soCau++;
  });
  return list;
}

const QUIZ_STATE_STORE = {}; // lưu trạng thái làm bài riêng cho từng ngăn quiz
const QUIZ_KEYDOWN_HANDLERS = {}; // lưu lại handler phím tắt đang gắn cho từng ngăn quiz, để gỡ đúng cái cũ khi vào lại trang

function quizLetter(i) {
  return String.fromCharCode(65 + i); // 0 -> A, 1 -> B, 2 -> C...
}

/* ---------- Tự động lưu / khôi phục bài làm dở (localStorage) ----------
   Không cần bấm nút gì cả — cứ mỗi lần trả lời/chuyển câu là tự lưu lại
   "questions" (đúng bộ câu + đúng thứ tự đang làm dở), "answers" và đang
   ở câu số mấy. Lần sau mở lại đúng ngăn đó, nếu còn bài dở sẽ hỏi trước
   khi vào màn bắt đầu. */
const QUIZ_SAVE_PREFIX = "bungcavoi_quiz_progress_";

function quizSaveProgress(containerId, state) {
  try {
    localStorage.setItem(
      QUIZ_SAVE_PREFIX + containerId,
      JSON.stringify({
        questions: state.questions,
        answers: state.answers,
        current: state.current,
        savedAt: Date.now(),
      })
    );
  } catch (e) {
    /* localStorage đầy hoặc bị chặn (chế độ ẩn danh...) thì bỏ qua, không lưu được cũng không sao */
  }
}

function quizLoadProgress(containerId) {
  try {
    const raw = localStorage.getItem(QUIZ_SAVE_PREFIX + containerId);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.questions) || !data.questions.length || !Array.isArray(data.answers)) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function quizClearProgress(containerId) {
  try {
    localStorage.removeItem(QUIZ_SAVE_PREFIX + containerId);
  } catch (e) {}
}

/* Màn hỏi "tiếp tục bài dở hay làm từ đầu", hiện ra khi vào lại ngăn quiz
   mà phát hiện có bài chưa làm xong lưu từ trước */

      <div class="quiz-start-block">
        <p class="quiz-start-label">📌 Bạn đang làm dở bài này (${daLam}/${tong} câu)</p>
        <p class="quiz-glossary-hint">Bạn muốn tiếp tục bài làm chưa hoàn thành, hay làm từ đầu?</p>
        <div class="quiz-start-row">
          <button type="button" class="pomo-btn pomo-btn-primary" id="quizResumeBtn">▶ Tiếp tục bài dở</button>
          <button type="button" class="pomo-btn pomo-btn-secondary" id="quizFreshStartBtn">↻ Làm từ đầu</button>
        </div>
      </div>

}

      ${
        state.glossary && state.glossary.length
          ? `
      <div class="quiz-start-block quiz-start-block-glossary">
        <p class="quiz-start-label">📖 Xem trước đề cương / danh sách từ vựng</p>
        <p class="quiz-glossary-hint">Nên xem qua hết danh sách 1 lượt trước, biết nghĩa rồi làm trắc nghiệm sẽ hiệu quả hơn.</p>
        <button type="button" class="pomo-btn pomo-btn-primary" id="quizShowGlossaryBtn">📖 Mở đề cương từ vựng</button>
      </div>`

      <div class="quiz-start-block">
        <p class="quiz-start-label">🎲 Ôn tập ngẫu nhiên</p>
        <div class="quiz-start-row">
          <input type="number" id="quizRandomCount" class="quiz-number-input" min="1" max="${total}" value="${goiY}" />
          <button type="button" class="pomo-btn pomo-btn-primary" id="quizStartRandomBtn">▶ Bắt đầu ngẫu nhiên</button>
        </div>
      </div>

      ${
        categories.length > 1
          ? `
      <div class="quiz-start-block">
        <p class="quiz-start-label">📚 Hoặc ôn theo từng phần</p>
        <div class="quiz-start-row">
          <select id="quizCategorySelect" class="quiz-select-input">${categoryOptionsHtml}</select>
          <button type="button" class="pomo-btn pomo-btn-secondary" id="quizStartCategoryBtn">▶ Ôn phần này</button>
        </div>

/* Màn xem đề cương / danh sách từ vựng, dùng để học trước khi làm trắc nghiệm */
function quizRenderGlossary(glossary) {
  const sections = glossary
    .map(
      (cat) => `
      <div class="folder-block">
        <p class="folder-ten">📁 ${cat.chuong} (${cat.terms.length} từ)</p>
        <div class="glossary-grid">
          ${cat.terms
            .map(
              (t) => `
            <div class="glossary-item">
              <span class="glossary-a">${t.a}</span>
              <span class="glossary-arrow">→</span>
              <span class="glossary-b">${t.b}</span>
            </div>
          `
            )
            .join("")}
        </div>
      </div>
    `
    )
    .join("");

  return `
    <div class="detail-toolbar">
      <button type="button" class="back-btn" id="quizGlossaryBackBtn">← Quay lại</button>
    </div>
    <div class="cn-list">${sections}</div>
  `;
}

function quizRenderQuestion(state) {
  const { questions, answers, current } = state;
  const q = questions[current];

  const navButtons = questions
    .map((_, i) => {
      let cls = "quiz-nav-btn";
      if (i === current) cls += " current";
      else if (answers[i] != null) cls += " done";
      return `<button type="button" class="${cls}" data-goto="${i}">${i + 1}</button>`;
    })
    .join("");

  const chosen = answers[current];
  const hasAnswered = chosen != null;

  const optionsHtml = q.dapAn
    .map((opt, i) => {
      const isChosen = chosen === i;
      const isCorrectOption = i === q.dungIndex;

      let stateClass = "";
      if (hasAnswered && isCorrectOption) stateClass = "correct"; // luôn tô xanh đáp án đúng sau khi đã chọn
      else if (hasAnswered && isChosen) stateClass = "wrong"; // ô mình chọn mà sai thì tô đỏ

      const iconHtml =
        hasAnswered && isCorrectOption
          ? `<span class="quiz-icon quiz-icon-check">✓</span>`
          : hasAnswered && isChosen
          ? `<span class="quiz-icon quiz-icon-cross">✕</span>`
          : "";

      return `
        <button type="button" class="quiz-option ${stateClass}" data-answer="${i}" ${hasAnswered ? "disabled" : ""}>
          <span class="quiz-radio ${isChosen ? "filled" : ""}"></span>
          <span class="quiz-option-text"><strong>${quizLetter(i)}.</strong> ${opt}</span>
          ${iconHtml}
        </button>
      `;
    })
    .join("");

  const daLam = answers.filter((a) => a != null).length;

  return `
    <div class="quiz-header-bar">
      <button type="button" class="quiz-back-link" id="quizBackToStartBtn">↺ Đổi bộ câu khác</button>
      <span>Câu <strong>${current + 1}</strong> / ${questions.length}</span>
      <span>${daLam}/${questions.length} đã làm</span>
    </div>
    <div class="quiz-layout">
      <div class="quiz-question-col">
        <p class="quiz-question-text">${q.cau}</p>
        <div class="quiz-options">${optionsHtml}</div>
        <div class="quiz-footer-buttons">
          <button type="button" class="pomo-btn pomo-btn-secondary" id="quizPrevBtn" ${current === 0 ? "disabled" : ""}>← Trước</button>
          <button type="button" class="pomo-btn pomo-btn-primary" id="quizFinishBtn">Kết thúc</button>
          <button type="button" class="pomo-btn pomo-btn-secondary" id="quizNextBtn" ${current === questions.length - 1 ? "disabled" : ""}>Sau →</button>
        </div>
        <p class="tkb-note" style="text-align:center; margin-top:10px;">💻 Trên máy tính: bấm phím ← → để chuyển câu, phím 1-4 để chọn đáp án A-D</p>
      </div>
      <div class="quiz-nav-col">
        <p class="folder-ten">Danh sách câu</p>
        <div class="quiz-nav-grid">${navButtons}</div>
      </div>
    </div>
  `;
}

function quizRenderResult(state) {
  const { questions, answers } = state;
  let dung = 0;

  const items = questions
    .map((q, i) => {
      const chosen = answers[i];
      const isCorrect = chosen === q.dungIndex;
      if (isCorrect) dung++;
      const chosenText = chosen == null ? "(chưa chọn)" : `${quizLetter(chosen)}. ${q.dapAn[chosen]}`;
      const cls = chosen == null ? "" : isCorrect ? "correct" : "wrong";
      return `
        <div class="quiz-result-item ${cls}">
          <p><strong>Câu ${i + 1}:</strong> ${q.cau}</p>
          <p>Bạn chọn: ${chosenText}</p>
          ${!isCorrect ? `<p>Đáp án đúng: ${quizLetter(q.dungIndex)}. ${q.dapAn[q.dungIndex]}</p>` : ""}
        </div>
      `;
    })
    .join("");

  return `
    <div class="quiz-result-summary">
      <p class="quiz-score">Kết quả: <strong>${dung}</strong> / ${questions.length} câu đúng</p>
      <button type="button" class="pomo-btn pomo-btn-primary" id="quizRetryBtn">↻ Làm lại từ đầu</button>
    </div>
    <div class="quiz-result-list">${items}</div>
  `;
}

/* Gắn tương tác cho 1 ngăn quiz. Gọi hàm này trong afterRender của ngăn đó.
   glossary (tuỳ chọn): danh sách từ vựng để xem trước khi làm bài, dạng
   [{ chuong: "...", terms: [{ a: "...", b: "..." }] }] */
function initQuiz(containerId, allQuestions, title, glossary) {
  const container = document.getElementById(containerId);
  if (!container) return;

  /* ---------- Phím tắt cho máy tính: mũi tên chuyển câu, số 1-4 chọn đáp án ----------
     Trên điện thoại không có bàn phím vật lý nên phần này không ảnh hưởng gì,
     chỉ có tác dụng khi bồ gõ trên máy tính. */
  function handleQuizKeydown(e) {
    const state = QUIZ_STATE_STORE[containerId];
    if (!state || !document.body.contains(container)) return; // đã rời khỏi ngăn này thì bỏ qua
    if (!state.started || state.finished || state.viewGlossary || state.pendingResume) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      if (state.current < state.questions.length - 1) { state.current++; render(); }
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      if (state.current > 0) { state.current--; render(); }
      return;
    }
    if (["1", "2", "3", "4"].includes(e.key)) {
      e.preventDefault();
      if (state.answers[state.current] != null) return; // câu này đã chọn đáp án rồi thì không đổi được nữa, giống hệt khi bấm chuột
      const idx = parseInt(e.key, 10) - 1; // 1 -> A (idx 0), 2 -> B (idx 1), 3 -> C, 4 -> D
      const q = state.questions[state.current];
      if (q && idx < q.dapAn.length) {
        state.answers[state.current] = idx;
        render();
      }
    }
  }

  // Gỡ handler phím tắt cũ (nếu bồ đã từng vào ngăn này trước đó rồi rời đi) trước khi gắn cái mới,
  // để tránh 1 lần bấm phím bị xử lý lặp nhiều lần.
  if (QUIZ_KEYDOWN_HANDLERS[containerId]) {
    document.removeEventListener("keydown", QUIZ_KEYDOWN_HANDLERS[containerId]);
  }
  QUIZ_KEYDOWN_HANDLERS[containerId] = handleQuizKeydown;
  document.addEventListener("keydown", handleQuizKeydown);

  function resetState() {
    QUIZ_STATE_STORE[containerId] = {
      allQuestions, // toàn bộ ngân hàng câu hỏi, không đổi
      questions: [], // bộ câu đang làm trong phiên này (ngẫu nhiên hoặc theo chương)
      title,
      glossary: glossary || null,
      answers: [],
      current: 0,
      started: false,
      finished: false,
      viewGlossary: false,
      pendingResume: null, // dữ liệu bài dở đọc từ localStorage, chờ người dùng chọn tiếp tục/làm mới
    };
  }

  function batDauLam(danhSachCauDaChon) {
    const state = QUIZ_STATE_STORE[containerId];
    state.questions = danhSachCauDaChon;
    state.answers = new Array(danhSachCauDaChon.length).fill(null);
    state.current = 0;
    state.started = true;
    render();
  }

  if (!QUIZ_STATE_STORE[containerId]) {
    resetState();
    // Ngay khi mở ngăn này lần đầu (sau khi tải lại trang), kiểm tra xem
    // có bài làm dở lưu sẵn từ trước không — nếu có, hỏi trước khi vào màn bắt đầu.
    const saved = quizLoadProgress(containerId);
    if (saved) QUIZ_STATE_STORE[containerId].pendingResume = saved;
  }

  function render() {
    const state = QUIZ_STATE_STORE[containerId];

    if (state.pendingResume) {
      container.innerHTML = quizRenderResumePrompt(state.title, state.pendingResume);
      document.getElementById("quizResumeBtn").addEventListener("click", () => {
        const saved = state.pendingResume;
        state.questions = saved.questions;
        state.answers = saved.answers;
        state.current = Math.min(saved.current, saved.questions.length - 1);
        state.started = true;
        state.pendingResume = null;
        render();
      });
      document.getElementById("quizFreshStartBtn").addEventListener("click", () => {
        quizClearProgress(containerId);
        state.pendingResume = null;
        render();
      });
      return;
    }

    if (state.viewGlossary) {
      container.innerHTML = quizRenderGlossary(state.glossary);
      document.getElementById("quizGlossaryBackBtn").addEventListener("click", () => {
        state.viewGlossary = false;
        render();
      });
      return;
    }

    if (state.finished) {
      quizClearProgress(containerId); // đã nộp bài xong thì xoá bài dở, không cần khôi phục nữa
      container.innerHTML = quizRenderResult(state);
      document.getElementById("quizRetryBtn").addEventListener("click", () => {
        resetState();
        render();
      });
      return;
    }

    if (!state.started) {
      container.innerHTML = quizRenderStart(state);

      const glossaryBtn = document.getElementById("quizShowGlossaryBtn");
      if (glossaryBtn) {
        glossaryBtn.addEventListener("click", () => {
          state.viewGlossary = true;
          render();
        });
      }

      document.getElementById("quizStartRandomBtn").addEventListener("click", () => {
        const input = document.getElementById("quizRandomCount");
        const total = state.allQuestions.length;
        const n = Math.max(1, Math.min(total, parseInt(input.value, 10) || total));
        batDauLam(quizShuffle(state.allQuestions).slice(0, n));
      });

      const categoryBtn = document.getElementById("quizStartCategoryBtn");
      if (categoryBtn) {
        categoryBtn.addEventListener("click", () => {
          const categories = quizGetCategories(state.allQuestions);
          const idx = parseInt(document.getElementById("quizCategorySelect").value, 10);
          const tenChuong = categories[idx].ten;
          const danhSach = state.allQuestions.filter((q) => (q.chuong || "Tất cả") === tenChuong);
          batDauLam(quizShuffle(danhSach)); // trộn ngẫu nhiên để mỗi lần vào lại không bị đúng 1 thứ tự cố định
        });
      }
      return;
    }

    container.innerHTML = quizRenderQuestion(state);
    quizSaveProgress(containerId, state); // tự lưu bài dở, không cần bấm nút gì

    container.querySelectorAll(".quiz-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.answers[state.current] = parseInt(btn.dataset.answer, 10);
        render();
      });
    });
    container.querySelectorAll(".quiz-nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.current = parseInt(btn.dataset.goto, 10);
        render();
      });
    });

    const prevBtn = document.getElementById("quizPrevBtn");
    const nextBtn = document.getElementById("quizNextBtn");
    const finishBtn = document.getElementById("quizFinishBtn");
    const backToStartBtn = document.getElementById("quizBackToStartBtn");
    if (prevBtn) prevBtn.addEventListener("click", () => { state.current--; render(); });
    if (nextBtn) nextBtn.addEventListener("click", () => { state.current++; render(); });
    if (finishBtn) finishBtn.addEventListener("click", () => { state.finished = true; render(); });
    if (backToStartBtn) backToStartBtn.addEventListener("click", () => { quizClearProgress(containerId); resetState(); render(); });
  }

  render();
}

function renderQuizContainer(containerId) {
  return `<div id="${containerId}"></div>`;
}

function rbkEsc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function rbkSentences(t) {
  const p = t.replace(/\s+/g, " ").replace(/\b(e\.g|i\.e|et al|Fig|Figs|vs|approx|ca|Eq|Ref|No)\./gi, "$1§");
  return p.split(/(?<=[.!?])\s+(?=[A-Z0-9\[(])/).map((s) => s.replace(/§/g, ".").trim()).filter((s) => s.length > 30 && s.length < 420);
}

function rbkWords(t) { return t.split(/\s+/).filter(Boolean).length; }

/* Tách các phần của bài theo dòng tiêu đề (Abstract, Introduction...) */
function rbkFindSections(text) {
  const lines = text.split(/\r?\n/);
  const marks = [];
  lines.forEach((raw, i) => {
    let l = raw.trim().replace(/^#+\s*/, "").replace(/^\*+|\*+$/g, "");
    if (!l || l.length > 70) {
      // dạng "Abstract: nội dung..." / "Keywords: ..."
      const m = raw.trim().match(/^(abstract|key ?words?)\s*[:.\-–]\s*(\S.*)$/i);
      if (m) marks.push({ i, key: /abstract/i.test(m[1]) ? "abstract" : "keywords", rest: m[2] });
      return;
    }
    l = l.replace(/^(?:\d+|[IVX]+)[.)]?\s+/, "").replace(/[:.]$/, "").trim();
    for (const d of RBK_SECTION_DEFS) {
      if (d[2].test(l)) { marks.push({ i, key: d[0], rest: "" }); return; }
    }
    const m = raw.trim().match(/^(abstract|key ?words?)\s*[:.\-–]\s*(\S.*)$/i);
    if (m) marks.push({ i, key: /abstract/i.test(m[1]) ? "abstract" : "keywords", rest: m[2] });
  });
  const out = {};
  marks.forEach((m, idx) => {
    const end = idx + 1 < marks.length ? marks[idx + 1].i : lines.length;
    const body = (m.rest ? m.rest + "\n" : "") + lines.slice(m.i + 1, end).join("\n");
    out[m.key] = ((out[m.key] || "") + "\n" + body).trim();
  });
  const front = marks.length ? lines.slice(0, marks[0].i).join("\n").trim() : "";
  return { secs: out, front };
}

/* Tìm từ viết tắt có định nghĩa: "Full Name (ABBR)" và từ viết tắt chưa được giải thích */
function rbkAbbrevs(text, techAcr) {
  const defs = {};
  const re = /\(([A-Z][A-Za-z0-9\-]{1,9})\)/g;
  let m;
  while ((m = re.exec(text))) {
    let abbr = m[1].replace(/s$/, "");
    const letters = abbr.replace(/[^A-Za-z]/g, "").toLowerCase();
    if (letters.length < 2 || defs[abbr]) continue;
    const before = text.slice(Math.max(0, m.index - 140), m.index).trim().split(/[\s\-‐-―]+/).filter(Boolean);
    for (let k = Math.max(2, letters.length); k <= Math.min(8, before.length); k++) {
      const phrase = before.slice(-k);
      const ini = phrase.map((w) => w.replace(/^[^A-Za-z]+/, "").charAt(0).toLowerCase()).join("");
      let j = 0;
      for (const c of ini) if (c === letters[j]) j++;
      if (j === letters.length && phrase[0].replace(/[^A-Za-z]/g, "")) { defs[abbr] = phrase.join(" "); break; }
    }
  }
  const stop = new Set(["THE", "AND", "FOR", "DOI", "PDF", "ACS", "RSC", "USA", "SI", "FIG", "REF", "ET", "AL", "NO", "II", "III", "IV", "VS"]);
  const cnt = {};
  (text.match(/\b[A-Z][A-Z0-9]{1,7}\b/g) || []).forEach((a) => { cnt[a] = (cnt[a] || 0) + 1; });
  const undef = Object.keys(cnt).filter((a) => cnt[a] >= 2 && !defs[a] && !stop.has(a) && !techAcr.has(a) && /[A-Z]{2}/.test(a)).sort((a, b) => cnt[b] - cnt[a]).slice(0, 12);
  return { defs, undef };
}

function rbkAnalyze(text) {
  const t = text.replace(/\u00a0/g, " ");
  const sec = rbkFindSections(t);
  const firstLine = (t.split(/\r?\n/).find((l) => l.trim().length > 8) || "").trim();
  const doiM = t.match(/\b10\.\d{4,9}\/[^\s"<>,;]+/);
  const techs = RBK_TECH.filter((x) => x.acr.test(t) || (x.full && x.full.test(t)));
  const techAcr = new Set();
  RBK_TECH.forEach((x) => { const mm = x.acr.source.match(/[A-Z][A-Za-z0-9]{1,6}/g); if (mm) mm.forEach((a) => techAcr.add(a)); });
  const topics = RBK_TOPICS.filter((x) => x.re.test(t));
  const abb = rbkAbbrevs(t, techAcr);
  const solvDefs = [
    ["nước (water)", /\b(deionized|distilled|ultrapure|DI) water\b|\baqueous\b|\bwater\b/gi],
    ["ethanol", /\bethanol\b|\bEtOH\b/gi], ["methanol", /\bmethanol\b|\bMeOH\b/gi],
    ["isopropanol", /\bisopropanol\b|\b2-propanol\b|\bIPA\b/gi], ["acetone", /\bacetone\b/gi],
    ["DMF", /\bDMF\b|dimethylformamide/gi], ["DMSO", /\bDMSO\b|dimethyl sulfoxide/gi],
    ["toluene", /\btoluene\b/gi], ["THF", /\bTHF\b|tetrahydrofuran/gi],
    ["acetonitrile", /\bacetonitrile\b/gi], ["ethylene glycol", /ethylene glycol/gi],
    ["chloroform / DCM", /\bchloroform\b|dichloromethane|\bDCM\b/gi],
  ];
  const solvents = solvDefs.map((s) => [s[0], (t.match(s[1]) || []).length]).filter((s) => s[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 3).map((s) => s[0]);
  const metalCnt = {};
  (t.match(/\b(Zn|Cu|Co|Ni|Fe|Mn|Mg|Ca|Al|Ti|Zr|Ce|La|Cr|Mo|Pt|Pd|Ag|Au|Ru|Ir|Li|Na|Sn|Bi|Ga|In|Y|Hf|Nb|Ta)\b/g) || []).forEach((e) => { metalCnt[e] = (metalCnt[e] || 0) + 1; });
  const metals = Object.keys(metalCnt).filter((e) => metalCnt[e] >= 2);
  const area = (sec.secs.abstract || "") + " " + (sec.secs.conclusion || "");
  const numClaims = (rbkSentences(area || t.slice(0, 2500)).filter((s) => RBK_NUM.test(s))).slice(0, 3)
    .map((s) => (s.match(RBK_NUM) || [""])[0].trim()).filter(Boolean);
  const roles = RBK_ROLES.map((r) => {
    let pool = [];
    r.from.forEach((k) => { if (sec.secs[k]) pool = pool.concat(rbkSentences(sec.secs[k])); });
    if (!pool.length) pool = rbkSentences(t);
    const hits = pool.filter((s) => r.re.test(s) && rbkWords(s) <= 60);
    return { r, hits: hits.slice(0, 2) };
  });
  return { title: firstLine.length <= 220 ? firstLine : firstLine.slice(0, 200) + "...", doi: doiM ? doiM[0].replace(/[.)\]]+$/, "") : "",
    words: rbkWords(t), sec, techs, topics, abb, solvents, metals, numClaims, roles,
    noveltyClaims: Array.from(new Set((t.match(/\b(for the first time|first[- ](report|time|ever|study)|world['’]?s first|unprecedented|never (been )?reported|first-ever)\b/gi) || []).map((x) => x.toLowerCase()))).slice(0, 3),
    expected: /expected (results?|outcomes?|to (increase|decrease|improve|enhance|reduce))|we (expect|anticipate)|is anticipated|kết quả dự kiến/i.test(t) };
}

function rbkBuildPool(a) {
  const pool = [];
  const add = (lv, cat, q, src) => pool.push({ lv, cat, q, src, done: false });
  a.topics.forEach((tp) => tp.qs.forEach((q) => add(q[0], q[1], q[2], "topic")));
  a.techs.forEach((tc) => {
    add(1, "Phân tích", tc.k + " trong bài này nhằm chứng minh điều gì? Bạn giải thích được nguyên lý đo của nó trong 2 câu không, và nếu bỏ " + tc.k + " thì kết luận nào yếu đi?", "tech");
    if (tc.q) add(tc.q[0], tc.q[1], tc.q[2], "tech");
  });
  a.solvents.forEach((s) => add(2, "Dung môi", "Bài dùng " + s + ": vì sao chọn dung môi này (độ phân cực, nhiệt độ sôi, độ hòa tan tiền chất)? Có thể thay bằng dung môi xanh hơn không, và hiệu năng thay đổi ra sao?", "dyn"));
  if (a.metals.length >= 3) add(2, "Vật liệu", "Bài có nhiều kim loại (" + a.metals.slice(0, 6).join(", ") + "). Đây là hệ đa kim thông thường hay entropy cao? Tỉ lệ thực đo (ICP, EDS) có khớp tỉ lệ nạp không?", "dyn");
  Object.keys(a.abb.defs).slice(0, 6).forEach((ab) => add(1, "Viết tắt", "\"" + ab + "\" là viết tắt của \"" + a.abb.defs[ab] + "\". Hãy giải thích khái niệm này bằng lời của bạn và vai trò của nó trong bài.", "dyn"));
  a.abb.undef.slice(0, 4).forEach((ab) => add(1, "Viết tắt", "Bài dùng \"" + ab + "\" mà không giải thích. Nó là gì? Hãy tra và nêu nghĩa đầy đủ cùng ý nghĩa trong bài.", "dyn"));
  a.numClaims.forEach((n) => add(2, "Số liệu", "Con số \"" + n + "\" được đo bằng phương pháp nào, trên bao nhiêu mẫu, và so với mẫu đối chứng nào?", "dyn"));
  a.noveltyClaims.forEach((c) => add(2, "Tính mới", "Bài dùng cụm \"" + c + "\". Tổng quan tài liệu của bạn đã đủ toàn diện và có hệ thống để khẳng định điều đó chưa? Nếu chưa, nên diễn đạt lại thế nào cho đúng mức?", "dyn"));
  if (a.expected) add(2, "Kết quả dự kiến", "Kết quả dự kiến dựa trên luận cứ nào: mô hình lý thuyết, công bố tiền đề uy tín hay dữ liệu sơ bộ của bạn? Bạn có đang giả định trước xu hướng tăng hoặc giảm của dữ liệu không?", "dyn");
  RBK_GENERIC.forEach((q) => add(q[0], q[1], q[2], "gen"));
  return pool;
}

function rbkShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Chọn n câu: ưu tiên câu theo chủ đề/phương pháp/dữ liệu bài, cân bằng 3 mức, bổ sung câu chung */
function rbkPick(pool, n) {
  const want = { 1: Math.round(n * 0.3), 2: Math.round(n * 0.4) };
  want[3] = n - want[1] - want[2];
  const sh = rbkShuffle(pool).sort((x, y) => (x.src === "gen" ? 1 : 0) - (y.src === "gen" ? 1 : 0));
  const out = [];
  [1, 2, 3].forEach((lv) => { sh.filter((q) => q.lv === lv && out.length < n).slice(0, want[lv]).forEach((q) => out.push(q)); });
  if (out.length < n) sh.forEach((q) => { if (out.length < n && !out.includes(q)) out.push(q); });
  return out.sort((x, y) => x.lv - y.lv).map((q) => Object.assign({}, q, { done: false }));
}

/* ---- Tải file lên: TXT/MD, DOCX (mammoth), PDF có lớp chữ (pdf.js, tự xử lý 2 cột), ảnh (OCR Tesseract) ----
   File được đọc ngay trên máy người dùng. Thư viện chỉ tải từ jsDelivr khi chọn đúng loại file. */
const RBK_LIBS = {
  mammoth: "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
  pdfjs: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
  tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js",
};
const rbkScriptCache = {};
function rbkLoadScript(url) {
  if (!rbkScriptCache[url]) {
    rbkScriptCache[url] = new Promise((res, rej) => {
      const el = document.createElement("script");
      el.src = url; el.onload = () => res();
      el.onerror = () => { delete rbkScriptCache[url]; rej(new Error("Không tải được thư viện đọc file, hãy kiểm tra kết nối mạng.")); };
      document.head.appendChild(el);
    });
  }
  return rbkScriptCache[url];
}
function rbkReadFile(file, mode) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Không đọc được file."));
    if (mode === "text") r.readAsText(file); else r.readAsArrayBuffer(file);
  });
}
async function rbkReadDocx(file) {
  await rbkLoadScript(RBK_LIBS.mammoth);
  const r = await window.mammoth.extractRawText({ arrayBuffer: await rbkReadFile(file, "buf") });
  return r.value;
}

  const isCross = (i) => i.x < mid - 12 && i.x + i.w > mid + 12;
  const cross = it.filter(isCross).length;
  const twoCol = left >= 15 && right >= 15 && cross / it.length < 0.2;
  const toLines = (arr) => {
    const sorted = arr.slice().sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = []; let cur = null;
    sorted.forEach((i) => {
      if (cur && Math.abs(cur.y - i.y) < 4) cur.parts.push(i);
      else { cur = { y: i.y, parts: [i] }; lines.push(cur); }
    });
    return lines.map((l) => l.parts.sort((a, b) => a.x - b.x).map((p) => p.s).join(" ").replace(/\s+/g, " ").trim()).filter(Boolean);
  };
  if (!twoCol) return toLines(it).join("\n");
  const sorted = it.slice().sort((a, b) => b.y - a.y);
  const out = []; let L = [], R = [], X = [];
  const flushCols = () => { out.push(...toLines(L), ...toLines(R)); L = []; R = []; };
  const flushCross = () => { if (X.length) { out.push(...toLines(X)); X = []; } };
  sorted.forEach((i) => {
    if (isCross(i)) { if (L.length || R.length) flushCols(); X.push(i); }
    else { flushCross(); (i.x + i.w / 2 < mid ? L : R).push(i); }
  });
  flushCols(); flushCross();
  return out.join("\n");
}
async function rbkReadPdf(file, onProg) {
  await rbkLoadScript(RBK_LIBS.pdfjs);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = RBK_LIBS.pdfWorker;
  const pdf = await lib.getDocument({ data: await rbkReadFile(file, "buf") }).promise;
  const max = Math.min(pdf.numPages, 60);
  const pages = [];
  for (let p = 1; p <= max; p++) {
    if (onProg) onProg("Đang đọc PDF, trang " + p + "/" + max + "...");
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    pages.push(rbkPdfPageText(tc.items, vp.width));
  }
  const text = pages.join("\n\n").replace(/([a-z])-\n([a-z])/g, "$1$2");
  return { text, truncated: pdf.numPages > max, total: pdf.numPages };
}
async function rbkReadImage(file, onProg) {
  await rbkLoadScript(RBK_LIBS.tesseract);
  const r = await window.Tesseract.recognize(file, "eng+vie", {
    logger: (m) => { if (onProg && m.status) onProg("OCR: " + m.status + (typeof m.progress === "number" ? " " + Math.round(m.progress * 100) + "%" : "")); },
  });
  return r.data.text;
}

function initReadingGuide() {
  const guide = document.getElementById("rbkGuide");
  const lab = document.getElementById("rbkLab");
  const out = document.getElementById("rbkOut");
  const input = document.getElementById("rbkInput");
  if (!guide || !lab) return;
  let A = null, QS = [];

  document.querySelectorAll("[data-rbk-tab]").forEach((b) => b.addEventListener("click", () => {
    const t = b.getAttribute("data-rbk-tab");
    document.querySelectorAll("[data-rbk-tab]").forEach((x) => x.classList.toggle("rbk-tab-on", x === b));
    guide.style.display = t === "guide" ? "" : "none";
    lab.style.display = t === "lab" ? "" : "none";
  }));

  function chip(s) { return `<span class="rbk-chip">${rbkEsc(s)}</span>`; }

  function renderQuestions() {
    const done = QS.filter((q) => q.done).length;
    let html = `<h3 class="rbk-h">Hội đồng giả lập: ${QS.length} câu hỏi</h3>
      <div class="rbk-row">
        <button id="rbkAsk" class="pomo-btn pomo-btn-primary">Hội đồng hỏi ngẫu nhiên</button>
        <button id="rbkReshuffle" class="pomo-btn pomo-btn-secondary">Đổi bộ câu hỏi</button>
        <button id="rbkCopy" class="pomo-btn pomo-btn-secondary">Chép tất cả</button>
        <span class="rbk-prog">Đã tìm hiểu: ${done}/${QS.length}</span>
      </div>
      <div id="rbkPanel" class="rbk-panel" style="display:none;"></div>`;
    [1, 2, 3].forEach((lv) => {
      const items = QS.map((q, i) => ({ q, i })).filter((x) => x.q.lv === lv);
      if (!items.length) return;
      html += `<h4 class="rbk-lv rbk-lv${lv}">${RBK_LEVELS[lv]} (${items.length})</h4><ol class="rbk-qs">` +
        items.map((x) => `<li class="${x.q.done ? "rbk-done" : ""}"><label><input type="checkbox" data-qi="${x.i}" ${x.q.done ? "checked" : ""}> <span class="rbk-cat">${rbkEsc(x.q.cat)}</span> ${rbkEsc(x.q.q)}</label></li>`).join("") + `</ol>`;
    });
    const box = document.getElementById("rbkQBox");
    box.innerHTML = html;
    box.querySelectorAll("input[data-qi]").forEach((c) => c.addEventListener("change", () => {
      QS[+c.getAttribute("data-qi")].done = c.checked; renderQuestions();
    }));
    document.getElementById("rbkReshuffle").addEventListener("click", () => { QS = rbkPick(rbkBuildPool(A), +document.getElementById("rbkCount").value); renderQuestions(); });
    document.getElementById("rbkAsk").addEventListener("click", () => {
      const left = QS.filter((q) => !q.done);
      const panel = document.getElementById("rbkPanel");
      panel.style.display = "";
      if (!left.length) { panel.innerHTML = `<b>Bạn đã tìm hiểu hết các câu hỏi.</b> Bấm "Đổi bộ câu hỏi" để hội đồng hỏi tiếp.`; return; }
      const q = left[Math.floor(Math.random() * left.length)];
      panel.innerHTML = `<div class="rbk-who">Thành viên hội đồng hỏi (${RBK_LEVELS[q.lv]}, ${rbkEsc(q.cat)}):</div><div class="rbk-bigq">${rbkEsc(q.q)}</div>
        <div class="rbk-row"><button id="rbkNext" class="pomo-btn pomo-btn-secondary">Câu khác</button><button id="rbkMark" class="pomo-btn pomo-btn-primary">Mình đã tìm hiểu câu này</button></div>`;
      document.getElementById("rbkNext").addEventListener("click", () => document.getElementById("rbkAsk").click());
      document.getElementById("rbkMark").addEventListener("click", () => { q.done = true; renderQuestions(); document.getElementById("rbkAsk").click(); });
    });
    document.getElementById("rbkCopy").addEventListener("click", () => {
      const txt = QS.map((q, i) => (i + 1) + ". [" + RBK_LEVELS[q.lv] + " | " + q.cat + "] " + q.q).join("\n");
      const ok = () => { document.getElementById("rbkCopy").textContent = "Đã chép"; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => {});
      else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) {} document.body.removeChild(ta); }
    });
  }

  function render() {
    const a = A;
    const secKeys = RBK_SECTION_DEFS.map((d) => d[0]);
    const secRows = RBK_SECTION_DEFS.map((d) => {
      const body = a.sec.secs[d[0]];
      return `<tr><td>${rbkEsc(d[1])}</td><td>${body ? "Có (" + rbkWords(body) + " từ)" : '<span class="rbk-miss">Không thấy</span>'}</td><td>${rbkEsc(d[3])}</td></tr>`;
    }).join("");
    const found = secKeys.filter((k) => a.sec.secs[k]).length;
    const techRows = a.techs.length ? a.techs.map((t) => `<tr><td><b>${rbkEsc(t.k)}</b></td><td>${rbkEsc(t.what)}</td></tr>`).join("") : `<tr><td colspan="2">Chưa nhận diện được phương pháp phân tích nào.</td></tr>`;
    const defRows = Object.keys(a.abb.defs).map((k) => `<tr><td><b>${rbkEsc(k)}</b></td><td>${rbkEsc(a.abb.defs[k])}</td></tr>`).join("");
    const roleHtml = a.roles.map((x, i) => `<div class="rbk-role"><b>${rbkEsc(x.r.name)}</b><div class="rbk-ask">${rbkEsc(x.r.ask)}</div>
      ${x.hits.length ? x.hits.map((s) => `<div class="rbk-hit">"${rbkEsc(s)}"</div>`).join("") : '<div class="rbk-hit rbk-miss">Chưa tìm thấy câu gợi ý trong đoạn đã dán.</div>'}
      <textarea class="rbk-input rbk-mine" rows="2" placeholder="Viết 1 câu bằng lời của bạn..."></textarea></div>`).join("");
    out.innerHTML = `
      <h3 class="rbk-h">Tổng quan</h3>
      <div class="rbk-card"><p><b>Tiêu đề (dòng đầu):</b> ${rbkEsc(a.title || "(không xác định)")}</p>
        <p><b>DOI:</b> ${a.doi ? `<a href="https://doi.org/${encodeURI(a.doi)}" target="_blank" rel="noopener">${rbkEsc(a.doi)}</a>` : "chưa thấy trong đoạn đã dán"} &nbsp; <b>Số từ:</b> ${a.words}</p>
        <p><b>Chủ đề nhận diện:</b> ${a.topics.length ? a.topics.map((t) => chip(t.name)).join(" ") : "chưa nhận diện được chủ đề nào, câu hỏi sẽ thiên về câu hỏi chung"}</p>
        ${a.solvents.length ? `<p><b>Dung môi xuất hiện nhiều:</b> ${a.solvents.map(chip).join(" ")}</p>` : ""}
        ${a.metals.length >= 2 ? `<p><b>Kim loại xuất hiện:</b> ${a.metals.map(chip).join(" ")}</p>` : ""}</div>
      <h3 class="rbk-h">Các phần của bài (tìm thấy ${found}/${secKeys.length})</h3>
      <table class="rbk-tbl"><tr><th>Phần</th><th>Trạng thái</th><th>Đọc để tìm</th></tr>${secRows}</table>
      ${found < 3 ? '<p class="tkb-note">Tìm thấy ít tiêu đề phần. Có thể bài dán không xuống dòng ở tiêu đề, khi đó mỗi tiêu đề (Abstract, Introduction...) nên đứng riêng một dòng.</p>' : ""}
      <h3 class="rbk-h">Phương pháp phân tích trong bài và ý nghĩa</h3>
      <table class="rbk-tbl"><tr><th>Phương pháp</th><th>Dùng để làm gì</th></tr>${techRows}</table>
      <h3 class="rbk-h">Từ viết tắt</h3>
      ${defRows ? `<table class="rbk-tbl"><tr><th>Viết tắt</th><th>Nghĩa (suy ra từ bài)</th></tr>${defRows}</table>` : "<p>Không bắt được cặp 'Tên đầy đủ (VIẾT TẮT)' nào.</p>"}
      ${a.abb.undef.length ? `<p><b>Viết tắt không được giải thích trong đoạn đã dán (hãy tự tra):</b> ${a.abb.undef.map(chip).join(" ")}</p>` : ""}
      <h3 class="rbk-h">Tự tổng hợp: tác giả muốn truyền tải điều gì?</h3>
      <p class="tkb-note">Câu trích từ chính bài chỉ để gợi ý. Hãy viết lại từng ý bằng lời của mình.</p>
      ${roleHtml}
      <div id="rbkQBox"></div>`;
    renderQuestions();
  }

  const fileInput = document.getElementById("rbkFile");
  const fileStatus = document.getElementById("rbkFileStatus");
  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    const parts = [], notes = [];
    const say = (m) => { fileStatus.textContent = m; };
    for (const f of files) {
      const name = f.name.toLowerCase();
      try {
        say("Đang đọc " + f.name + "...");
        let txt = "";
        if (/\.(txt|md)$/.test(name)) txt = await rbkReadFile(f, "text");
        else if (name.endsWith(".docx")) txt = await rbkReadDocx(f);
        else if (name.endsWith(".pdf")) {
          const r = await rbkReadPdf(f, say);
          txt = r.text;
          if (r.truncated) notes.push(f.name + ": mới đọc 60/" + r.total + " trang đầu.");
          if (txt.replace(/\s/g, "").length < 100) {
            txt = "";
            notes.push(f.name + ": PDF gần như không có lớp chữ (có thể là bản scan). Hãy chụp từng trang thành ảnh rồi tải ảnh lên để dùng OCR.");
          }
        } else if (/\.(png|jpe?g|webp|bmp)$/.test(name)) {
          txt = await rbkReadImage(f, say);
          notes.push(f.name + ": đã dùng OCR, hãy đọc lại công thức, chỉ số dưới và dấu tiếng Việt.");
        } else notes.push(f.name + ": định dạng chưa hỗ trợ (nhận TXT, MD, DOCX, PDF, ảnh PNG/JPG).");
        if (txt.trim()) parts.push(txt.trim());
      } catch (e) { notes.push(f.name + ": " + (e && e.message ? e.message : "lỗi không xác định")); }
    }
    if (parts.length) input.value = (input.value.trim() ? input.value.trim() + "\n\n" : "") + parts.join("\n\n");
    say((parts.length ? "Đã thêm " + parts.length + " file vào ô nhập. " : "") + notes.join(" "));
    fileInput.value = "";
  });

  document.getElementById("rbkGo").addEventListener("click", () => {
    const txt = input.value.trim();
    if (txt.length < 200) { out.innerHTML = `<p class="rbk-miss">Hãy dán ít nhất vài đoạn (từ 200 ký tự trở lên) để phân tích.</p>`; return; }
    A = rbkAnalyze(txt);
    QS = rbkPick(rbkBuildPool(A), +document.getElementById("rbkCount").value);
    render();
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("rbkClear").addEventListener("click", () => { input.value = ""; out.innerHTML = ""; A = null; QS = []; });
}
