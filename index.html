      <p class="tkb-note">File được đọc ngay trên máy bạn, không gửi lên máy chủ nào; chữ đọc được sẽ thêm vào cuối ô bên trên để bạn xem lại và sửa trước khi phân tích. Lần đầu chọn mỗi loại file, trình duyệt tải thêm một thư viện đọc file. PDF 2 cột được tự xếp lại cột trái rồi cột phải (có thể sai ở bố cục phức tạp). PDF scan và ảnh dùng OCR, dễ sai công thức, chỉ số dưới và dấu tiếng Việt, nên hãy đọc lại. File .doc cũ hãy lưu thành .docx.</p>
      <div class="rbk-row">
        <label>Số câu hỏi:
          <select id="rbkCount"><option value="20">20</option><option value="30" selected>30</option><option value="40">40</option><option value="50">50</option></select>
        </label>
        <button id="rbkGo" class="pomo-btn pomo-btn-primary">Phân tích và tạo câu hỏi</button>
        <button id="rbkClear" class="pomo-btn pomo-btn-secondary">Xóa</button>
      </div>
      <p class="tkb-note">Lưu ý: đây là bộ nhận diện bằng từ khóa và mẫu câu, không phải AI. Nó bắt tốt các đề tài hóa học và vật liệu phổ biến (MOF, HEO, đông khô, microreactor, xúc tác, hấp phụ...). Nếu dán từ PDF 2 cột mà chữ bị trộn dòng, hãy dán từng cột.</p>
      <div id="rbkOut"></div>
    </div>
    <div id="rbkFig" style="display:none;">
      <p class="ctdt-meta">Chọn loại hình, rồi tải hoặc dán ảnh hình từ bài báo. <b>Hệ thống không tự hiểu nội dung ảnh</b> (không dùng AI nhìn ảnh). Nó đặt ảnh cạnh hướng dẫn đọc và bộ câu hỏi riêng cho loại hình đó để bạn tự đọc, tự trả lời. Ảnh chỉ nằm trên máy bạn, không gửi đi đâu.</p>
      <div class="rbk-row"><label>Loại hình: <select id="rbkFigType"></select></label></div>
      <div id="rbkDrop" class="rbk-drop" tabindex="0">Kéo thả ảnh vào đây, hoặc bấm vào ô này rồi nhấn Ctrl+V để dán ảnh chụp màn hình, hoặc
        <label class="rbk-link">chọn file ảnh<input type="file" id="rbkFigFile" accept="image/*" multiple style="display:none;"></label></div>
      <div id="rbkImgs" class="rbk-imgs"></div>
      <div class="rbk-row"><button id="rbkImgClear" class="pomo-btn pomo-btn-secondary">Xóa ảnh</button>
        <button id="rbkOcrFig" class="pomo-btn pomo-btn-secondary">Đọc chữ trên ảnh (OCR)</button><span id="rbkOcrStatus" class="rbk-prog"></span></div>
      <textarea id="rbkCap" class="rbk-input" rows="2" placeholder="(Không bắt buộc) Dán chú thích hình (caption) hoặc chữ trên trục, hệ thống sẽ đoán loại hình và chọn sẵn hướng dẫn phù hợp..."></textarea>
      <div id="rbkFigOut"></div>
    </div>
  </div>`;
}

function initReadingGuide() {
  const guide = document.getElementById("rbkGuide");
  const lab = document.getElementById("rbkLab");
  const out = document.getElementById("rbkOut");
  const input = document.getElementById("rbkInput");
  if (!guide || !lab) return;
  let A = null, QS = [];

  const figPanel = document.getElementById("rbkFig");
  const showTab = (t) => {
    document.querySelectorAll("[data-rbk-tab]").forEach((x) => x.classList.toggle("rbk-tab-on", x.getAttribute("data-rbk-tab") === t));
    guide.style.display = t === "guide" ? "" : "none";
    lab.style.display = t === "lab" ? "" : "none";
    if (figPanel) figPanel.style.display = t === "fig" ? "" : "none";
  };
  document.querySelectorAll("[data-rbk-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.getAttribute("data-rbk-tab"))));
  const figApi = rbkInitFigTab();

  function chip(s) { return `<span class="rbk-chip">${rbkEsc(s)}</span>`; }

  function renderQuestions() {
    const done = QS.filter((q) => q.done).length;
    let html = `<h3 class="rbk-h">Hội đồng giả lập: ${QS.length} câu hỏi</h3>
      <div class="rbk-row">
        <button id="rbkAsk" class="pomo-btn pomo-btn-primary">Hội đồng hỏi ngẫu nhiên</button>
        <button id="rbkReshuffle" class="pomo-btn pomo-btn-secondary">Đổi bộ câu hỏi</button>
        <button id="rbkCopy" class="pomo-btn pomo-btn-secondary">Chép tất cả</button>
        <button id="rbkPrompt" class="pomo-btn pomo-btn-secondary">Chép prompt để hỏi AI</button>
        <span class="rbk-prog">Đã tìm hiểu: ${done}/${QS.length}</span>
      </div>
      <div id="rbkPanel" class="rbk-panel" style="display:none;"></div>`;
    [1, 2, 3].forEach((lv) => {
      const items = QS.map((q, i) => ({ q, i })).filter((x) => x.q.lv === lv);
      if (!items.length) return;
      html += `<h4 class="rbk-lv rbk-lv${lv}">${RBK_LEVELS[lv]} (${items.length})</h4><ol class="rbk-qs">` +
        items.map((x) => `<li class="${x.q.done ? "rbk-done" : ""}"><label><input type="checkbox" data-qi="${x.i}" ${x.q.done ? "checked" : ""}> <span class="rbk-cat">${rbkEsc(x.q.cat)}</span> ${rbkEsc(x.q.q)}</label></li>`).join("") + `</ol>`;
    });
    const box = document.getElementById("rbkQBox");
    box.innerHTML = html;
    box.querySelectorAll("input[data-qi]").forEach((c) => c.addEventListener("change", () => {
      QS[+c.getAttribute("data-qi")].done = c.checked; renderQuestions();
    }));
    document.getElementById("rbkReshuffle").addEventListener("click", () => { QS = rbkPick(rbkBuildPool(A), +document.getElementById("rbkCount").value); renderQuestions(); });
    document.getElementById("rbkAsk").addEventListener("click", () => {
      const left = QS.filter((q) => !q.done);
      const panel = document.getElementById("rbkPanel");
      panel.style.display = "";
      if (!left.length) { panel.innerHTML = `<b>Bạn đã tìm hiểu hết các câu hỏi.</b> Bấm "Đổi bộ câu hỏi" để hội đồng hỏi tiếp.`; return; }
      const q = left[Math.floor(Math.random() * left.length)];
      panel.innerHTML = `<div class="rbk-who">Thành viên hội đồng hỏi (${RBK_LEVELS[q.lv]}, ${rbkEsc(q.cat)}):</div><div class="rbk-bigq">${rbkEsc(q.q)}</div>
        <div class="rbk-row"><button id="rbkNext" class="pomo-btn pomo-btn-secondary">Câu khác</button><button id="rbkMark" class="pomo-btn pomo-btn-primary">Mình đã tìm hiểu câu này</button></div>`;
      document.getElementById("rbkNext").addEventListener("click", () => document.getElementById("rbkAsk").click());
      document.getElementById("rbkMark").addEventListener("click", () => { q.done = true; renderQuestions(); document.getElementById("rbkAsk").click(); });
    });
    document.getElementById("rbkPrompt").addEventListener("click", () => { rbkCopyText(rbkMakePrompt(input.value.trim()), document.getElementById("rbkPrompt"), "Đã chép prompt, hãy dán vào Claude hoặc ChatGPT"); });
    document.getElementById("rbkCopy").addEventListener("click", () => {
      const txt = QS.map((q, i) => (i + 1) + ". [" + RBK_LEVELS[q.lv] + " | " + q.cat + "] " + q.q).join("\n");
      const ok = () => { document.getElementById("rbkCopy").textContent = "Đã chép"; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => {});
      else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) {} document.body.removeChild(ta); }
    });
  }

  function render() {
    const a = A;
    const secKeys = RBK_SECTION_DEFS.map((d) => d[0]);
    const secRows = RBK_SECTION_DEFS.map((d) => {
      const body = a.sec.secs[d[0]];
      return `<tr><td>${rbkEsc(d[1])}</td><td>${body ? "Có (" + rbkWords(body) + " từ)" : '<span class="rbk-miss">Không thấy</span>'}</td><td>${rbkEsc(d[3])}</td></tr>`;
    }).join("");
    const found = secKeys.filter((k) => a.sec.secs[k]).length;
    const techRows = a.techs.length ? a.techs.map((t) => `<tr><td><b>${rbkEsc(t.k)}</b></td><td>${rbkEsc(t.what)}</td><td>${RBK_TECH_FIG[t.k] ? `<button class="pomo-btn pomo-btn-secondary" style="padding:4px 10px;font-size:12px;" data-figgo="${RBK_TECH_FIG[t.k]}">Cách đọc hình</button>` : ""}</td></tr>`).join("") : `<tr><td colspan="3">Chưa nhận diện được phương pháp phân tích nào.</td></tr>`;
    const defRows = Object.keys(a.abb.defs).map((k) => `<tr><td><b>${rbkEsc(k)}</b></td><td>${rbkEsc(a.abb.defs[k])}</td></tr>`).join("");
    const roleHtml = a.roles.map((x, i) => `<div class="rbk-role"><b>${rbkEsc(x.r.name)}</b><div class="rbk-ask">${rbkEsc(x.r.ask)}</div>
      ${x.hits.length ? x.hits.map((s) => `<div class="rbk-hit">"${rbkEsc(s)}"</div>`).join("") : '<div class="rbk-hit rbk-miss">Chưa tìm thấy câu gợi ý trong đoạn đã dán.</div>'}
      <textarea class="rbk-input rbk-mine" rows="2" placeholder="Viết 1 câu bằng lời của bạn..."></textarea></div>`).join("");
    out.innerHTML = `
      <h3 class="rbk-h">Tổng quan</h3>
      <div class="rbk-card"><p><b>Tiêu đề (dòng đầu):</b> ${rbkEsc(a.title || "(không xác định)")}</p>
        <p><b>DOI:</b> ${a.doi ? `<a href="https://doi.org/${encodeURI(a.doi)}" target="_blank" rel="noopener">${rbkEsc(a.doi)}</a>` : "chưa thấy trong đoạn đã dán"} &nbsp; <b>Số từ:</b> ${a.words}</p>
        <p><b>Chủ đề nhận diện:</b> ${a.topics.length ? a.topics.map((t) => chip(t.name)).join(" ") : "chưa nhận diện được chủ đề nào, câu hỏi sẽ thiên về câu hỏi chung"}</p>
        ${a.solvents.length ? `<p><b>Dung môi xuất hiện nhiều:</b> ${a.solvents.map(chip).join(" ")}</p>` : ""}
        ${a.metals.length >= 2 ? `<p><b>Kim loại xuất hiện:</b> ${a.metals.map(chip).join(" ")}</p>` : ""}</div>
      <h3 class="rbk-h">Các phần của bài (tìm thấy ${found}/${secKeys.length})</h3>
      <table class="rbk-tbl"><tr><th>Phần</th><th>Trạng thái</th><th>Đọc để tìm</th></tr>${secRows}</table>
      ${found < 3 ? '<p class="tkb-note">Tìm thấy ít tiêu đề phần. Có thể bài dán không xuống dòng ở tiêu đề, khi đó mỗi tiêu đề (Abstract, Introduction...) nên đứng riêng một dòng.</p>' : ""}
      <h3 class="rbk-h">Phương pháp phân tích trong bài và ý nghĩa</h3>
      <table class="rbk-tbl"><tr><th>Phương pháp</th><th>Dùng để làm gì</th><th>Đọc hình</th></tr>${techRows}</table>
      <h3 class="rbk-h">Từ viết tắt</h3>
      ${defRows ? `<table class="rbk-tbl"><tr><th>Viết tắt</th><th>Nghĩa (suy ra từ bài)</th></tr>${defRows}</table>` : "<p>Không bắt được cặp 'Tên đầy đủ (VIẾT TẮT)' nào.</p>"}
      ${a.abb.undef.length ? `<p><b>Viết tắt không được giải thích trong đoạn đã dán (hãy tự tra):</b> ${a.abb.undef.map(chip).join(" ")}</p>` : ""}
      <h3 class="rbk-h">Tự tổng hợp: tác giả muốn truyền tải điều gì?</h3>
      <p class="tkb-note">Câu trích từ chính bài chỉ để gợi ý. Hãy viết lại từng ý bằng lời của mình.</p>
      ${roleHtml}
      <div id="rbkQBox"></div>`;
    renderQuestions();
    out.querySelectorAll("[data-figgo]").forEach((b) => b.addEventListener("click", () => { figApi.setType(b.getAttribute("data-figgo")); showTab("fig"); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  }

  const fileInput = document.getElementById("rbkFile");
  const fileStatus = document.getElementById("rbkFileStatus");
  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    const parts = [], notes = [];
    const say = (m) => { fileStatus.textContent = m; };
    for (const f of files) {
      const name = f.name.toLowerCase();
      try {
        say("Đang đọc " + f.name + "...");
        let txt = "";
        if (/\.(txt|md)$/.test(name)) txt = await rbkReadFile(f, "text");
        else if (name.endsWith(".docx")) txt = await rbkReadDocx(f);
        else if (name.endsWith(".pdf")) {
          const r = await rbkReadPdf(f, say);
          txt = r.text;
          if (r.truncated) notes.push(f.name + ": mới đọc 60/" + r.total + " trang đầu.");
          if (txt.replace(/\s/g, "").length < 100) {
            txt = "";
            notes.push(f.name + ": PDF gần như không có lớp chữ (có thể là bản scan). Hãy chụp từng trang thành ảnh rồi tải ảnh lên để dùng OCR.");
          }
        } else if (/\.(png|jpe?g|webp|bmp)$/.test(name)) {
          txt = await rbkReadImage(f, say);
          notes.push(f.name + ": đã dùng OCR, hãy đọc lại công thức, chỉ số dưới và dấu tiếng Việt.");
        } else notes.push(f.name + ": định dạng chưa hỗ trợ (nhận TXT, MD, DOCX, PDF, ảnh PNG/JPG).");
        if (txt.trim()) parts.push(txt.trim());
      } catch (e) { notes.push(f.name + ": " + (e && e.message ? e.message : "lỗi không xác định")); }
    }
    if (parts.length) input.value = (input.value.trim() ? input.value.trim() + "\n\n" : "") + parts.join("\n\n");
    say((parts.length ? "Đã thêm " + parts.length + " file vào ô nhập. " : "") + notes.join(" "));
    fileInput.value = "";
  });

  document.getElementById("rbkGo").addEventListener("click", () => {
    const txt = input.value.trim();
    if (txt.length < 200) { out.innerHTML = `<p class="rbk-miss">Hãy dán ít nhất vài đoạn (từ 200 ký tự trở lên) để phân tích.</p>`; return; }
    A = rbkAnalyze(txt);
    QS = rbkPick(rbkBuildPool(A), +document.getElementById("rbkCount").value);
    render();
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("rbkClear").addEventListener("click", () => { input.value = ""; out.innerHTML = ""; A = null; QS = []; });
}

   1) So sánh bản nháp với nguồn bạn dán + tìm lặp + tạo link tìm cụm câu

function lcLatinDominant(t) {
  const letters = (t.match(/\p{L}/gu) || []).length || 1;

  const lookalike = (t.match(/[\u0370-\u03FF\u0400-\u04FF]/g) || []).filter((ch) => LC_HOMO[ch]).length;

function lcAnomalies(raw) {
  const t = String(raw).normalize("NFC").replace(/\r/g, "");

  const show = (i, len) => t.slice(Math.max(0, i - 18), i + len + 18).replace(/[\u200B-\u200D\u2060\uFEFF\u00AD]/g, "[ẩn]").replace(/\s+/g, " ");

    while ((m = r.exec(t))) { c++; if (ex.length < 3) ex.push(show(m.index, m[0].length)); }

  scan(LC_SPACES, "Khoảng trắng đặc biệt (em space, thin space...)", "Đã đổi thành khoảng trắng thường");

    }

  }

}

function lcSentSpans(body) {
  const prot = body.replace(/\b(e\.g|i\.e|et al|Fig|Figs|vs|approx|ca|Eq|Ref|No|Dr|Prof|TS|PGS|ThS|GS)\./gi, (m) => m.slice(0, -1) + "§");

  raw.push([start, prot.length]);

    while (a < b && /\s/.test(body[a])) a++;
    while (b > a && /\s/.test(body[b - 1])) b--;

    const text = body.slice(a, b);
    const toks = lcTokens(text);
    spans.push({ s: a, e: b, text, toks: toks.length, tk: toks.map((x) => x.w), sims: [], ex: null, eff: null });

function lcTokens(text) {
  const out = []; const re = /[\p{L}\p{N}]+/gu; let m;
  while ((m = re.exec(text))) out.push({ w: m[0].toLowerCase(), s: m.index, e: m.index + m[0].length });
  return out;
}

function lcLang(text) {
  const letters = (text.match(/\p{L}/gu) || []).length || 1;
  const vi = (text.match(/[ăâđêôơưàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ]/gi) || []).length;
  return vi / letters > 0.04 ? "vi" : "en";
}

function lcCutRefs(text) {
  const m = text.match(LC_REF_HEAD);
  return m ? text.slice(0, m.index) : text;
}

function lcSplit(text) {
  const p = text.replace(/\r/g, "")
    .replace(/\b(e\.g|i\.e|et al|Fig|Figs|vs|approx|ca|Eq|Ref|No|Dr|Prof)\./gi, "$1§")
    .replace(/([.!?:;])\n+/g, "$1 ")
    .replace(/([^\n])\n(?=[\p{Ll}])/gu, "$1 ")
    .replace(/\n+/g, ". ");
  return p.split(/(?<=[.!?])\s+(?=[\p{Lu}\p{N}\[(“"])/u).map((s) => s.replace(/§/g, ".").replace(/\s+/g, " ").trim()).filter((s) => s.length >= 12);
}

/* ---------- 1. So sánh với nguồn ---------- */
function lcKeySet(tokens, n) {
  const set = new Set();
  for (let i = 0; i + n <= tokens.length; i++) set.add(tokens.slice(i, i + n).map((t) => t.w).join(" "));
  return set;
}

function lcCompare(draftRaw, sources, opts) {
  opts = opts || {};
  let body = lcNorm(draftRaw);
  if (opts.skipRefs) body = lcCutRefs(body);
  const lang = lcLang(body);
  const n = opts.n || (lang === "vi" ? 7 : 5);
  const tk = lcTokens(body);
  const covered = new Array(tk.length).fill(-1);
  sources.forEach((src, si) => {
    const set = lcKeySet(lcTokens(lcNorm(src)), n);
    for (let i = 0; i + n <= tk.length; i++) {
      const key = tk.slice(i, i + n).map((t) => t.w).join(" ");
      if (set.has(key)) for (let j = i; j < i + n; j++) if (covered[j] === -1) covered[j] = si;
    }
  });
  const ranges = [];
  for (let i = 0; i < tk.length; i++) {
    if (covered[i] === -1) continue;
    let j = i;
    while (j + 1 < tk.length && covered[j + 1] === covered[i]) j++;
    ranges.push({ from: i, to: j, si: covered[i], words: j - i + 1, text: body.slice(tk[i].s, tk[j].e) });
    i = j;
  }
  const per = sources.map((_, si) => covered.filter((c) => c === si).length);
  const total = tk.length;
  const hit = covered.filter((c) => c !== -1).length;
  let html = "", pos = 0;
  ranges.forEach((r) => {
    html += rbkEsc(body.slice(pos, tk[r.from].s)) + `<mark class="lc-hl" title="Giống nguồn ${r.si + 1}">` + rbkEsc(r.text) + "</mark>";
    pos = tk[r.to].e;
  });
  html += rbkEsc(body.slice(pos));
  return { lang, n, total, hit, pct: total ? (hit / total) * 100 : 0, per, ranges, html };
}

/* ---------- Tìm lặp trong chính bài ---------- */
function lcRepeats(raw) {
  const body = lcCutRefs(lcNorm(raw));
  const lang = lcLang(body);
  const n = lang === "vi" ? 6 : 5;
  const tk = lcTokens(body);
  const map = new Map();
  for (let i = 0; i + n <= tk.length; i++) {
    const k = tk.slice(i, i + n).map((t) => t.w).join(" ");
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(i);
  }
  const rep = new Array(tk.length).fill(false);
  map.forEach((pos) => { if (pos.length >= 2) pos.forEach((p) => { if (p - pos[0] >= n) for (let j = p; j < p + n; j++) rep[j] = true; }); });
  const phrases = new Map();
  for (let i = 0; i < tk.length; i++) {
    if (!rep[i]) continue;
    let j = i;
    while (j + 1 < tk.length && rep[j + 1]) j++;
    const key = tk.slice(i, j + 1).map((t) => t.w).join(" ");
    phrases.set(key, (phrases.get(key) || 1) + 1);
    i = j;
  }
  const list = Array.from(phrases.entries()).map(([k, c]) => ({ text: k, words: k.split(" ").length, count: c })).sort((a, b) => b.words - a.words).slice(0, 10);
  const seen = new Map();
  lcSplit(body).forEach((s) => { const k = s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); if (k.split(" ").length >= 6) seen.set(k, (seen.get(k) || 0) + 1); });
  const dupSent = Array.from(seen.entries()).filter((e) => e[1] >= 2).map((e) => ({ text: e[0], count: e[1] }));
  const repTokens = rep.filter(Boolean).length;
  return { lang, n, total: tk.length, repTokens, pct: tk.length ? (repTokens / tk.length) * 100 : 0, phrases: list, dupSent };
}

/* ---------- Chọn câu đặc trưng và tạo link tìm cụm chính xác ---------- */
function lcPickPhrases(raw, k) {
  const body = lcCutRefs(lcNorm(raw));
  const sents = lcSplit(body).filter((s) => { const w = rbkWords(s); return w >= 12 && w <= 60; });
  if (!sents.length) return [];
  const score = (s) => {
    const toks = s.match(/[\p{L}\p{N}]+/gu) || [];
    let sc = new Set(toks.map((x) => x.toLowerCase())).size;
    toks.forEach((x) => { if (/\d/.test(x)) sc += 0.5; if (/^\p{Lu}{2,}/u.test(x)) sc += 0.5; if (x.length >= 9) sc += 0.5; });
    return sc;
  };
  const chunks = Math.min(k, sents.length), size = sents.length / chunks, out = [];
  for (let c = 0; c < chunks; c++) {
    const part = sents.slice(Math.floor(c * size), Math.floor((c + 1) * size) || undefined);
    if (!part.length) continue;
    const best = part.slice().sort((a, b) => score(b) - score(a))[0];
    const words = best.split(/\s+/);
    const start = Math.max(0, Math.floor((words.length - 10) / 2));
    const phrase = words.slice(start, start + 10).join(" ").replace(/[“”"]/g, "").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
    const q = encodeURIComponent('"' + phrase + '"');
    out.push({ sentence: best, phrase, scholar: "https://scholar.google.com/scholar?q=" + q, google: "https://www.google.com/search?q=" + q });
  }
  return out;
}

/* ---------- 2. Tài liệu tham khảo ---------- */
function lcExtractRefs(raw) {
  const t = lcNorm(raw);
  const m = t.match(LC_REF_HEAD);
  const body = m ? t.slice(m.index + m[0].length) : t;
  const lines = body.split(/\n/).map((l) => l.trim()).filter(Boolean);
  const numRe = /^(\[\d+\]|\(\d+\)|\d+[.)])\s*\S/;
  const numbered = lines.filter((l) => numRe.test(l)).length >= Math.max(2, lines.length * 0.4);
  const refs = [];
  if (numbered) lines.forEach((l) => { if (numRe.test(l) || !refs.length) refs.push(l); else refs[refs.length - 1] += " " + l; });
  else lines.forEach((l) => refs.push(l));
  return refs.filter((r) => r.length >= 15 || /10\.\d{4,9}\//.test(r)).slice(0, 60);
}

function lcDoiOf(s) {
  const m = s.match(/\b10\.\d{4,9}\/[^\s"<>]+/);
  return m ? m[0].replace(/[.,;:)\]]+$/, "") : "";
}

async function lcFetchJson(url, ms) {
  const c = new AbortController();
  const id = setTimeout(() => c.abort(), ms || 12000);
  try {
    const r = await fetch(url, { signal: c.signal, headers: { Accept: "application/json" } });
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(id); }
}

function lcMeta(m) {
  const a0 = (m.author || [])[0] || {};
  const issued = ((m.issued || {})["date-parts"] || [[]])[0] || [];
  const upd = m["updated-by"] || [];
  return { title: (m.title || [])[0] || "", first: a0.family || a0.name || "", year: issued[0] || "", journal: (m["container-title"] || [])[0] || "",
    updates: upd.map((u) => u.type || u.label || "cập nhật") };
}

/* Đối chiếu dòng trích dẫn với thông tin Crossref: tiêu đề, tác giả đầu, năm */
function lcMatchInfo(line, meta) {
  const L = lcNorm(line).toLowerCase();
  const lt = new Set(lcTokens(L).map((t) => t.w));
  const tt = lcTokens(meta.title || "").map((t) => t.w).filter((w) => w.length >= 4);
  const titleScore = tt.length ? tt.filter((w) => lt.has(w)).length / tt.length : 0;
  const first = meta.first ? lcNorm(meta.first).toLowerCase() : "";
  return { titleScore, author: first ? L.includes(first) : null, year: meta.year ? L.includes(String(meta.year)) : null };
}

async function lcOpenAccess(doi) {
  try {
    const o = await lcFetchJson("https://api.openalex.org/works/doi:" + encodeURI(doi) + "?select=open_access,best_oa_location,title");
    const loc = o.best_oa_location || {};
    const url = loc.pdf_url || loc.landing_page_url || (o.open_access || {}).oa_url || "";
    return { isOa: !!(o.open_access && o.open_access.is_oa), url, version: loc.version || "", license: loc.license || "" };
  } catch (e) { return null; }
}

async function lcCheckRef(line) {
  const res = { line, doi: lcDoiOf(line), exists: null, meta: null, info: null, oa: null, guessed: false, error: "" };
  if (res.doi) {
    try {
      const j = await lcFetchJson("https://api.crossref.org/works/" + encodeURI(res.doi));
      res.exists = true; res.meta = lcMeta(j.message || {});
    } catch (e) {
      if (e.status === 404) {
        try { const h = await lcFetchJson("https://doi.org/api/handles/" + encodeURI(res.doi)); res.exists = h.responseCode === 1 ? "other" : false; }
        catch (e2) { if (e2.status === 404) res.exists = false; else res.error = "Không kiểm tra được doi.org"; }
      } else res.error = "Không kết nối được Crossref";
    }
  } else {
    try {
      const q = line.replace(/^(\[\d+\]|\(\d+\)|\d+[.)])\s*/, "").slice(0, 300);
      const j = await lcFetchJson("https://api.crossref.org/works?rows=1&select=DOI,title,author,issued,container-title&query.bibliographic=" + encodeURIComponent(q));
      const it = ((j.message || {}).items || [])[0];
      if (it) {
        const meta = lcMeta(it); const info = lcMatchInfo(line, meta);
        if (info.titleScore >= 0.6) { res.doi = it.DOI || ""; res.meta = meta; res.exists = true; res.guessed = true; }
      }
    } catch (e) { res.error = "Không kết nối được Crossref"; }
  }
  if (res.meta) res.info = lcMatchInfo(line, res.meta);
  if (res.doi && (res.exists === true || res.exists === "other")) res.oa = await lcOpenAccess(res.doi);
  return res;
}

function lcRefRow(i, r) {
  const badge = (cls, txt) => `<span class="lc-tag lc-${cls}">${rbkEsc(txt)}</span>`;
  const b = [];
  if (r.error) b.push(badge("warn", r.error + ", hãy thử lại"));
  else if (r.doi && !r.guessed) {
    if (r.exists === true) {
      b.push(badge("ok", "DOI có thật"));
      if (r.info) {
        b.push(r.info.titleScore >= 0.6 ? badge("ok", "Tiêu đề khớp") : badge("bad", "Tiêu đề KHÔNG khớp: có thể gắn sai DOI"));
        if (r.info.author === false) b.push(badge("warn", "Không thấy tên tác giả đầu"));
        if (r.info.year === false) b.push(badge("warn", "Năm khác (" + r.meta.year + ")"));
      }
      if (r.meta && r.meta.updates.length) b.push(badge("warn", "Crossref ghi có cập nhật liên quan (" + r.meta.updates.join(", ") + "), hãy mở bài kiểm tra"));
    } else if (r.exists === "other") b.push(badge("warn", "DOI có trên doi.org nhưng không thuộc Crossref (vd. DataCite), chưa đối chiếu được tiêu đề"));
    else if (r.exists === false) b.push(badge("bad", "Không tìm thấy DOI này: có thể gõ sai hoặc không có thật"));
  } else if (r.guessed) {
    b.push(badge("warn", "Không có DOI trong trích dẫn; có bài khớp tiêu đề trên Crossref (DOI " + r.doi + "), bạn cần tự xác nhận"));
  } else b.push(badge("warn", "Không có DOI và không tìm thấy bài khớp trên Crossref. Chưa kết luận là bịa: sách, luận văn, tạp chí trong nước thường không có trên Crossref"));
  let oa = "";
  if (r.oa && r.oa.url) oa = `<a href="${rbkEsc(r.oa.url)}" target="_blank" rel="noopener">Mở bản truy cập mở</a>${r.oa.version ? " (" + rbkEsc(r.oa.version) + ")" : ""}`;
  else if (r.exists === true || r.exists === "other") {
    const q = encodeURIComponent((r.meta && r.meta.title) || r.line.slice(0, 120));
    oa = `Chưa thấy bản mở. Cách hợp pháp: thư viện trường, email tác giả liên hệ, <a href="https://scholar.google.com/scholar?q=${q}" target="_blank" rel="noopener">tìm preprint trên Scholar</a>`;
  }
  const shown = r.line.length > 160 ? r.line.slice(0, 160) + "..." : r.line;
  return `<tr><td>${i + 1}</td><td>${rbkEsc(shown)}${r.meta && r.meta.title ? `<div class="tkb-note" style="margin:4px 0 0;">Crossref: ${rbkEsc(r.meta.title)} (${rbkEsc(r.meta.first)}, ${rbkEsc(String(r.meta.year))})</div>` : ""}</td><td>${r.doi ? rbkEsc(r.doi) : "-"}</td><td>${b.join(" ")}</td><td>${oa}</td></tr>`;
}

/* ---------- 3. Soi văn phong và đề xuất sửa bài ---------- */
const LC_CITE = /\[\d+[^\]]*\]|\([^()]*(19|20)\d{2}[a-z]?[^()]*\)/;
const LC_EN = {
  heavy: /^(moreover|furthermore|additionally|in addition|notably|importantly|in conclusion|overall|in summary|consequently|undoubtedly)(?![\p{L}])/iu,
  filler: /(it is (important|worth) (to note|noting)|plays? an? (crucial|vital|pivotal|key) role|a wide range of|in the realm of|delve[sd]? (into)?|a plethora of|tapestry|has garnered|in today'?s (world|era)|paves? the way|shed light on)/iu,
  vague: /(?<![\p{L}])(significantly|substantially|remarkabl[ey]|excellent|outstanding|superior|much (better|higher|lower)|better|improved|enhanced|greater|higher|lower)(?![\p{L}])/iu,
  absolute: /(?<![\p{L}])(for the first time|first (report|time|ever)|always|never|proves?|undoubtedly|clearly demonstrates?|completely|entirely)(?![\p{L}])/iu,
  needcite: /(has been reported|have been reported|previous (studies|works?|research)|it is (well )?known that|widely used|many studies|numerous studies|has been shown)/iu,
};
const LC_VI = {
  heavy: /^(bên cạnh đó|hơn nữa|ngoài ra|nhìn chung|tóm lại|đáng chú ý là|có thể thấy rằng)(?![\p{L}])/iu,
  filler: /(đóng vai trò (quan trọng|then chốt|thiết yếu)|ngày càng|mang lại nhiều lợi ích|góp phần nâng cao|trong bối cảnh hiện nay|có thể nói rằng|một cách hiệu quả|không chỉ[^.]{0,60}mà còn)/iu,
  vague: /(đáng kể|rất tốt|khá cao|khá thấp|tốt hơn|cao hơn|thấp hơn|cải thiện|vượt trội|hiệu quả cao)/iu,
  absolute: /(đầu tiên trên thế giới|lần đầu tiên|chắc chắn|hoàn toàn|tuyệt đối|luôn luôn|không bao giờ|chứng minh được rằng)/iu,
  needcite: /(nhiều nghiên cứu|các nghiên cứu (trước|gần đây)|đã được (chứng minh|báo cáo)|được sử dụng rộng rãi|theo các nghiên cứu)/iu,
};
const LC_TAGS = {
  absolute: ["Khẳng định tuyệt đối", 3, "Chỉ khẳng định tuyệt đối khi đã tổng quan tài liệu đầy đủ. Nếu chưa, nêu phạm vi bạn đã tìm hoặc bỏ cụm này."],
  vague: ["Nhận định định lượng thiếu số liệu", 3, "Thay bằng số liệu: tăng hoặc giảm bao nhiêu, so với mẫu đối chứng nào, sai số bao nhiêu."],
  nocite: ["Cần trích dẫn", 3, "Thêm trích dẫn cho khẳng định này, hoặc nói rõ đây là kết quả của chính bạn."],
  long: ["Câu dài", 2, "Tách thành 2 hoặc 3 câu, mỗi câu một ý."],
  filler: ["Cụm sáo rỗng", 2, "Bỏ cụm này và nêu thẳng điều cụ thể bạn muốn nói."],
  heavy: ["Liên từ mở đầu lặp", 1, "Nhiều câu mở bằng liên từ giống nhau. Bỏ bớt hoặc gộp ý để logic tự nối các câu."],
};

function lcStyle(raw) {
  const t = lcNorm(raw);
  const lang = lcLang(t);
  const body = lcCutRefs(t);
  const R = lang === "vi" ? LC_VI : LC_EN;
  const sents = lcSplit(body);
  const lens = sents.map((s) => rbkWords(s));
  const longT = lang === "vi" ? 50 : 40;
  let flagged = [], heavyCount = 0;
  sents.forEach((s, i) => {
    const tags = [];
    const hasNum = /\d/.test(s);
    if (lens[i] > longT) tags.push("long");
    if (R.filler.test(s)) tags.push("filler");
    if (R.absolute.test(s)) tags.push("absolute");
    if (R.vague.test(s) && !hasNum) tags.push("vague");
    if (R.needcite.test(s) && !LC_CITE.test(s)) tags.push("nocite");
    if (R.heavy.test(s)) { heavyCount++; tags.push("heavy"); }
    if (tags.length) flagged.push({ s, tags });
  });
  if (heavyCount < 3) flagged = flagged.map((f) => ({ s: f.s, tags: f.tags.filter((x) => x !== "heavy") })).filter((f) => f.tags.length);
  const count = {};
  flagged.forEach((f) => f.tags.forEach((x) => { count[x] = (count[x] || 0) + 1; }));
  const mean = lens.length ? lens.reduce((a, b) => a + b, 0) / lens.length : 0;
  const sd = lens.length ? Math.sqrt(lens.reduce((a, b) => a + (b - mean) * (b - mean), 0) / lens.length) : 0;
  const dashes = (body.match(/—/g) || []).length + (body.match(/(?<!\d)–|–(?!\d)/g) || []).length;
  const ab = rbkAbbrevs(body, new Set());
  flagged.sort((a, b) => b.tags.length - a.tags.length || Math.max(...b.tags.map((x) => LC_TAGS[x][1])) - Math.max(...a.tags.map((x) => LC_TAGS[x][1])));
  const fixes = [];
  const add = (sev, txt) => fixes.push({ sev, txt });
  if (count.absolute) add(3, "Xử lý " + count.absolute + " câu có khẳng định tuyệt đối (vd. lần đầu tiên, chắc chắn, chứng minh được rằng).");
  if (ab.undef.length) add(3, "Định nghĩa các từ viết tắt ở lần xuất hiện đầu tiên: " + ab.undef.slice(0, 8).join(", ") + ".");
  if (count.vague) add(3, "Bổ sung số liệu cho " + count.vague + " câu nhận định định lượng (tốt hơn, cải thiện, đáng kể...).");
  if (count.nocite) add(3, "Thêm trích dẫn cho " + count.nocite + " câu nêu 'nhiều nghiên cứu', 'đã được báo cáo'.");
  if (count.long) add(2, "Tách " + count.long + " câu quá dài.");
  if (count.filler) add(2, "Bỏ hoặc viết lại " + count.filler + " câu có cụm sáo rỗng.");
  if (count.heavy) add(1, "Giảm liên từ mở đầu: " + count.heavy + " câu mở bằng liên từ giống nhau.");
  return { lang, sentences: sents.length, words: rbkWords(body), mean, cv: mean ? sd / mean : 0, dashes, undef: ab.undef, flagged, count, fixes };
}

/* ---------- 4. So phong cách với bài cũ của chính bạn ----------
   Thông tin hỗ trợ giải trình, KHÔNG phải bằng chứng và KHÔNG kết luận có dùng AI hay không.
   So các thói quen viết (độ dài câu, từ vựng, dấu câu, tần suất các từ thông dụng) giữa bản nháp và bài cũ. */
const LC_SIG_METRICS = [
  ["mean", "Độ dài câu trung bình (từ)", (v) => v.toFixed(1)],
  ["cv", "Độ đều của độ dài câu (hệ số biến thiên)", (v) => v.toFixed(2)],
  ["shortR", "Tỉ lệ câu ngắn", (v) => v.toFixed(0) + "%"],
  ["longR", "Tỉ lệ câu dài", (v) => v.toFixed(0) + "%"],
  ["mattr", "Độ phong phú từ vựng (MATTR)", (v) => v.toFixed(3)],
  ["avgLen", "Độ dài trung bình của từ (ký tự)", (v) => v.toFixed(2)],
  ["comma", "Dấu phẩy trên 100 từ", (v) => v.toFixed(1)],
  ["semi", "Dấu chấm phẩy trên 100 từ", (v) => v.toFixed(2)],
  ["paren", "Dấu ngoặc đơn trên 100 từ", (v) => v.toFixed(2)],
  ["dash", "Gạch ngang dài trên 100 từ", (v) => v.toFixed(2)],
  ["quote", "Dấu ngoặc kép trên 100 từ", (v) => v.toFixed(2)],
  ["digits", "Tỉ lệ từ có chữ số", (v) => v.toFixed(1) + "%"],
  ["heavy", "Tỉ lệ câu mở bằng liên từ", (v) => v.toFixed(0) + "%"],
];

function lcSigFeatures(raw) {
  const t = lcCutRefs(lcNorm(raw));
  const lang = lcLang(t);
  const toks = lcTokens(t).map((x) => x.w);
  const words = toks.length;
  const sents = lcSplit(t);
  const lens = sents.map((s) => rbkWords(s));
  const n = lens.length || 1;
  const mean = lens.reduce((a, b) => a + b, 0) / n;
  const sd = Math.sqrt(lens.reduce((a, b) => a + (b - mean) * (b - mean), 0) / n);
  const sT = lang === "vi" ? 14 : 10, lT = lang === "vi" ? 35 : 25;
  const w = Math.min(100, Math.floor(words / 2));
  let tt = 0, cnt = 0;
  for (let i = 0; w >= 20 && i + w <= words; i += 10) { tt += new Set(toks.slice(i, i + w)).size / w; cnt++; }
  const per100 = (re) => ((t.match(re) || []).length / (words || 1)) * 100;
  const R = lang === "vi" ? LC_VI : LC_EN;
  const freq = new Map();
  toks.forEach((x) => freq.set(x, (freq.get(x) || 0) + 1));
  return { lang, words, sentences: sents.length, mean, cv: mean ? sd / mean : 0,
    shortR: (lens.filter((l) => l <= sT).length / n) * 100, longR: (lens.filter((l) => l > lT).length / n) * 100,
    mattr: cnt ? tt / cnt : 0, avgLen: words ? toks.reduce((a, x) => a + x.length, 0) / words : 0,
    comma: per100(/[,，]/g), semi: per100(/;/g), paren: per100(/\(/g), dash: per100(/—|(?<!\d)–|–(?!\d)/g), quote: per100(/["“”]/g),
    digits: (toks.filter((x) => /\d/.test(x)).length / (words || 1)) * 100,
    heavy: (sents.filter((s) => R.heavy.test(s)).length / n) * 100, freq };
}

function lcSigStatus(vals, d, many) {
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  let inR;
  if (many) { const tol = Math.max(0.15 * (hi - lo), 0.05 * Math.abs(mean), 1e-6); inR = d >= lo - tol && d <= hi + tol; }
  else inR = Math.abs(d - mean) <= 0.25 * Math.max(Math.abs(mean), 1e-6);
  return { mean, lo, hi, inR, dir: d > hi ? "cao hơn" : d < lo ? "thấp hơn" : "" };
}

function lcSigCompare(refTexts, draftText) {
  const refs = refTexts.map(lcSigFeatures), d = lcSigFeatures(draftText);
  const all = refs.concat([d]);
  const warns = [];
  const mismatch = all.some((f) => f.lang !== d.lang);
  if (mismatch) warns.push("Các văn bản không cùng ngôn ngữ, nên không so được.");
  all.forEach((f, i) => {
    const name = i < refs.length ? "Bài cũ " + (i + 1) : "Bản nháp";
    if (f.words < 150) warns.push(name + " chỉ có " + f.words + " từ, quá ngắn để so (nên từ 300 từ trở lên).");
    else if (f.words < 300) warns.push(name + " có " + f.words + " từ, hơi ngắn nên độ tin cậy thấp (nên từ 300 từ trở lên).");
  });
  const pooled = new Map();
  all.forEach((f) => f.freq.forEach((c, w) => pooled.set(w, (pooled.get(w) || 0) + c / (f.words || 1))));
  const vocab = Array.from(pooled.entries()).sort((a, b) => b[1] - a[1]).slice(0, 50).map((e) => e[0]);
  const rel = all.map((f) => vocab.map((w) => (f.freq.get(w) || 0) / (f.words || 1)));
  const many = refs.length >= 2;
  let dist, method;
  if (many) {
    method = "delta";
    const mu = vocab.map((_, k) => rel.reduce((a, r) => a + r[k], 0) / rel.length);
    const sg = vocab.map((_, k) => Math.sqrt(rel.reduce((a, r) => a + (r[k] - mu[k]) * (r[k] - mu[k]), 0) / rel.length));
    const z = rel.map((r) => r.map((v, k) => (sg[k] > 1e-9 ? (v - mu[k]) / sg[k] : 0)));
    dist = (i, j) => z[i].reduce((a, v, k) => a + Math.abs(v - z[j][k]), 0) / vocab.length;
  } else {
    method = "cosine";
    const sq = rel.map((r) => r.map(Math.sqrt));
    dist = (i, j) => {
      let dot = 0, na = 0, nb = 0;
      for (let k = 0; k < sq[i].length; k++) { dot += sq[i][k] * sq[j][k]; na += sq[i][k] * sq[i][k]; nb += sq[j][k] * sq[j][k]; }
      return na && nb ? 1 - dot / Math.sqrt(na * nb) : 1;
    };
  }
  const n = refs.length;
  const dDraft = refs.map((_, i) => dist(i, n));
  const dOwn = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) dOwn.push(dist(i, j));
  const meanDraft = dDraft.reduce((a, b) => a + b, 0) / dDraft.length;
  const maxOwn = dOwn.length ? Math.max(...dOwn) : null;
  const ratio = maxOwn ? meanDraft / maxOwn : null;
  /* Ngưỡng tự đặt, thận trọng: chỉ nói "xa hơn rõ rệt" khi có từ 3 bài cũ (ít nhất 3 cặp để ước lượng mức dao động) */
  let level = null;
  if (ratio !== null) level = ratio <= 1.3 ? "inside" : (ratio > 1.6 && refs.length >= 3 ? "outside" : "unclear");
  const rows = LC_SIG_METRICS.map(([k, label, fmt]) => {
    const st = lcSigStatus(refs.map((f) => f[k]), d[k], many);
    return { k, label, fmt, draft: d[k], st };
  }).filter((r) => !(r.k === "mattr" && (!d.mattr || refs.some((f) => !f.mattr))));
  return { refs, d, warns, mismatch, method, dDraft, dOwn, meanDraft, maxOwn, ratio, level, many, rows, outCount: rows.filter((r) => !r.st.inR).length };
}

function lcSigHtml(r) {
  const warn = r.warns.length ? `<div class="rbk-card"><h4>Lưu ý về dữ liệu</h4><ul>${r.warns.map((w) => `<li>${rbkEsc(w)}</li>`).join("")}</ul></div>` : "";
  if (r.mismatch) return warn;
  const f3 = (v) => v.toFixed(3);
  const verdict = r.level === null
    ? `Chưa có mốc so sánh vì chỉ có một bài cũ. Hãy thêm ít nhất 2 bài cũ (tốt nhất từ 3 bài) để ngăn biết mức dao động bình thường giữa các bài của chính bạn.`
    : r.level === "inside" ? `Phong cách bản nháp nằm trong mức dao động giữa các bài cũ của bạn.`
      : r.level === "unclear" ? `Phong cách bản nháp hơi khác các bài cũ, nhưng chưa đủ cơ sở để nói là khác thường${r.refs.length < 3 ? " (mới có " + r.refs.length + " bài cũ nên mốc dao động chưa vững, hãy thêm bài cũ)" : ""}.`
        : `Phong cách bản nháp xa hơn rõ rệt mức dao động thường thấy giữa các bài cũ của bạn. Điều này có thể do đổi thể loại, chủ đề, thời điểm viết, hoặc bài có sự chỉnh sửa của người khác. Hãy chuẩn bị giải thích bối cảnh.`;
  const metricName = r.method === "delta" ? "Khoảng cách theo tần suất các từ thông dụng (Burrows' Delta, càng thấp càng giống)" : "Khoảng cách theo tần suất các từ thông dụng (1 trừ độ tương đồng cosine, càng thấp càng giống)";
  const rows = r.rows.map((x) => {
    const tag = x.st.inR ? `<span class="lc-tag lc-ok">Gần với bài cũ</span>` : `<span class="lc-tag lc-warn">Khác bài cũ${x.st.dir ? ": " + x.st.dir : ""}</span>`;
    const range = r.many ? x.fmt(x.st.lo) + " đến " + x.fmt(x.st.hi) : x.fmt(x.st.mean);
    return `<tr><td>${rbkEsc(x.label)}</td><td><b>${x.fmt(x.draft)}</b></td><td>${range}</td><td>${tag}</td></tr>`;
  }).join("");
  return `${warn}
    <h3 class="rbk-h">Kết quả so phong cách</h3>
    <div class="rbk-card"><p><b>${rbkEsc(verdict)}</b></p>
      <p>${rbkEsc(metricName)}: bản nháp so với từng bài cũ = ${r.dDraft.map(f3).join(" ; ")} (trung bình ${f3(r.meanDraft)}).${r.dOwn.length ? " Giữa các bài cũ với nhau = " + r.dOwn.map(f3).join(" ; ") + "." : ""}</p>
      ${r.ratio !== null ? `<p>Tỉ số = khoảng cách của bản nháp / khoảng cách lớn nhất giữa các bài cũ = <b>${r.ratio.toFixed(2)}</b>. Quy ước của ngăn: từ 1,3 trở xuống là trong dao động; trên 1,6 (và có từ 3 bài cũ) là xa hơn rõ rệt; ở giữa là chưa đủ cơ sở. Các ngưỡng này do người thiết kế tự đặt từ thử nghiệm trên dữ liệu giả lập, <b>chưa kiểm chứng trên bài thật</b>.</p>` : ""}
      <p>${r.rows.length - r.outCount}/${r.rows.length} thói quen viết gần với bài cũ.</p></div>
    <table class="rbk-tbl"><tr><th>Thói quen viết</th><th>Bản nháp</th><th>${r.many ? "Bài cũ (nhỏ nhất đến lớn nhất)" : "Bài cũ"}</th><th>So sánh</th></tr>${rows}</table>
    <div class="rbk-card"><h4>Cách hiểu kết quả</h4><ul>
      <li>Đây là thông tin hỗ trợ giải trình, <b>không phải bằng chứng</b> ai viết bài và <b>không kết luận bài có dùng AI hay không</b>.</li>
      <li>Thể loại, chủ đề, ngôn ngữ, thời điểm viết, việc được người khác góp ý hay chỉnh sửa đều làm phong cách thay đổi.</li>
      <li>Những người cùng lớp, cùng giảng viên hoặc cùng học một giáo trình có thể có phong cách gần nhau, nên "giống" cũng không chứng minh là bạn viết.</li>
      <li>Văn bản ngắn (dưới khoảng 300 từ) cho kết quả kém ổn định.</li>
      <li>Nếu cần giải trình, hãy dùng kèm hồ sơ quá trình viết (tab 5), lịch sử phiên bản của Word hoặc Google Docs, ghi chú đọc tài liệu và khả năng tự giải thích nội dung bài.</li></ul></div>`;
}

/* ---------- 5. Hồ sơ quá trình viết ---------- */
function lcLoadVers() { try { return JSON.parse(localStorage.getItem(LC_VER_KEY) || "[]"); } catch (e) { return []; } }
function lcSaveVers(v) { try { localStorage.setItem(LC_VER_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }

async function lcHash(str) {
  try {
    if (!(window.crypto && window.crypto.subtle)) return "";
    const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return ""; }
}

function lcDelta(prev, cur) {
  const a = lcTokens(lcNorm(prev)).map((t) => t.w), b = lcTokens(lcNorm(cur)).map((t) => t.w);
  const cnt = new Map();
  a.forEach((w) => cnt.set(w, (cnt.get(w) || 0) + 1));
  let common = 0;
  b.forEach((w) => { const c = cnt.get(w) || 0; if (c > 0) { common++; cnt.set(w, c - 1); } });
  const sa = lcKeySet(a.map((w) => ({ w })), 4), sb = lcKeySet(b.map((w) => ({ w })), 4);
  let inter = 0; sa.forEach((k) => { if (sb.has(k)) inter++; });
  const uni = sa.size + sb.size - inter;
  return { added: b.length - common, removed: a.length - common, sim: uni ? (inter / uni) * 100 : (a.length === b.length ? 100 : 0) };
}

function lcReportText(name, vers) {
  const f = (ts) => new Date(ts).toLocaleString("vi-VN");
  const lines = ["BÁO CÁO QUÁ TRÌNH VIẾT (do người dùng tự tạo trên trình duyệt)", "Tên tài liệu: " + (name || "(chưa đặt tên)"), "Số phiên bản: " + vers.length, ""];
  vers.forEach((v, i) => {
    let d = "bản đầu";
    if (i > 0) { const x = lcDelta(vers[i - 1].text, v.text); d = "+" + x.added + " từ, -" + x.removed + " từ, giống bản trước " + Math.round(x.sim) + "%"; }
    lines.push("#" + (i + 1) + " | " + f(v.ts) + " | " + (v.label || "(không nhãn)") + " | " + rbkWords(v.text) + " từ | " + d + (v.hash ? " | mã " + v.hash.slice(0, 12) : ""));
  });
  lines.push("", "LƯU Ý: Báo cáo này do chính người dùng tạo trên máy của mình, không có bên thứ ba xác thực. Nên kèm lịch sử phiên bản của Word hoặc Google Docs, ghi chú đọc tài liệu và khả năng giải thích trực tiếp nội dung bài.");
  return lines.join("\n");
}

/* ---------- Tải file vào ô nhập ---------- */
async function lcFilesToText(files, say) {
  const parts = [], notes = [];
  for (const f of files) {
    const name = f.name.toLowerCase();
    try {
      say("Đang đọc " + f.name + "...");
      let txt = "";
      if (/\.(txt|md)$/.test(name)) txt = await rbkReadFile(f, "text");
      else if (name.endsWith(".docx")) txt = await rbkReadDocx(f);
      else if (name.endsWith(".pdf")) {
        const r = await rbkReadPdf(f, say);
        txt = r.text;
        if (r.truncated) notes.push(f.name + ": mới đọc 60/" + r.total + " trang đầu.");
        if (txt.replace(/\s/g, "").length < 100) { txt = ""; notes.push(f.name + ": PDF gần như không có lớp chữ (có thể là bản scan)."); }
      } else notes.push(f.name + ": định dạng chưa hỗ trợ (nhận TXT, MD, DOCX, PDF).");
      if (txt.trim()) parts.push(txt.trim());
    } catch (e) { notes.push(f.name + ": " + (e && e.message ? e.message : "lỗi không xác định")); }
  }
  return { parts, notes };
}
function lcAttachUpload(inputEl, textarea, statusEl) {
  inputEl.addEventListener("change", async () => {
    const files = Array.from(inputEl.files || []);
    if (!files.length) return;
    const say = (m) => { statusEl.textContent = m; };
    const r = await lcFilesToText(files, say);
    if (r.parts.length) textarea.value = (textarea.value.trim() ? textarea.value.trim() + "\n\n" : "") + r.parts.join("\n\n");
    say((r.parts.length ? "Đã thêm " + r.parts.length + " file vào ô nhập. " : "") + r.notes.join(" "));
    inputEl.value = "";
  });
}

      <p class="ctdt-meta"><b>Cách dùng:</b> (1) Dán 1 đến 5 <b>bài cũ của chính bạn</b>: những bài bạn tự viết trước đây, càng dài và càng cùng thể loại càng tốt (nên từ 300 từ). Nên dán từ 2 bài trở lên để ngăn biết mức dao động bình thường giữa các bài của bạn. (2) Dán <b>Bản nháp (Đoạn tài liệu bạn đang viết)</b>. (3) Bấm "So phong cách". Ngăn so các thói quen viết: độ dài câu, từ vựng, dấu câu, tần suất các từ thông dụng. Kết quả chỉ là thông tin hỗ trợ giải trình, <b>không phải bằng chứng</b> ai viết bài và không kết luận bài có dùng AI hay không. Văn bản chỉ xử lý trên máy bạn.</p>
      <div id="lcSigRefs"></div>
      <div class="rbk-row"><button id="lcSigAdd" class="pomo-btn pomo-btn-secondary">Thêm bài cũ</button></div>
      <b>Bản nháp (Đoạn tài liệu bạn đang viết)</b>
      <textarea id="lcSigDraft" class="rbk-input" rows="8" placeholder="Dán bản nháp (đoạn tài liệu bạn đang viết) cần so với bài cũ..."></textarea>
      ${lcUploadRow()}
      <div class="rbk-row"><button id="lcSigGo" class="pomo-btn pomo-btn-primary">So phong cách</button></div>
      <div id="lcSigOut"></div>
    </div>

    <div id="lcP-log" style="display:none;">
      <p class="ctdt-meta"><b>Cách dùng:</b> (1) Đặt tên tài liệu và nhãn cho phiên bản. (2) Dán bản đang viết hiện tại và bấm "Lưu phiên bản". Làm lại sau mỗi lần sửa lớn. (3) Khi cần giải trình, bấm "Xuất báo cáo". Ngăn lưu các phiên bản bài viết theo thời gian ngay trong trình duyệt của bạn (không gửi đi đâu). Ngăn tính phần thay đổi giữa các bản và xuất báo cáo quá trình viết. Báo cáo này do bạn tự tạo, không có bên thứ ba xác thực, nên hãy kèm lịch sử phiên bản của Word hoặc Google Docs. Xóa dữ liệu trình duyệt sẽ mất các bản đã lưu.</p>
      <div class="rbk-row"><label>Tên tài liệu: <input id="lcLogName" class="rbk-input" style="width:260px;" placeholder="Báo cáo đề tài..."></label>
        <label>Nhãn phiên bản: <input id="lcLogLabel" class="rbk-input" style="width:220px;" placeholder="Nháp phần mở đầu"></label></div>
      <textarea id="lcLogText" class="rbk-input" rows="9" placeholder="Dán bản nháp hiện tại (đoạn tài liệu bạn đang viết)..."></textarea>
      ${lcUploadRow()}
      <div class="rbk-row"><button id="lcSaveVer" class="pomo-btn pomo-btn-primary">Lưu phiên bản</button>
        <button id="lcExport" class="pomo-btn pomo-btn-secondary">Xuất báo cáo (.txt)</button>
        <button id="lcClearVers" class="pomo-btn pomo-btn-secondary">Xóa tất cả</button><span id="lcLogMsg" class="rbk-prog"></span></div>
      <div id="lcVerList"></div>
    </div>

    <div id="lcP-guide" style="display:none;">${LC_GUIDE_HTML}</div>

    <div class="rbk-card"><h4>Ủng hộ tự nguyện</h4>
      <p>Ngăn này miễn phí. Nếu thấy hữu ích, bạn có thể ủng hộ khoảng 1.000 đến 5.000 đồng cho mỗi lần dùng bằng mã QR bên dưới. Hoàn toàn không bắt buộc và không ảnh hưởng tới kết quả.</p>
      <img id="lcQr" src="${LC_QR_SRC}" alt="Mã QR ủng hộ" title="Bấm để phóng to hoặc thu nhỏ" style="width:100%;max-width:260px;border-radius:8px;cursor:zoom-in;display:block;" onclick="var big=this.style.maxWidth==='440px';this.style.maxWidth=big?'260px':'440px';this.style.cursor=big?'zoom-in':'zoom-out';" onerror="this.style.display='none';document.getElementById('lcQrMiss').style.display='';">
      <p class="tkb-note">Mở ứng dụng ngân hàng, chọn quét mã QR. Bấm vào mã để phóng to cho dễ quét.</p>
      <p id="lcQrMiss" class="tkb-note" style="display:none;">(Chưa gắn mã QR.)</p></div>
  </div>`;
}

function initIntegrity() {
  const $ = (id) => document.getElementById(id);
  if (!$("lcP-compare")) return;
  const panels = ["start", "compare", "refs", "style", "sig", "log", "guide"];
  const showTab = (t) => {
    document.querySelectorAll("[data-lc-tab]").forEach((b) => b.classList.toggle("rbk-tab-on", b.getAttribute("data-lc-tab") === t));
    panels.forEach((p) => { $("lcP-" + p).style.display = p === t ? "" : "none"; });
  };
  document.querySelectorAll("[data-lc-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.getAttribute("data-lc-tab"))));

  // gắn nút tải file cho các ô đã có sẵn
  const attachAll = (root) => root.querySelectorAll('input[type="file"][id^="lcUp"]').forEach((inp) => {
    if (inp.dataset.bound) return; inp.dataset.bound = "1";
    const ta = inp.closest(".rbk-row").previousElementSibling;
    if (ta && ta.tagName === "TEXTAREA") lcAttachUpload(inp, ta, $(inp.id + "s"));
  });
  attachAll(document);

  // --- Tab 1 ---
  let srcCount = 0;
  const addSource = () => {
    if (srcCount >= 5) return;
    srcCount++;
    const div = document.createElement("div");
    div.innerHTML = `<b>Nguồn đối chiếu ${srcCount} (Tài liệu bạn đã đọc hoặc muốn so sánh)</b><textarea class="rbk-input lc-src" rows="6" placeholder="Dán nội dung nguồn đối chiếu ${srcCount} (bài báo, giáo trình, chương sách...)"></textarea>${lcUploadRow()}`;
    $("lcSources").appendChild(div);
    attachAll(div);
  };
  addSource();
  $("lcAddSrc").addEventListener("click", addSource);

  // --- Ví dụ mẫu ---
  const loadSample = () => {
    $("lcDraft").value = LC_SAMPLE_DRAFT;
    const first = document.querySelector(".lc-src");
    if (first) first.value = LC_SAMPLE_SRC;
    showTab("compare");
    $("lcGoCompare").click();
  };
  $("lcSampleBtn").addEventListener("click", loadSample);
  $("lcSampleBtn2").addEventListener("click", loadSample);

  // --- So sánh theo câu, tô màu, loại trừ có lý do ---
  let cmp = null;
  const openAct = (i) => {
    const sp = cmp.spans[i], e = lcEff(sp, cmp.srcEx), box = $("lcAct");
    if (!e.level && !sp.ex) return;
    box.style.display = "";
    const head = `<div class="rbk-who">Câu này giống nguồn đối chiếu ${cmp.srcNames[e.src >= 0 ? e.src : 0].idx}: ${Math.round(e.sim * 100)}% (${LC_LEVEL_NAME[e.level] || "đã loại trừ"})</div><div class="rbk-hit">${rbkEsc(sp.text)}</div>`;
    if (sp.ex) {
      box.innerHTML = head + `<p>Đã loại trừ. Lý do: <b>${rbkEsc(sp.ex.reason)}</b>${sp.ex.note ? ". " + rbkEsc(sp.ex.note) : ""}</p><div class="rbk-row"><button id="lcUndo" class="pomo-btn pomo-btn-primary">Đánh dấu lại là trùng lặp</button><button id="lcCloseAct" class="pomo-btn pomo-btn-secondary">Đóng</button></div>`;
      $("lcUndo").addEventListener("click", () => { sp.ex = null; box.style.display = "none"; refreshCompare(); });
    } else {
      box.innerHTML = head + `<div class="rbk-row"><label>Lý do loại trừ: <select id="lcReason">${LC_REASONS.map((r) => `<option>${rbkEsc(r)}</option>`).join("")}</select></label>
        <input id="lcReasonNote" class="rbk-input" style="width:260px;" placeholder="Mô tả thêm (không bắt buộc)"></div>
        <div class="rbk-row"><button id="lcDoEx" class="pomo-btn pomo-btn-primary">Loại trừ câu này</button><button id="lcCloseAct" class="pomo-btn pomo-btn-secondary">Đóng</button></div>`;
      $("lcDoEx").addEventListener("click", () => { sp.ex = { reason: $("lcReason").value, note: $("lcReasonNote").value.trim() }; box.style.display = "none"; refreshCompare(); });
    }
    $("lcCloseAct").addEventListener("click", () => { box.style.display = "none"; });
  };
  const refreshCompare = () => {
    const sm = lcSummary(cmp);
    const srcRows = cmp.srcNames.map((s, i) => {
      const n = cmp.spans.filter((sp) => sp.sims[i] >= 0.5).length;
      return `<tr><td>Nguồn đối chiếu ${s.idx}</td><td>${rbkEsc(s.name)}</td><td>${n}</td><td><label><input type="checkbox" data-srcex="${i}" ${cmp.srcEx[i] ? "checked" : ""}> Loại nguồn này khỏi phép tính</label></td></tr>`;
    }).join("");
    $("lcSum").innerHTML = `<div class="rbk-card">
      <p><b>Điểm trùng lặp: ${sm.pct.toFixed(1)}%</b> (số từ thuộc các câu giống nguồn từ 50% trở lên, chia tổng số từ của bản nháp: ${sm.flaggedW}/${cmp.total} từ).</p>
      <p>Mức cao (đỏ): ${sm.lv[3]} câu | Trung bình (cam): ${sm.lv[2]} câu | Thấp (vàng): ${sm.lv[1]} câu | Đã loại trừ (xanh): ${sm.exN} câu</p>
      <p class="tkb-note">Điểm này chỉ nói về mức giống với những nguồn bạn đã dán và thay đổi theo thao tác loại trừ của bạn, nên không phải kết luận về đạo văn. Giống nhau không đồng nghĩa với đạo văn: trích dẫn đúng, thuật ngữ và quy trình chuẩn cũng bị tính.</p></div>
      <table class="rbk-tbl"><tr><th>Nguồn</th><th>Nội dung (đầu nguồn)</th><th>Số câu giống từ 50%</th><th>Tùy chọn</th></tr>${srcRows}</table>
      <p class="tkb-note">Ví dụ nên loại nguồn khỏi phép tính: nguồn đó là tài liệu do chính bạn viết trước đây.</p>`;
    $("lcText").innerHTML = lcColoredHtml(cmp, "ui");
    $("lcSum").querySelectorAll("[data-srcex]").forEach((c) => c.addEventListener("change", () => { cmp.srcEx[+c.getAttribute("data-srcex")] = c.checked; refreshCompare(); }));
  };
  const buildCompare = () => {
    $("lcOutCompare").innerHTML = `<h3 class="rbk-h">Kết quả so sánh</h3><div id="lcAnomBox"></div><div id="lcSum"></div>
      <h3 class="rbk-h">Bản nháp (câu giống được tô màu)</h3>${LC_LEGEND_HTML}
      <p class="tkb-note"><b>Bấm vào câu được tô màu</b> để xem chi tiết và loại trừ (ví dụ câu đã ghi nguồn trích dẫn). Điểm tính lại ngay.</p>
      <div id="lcAct" class="rbk-panel" style="display:none;"></div>
      <div class="lc-text" id="lcText"></div>
      <div class="rbk-row"><button id="lcDlHtml" class="pomo-btn pomo-btn-secondary">Tải báo cáo chi tiết (.html)</button><button id="lcDlTxt" class="pomo-btn pomo-btn-secondary">Tải báo cáo tóm tắt (.txt)</button></div>
      <h3 class="rbk-h">Các đoạn giống liền mạch dài nhất</h3><div id="lcTop"></div>`;
    $("lcAnomBox").innerHTML = lcAnomHtml(cmp.anom);
    $("lcText").addEventListener("click", (e) => {
      const el = e.target.closest ? e.target.closest(".lc-s") : null;
      if (el) openAct(+el.getAttribute("data-si"));
    });
    $("lcDlHtml").addEventListener("click", () => lcDownload("bao-cao-chi-tiet.html", "text/html", lcReportHtml(cmp, lcSummary(cmp))));
    $("lcDlTxt").addEventListener("click", () => lcDownload("bao-cao-tom-tat.txt", "text/plain", lcReportTxt(cmp, lcSummary(cmp))));
    const top = cmp.ranges.slice().sort((a, b) => b.words - a.words).slice(0, 10);
    $("lcTop").innerHTML = top.length ? `<ol class="rbk-qs">${top.map((x) => `<li><b>${x.words} từ, nguồn đối chiếu ${cmp.srcNames[x.si].idx}:</b> ${rbkEsc(x.text)}</li>`).join("")}</ol>` : "<p>Không có đoạn nào giống liền mạch từ " + cmp.n + " từ trở lên.</p>";
  };
  $("lcGoCompare").addEventListener("click", () => {
    const draftRaw = $("lcDraft").value;
    const out = $("lcOutCompare");
    const pairs = Array.from(document.querySelectorAll(".lc-src")).map((t, i) => ({ v: t.value, i })).filter((x) => x.v.trim());
    if (draftRaw.trim().length < 100) { out.innerHTML = '<p class="rbk-miss">Hãy dán Bản nháp (đoạn tài liệu bạn đang viết), ít nhất vài câu.</p>'; return; }
    if (!pairs.length) { out.innerHTML = '<p class="rbk-miss">Hãy dán ít nhất một Nguồn đối chiếu (tài liệu bạn đã đọc hoặc muốn so sánh).</p>'; return; }
    const skipRefs = $("lcSkipRefs").checked;
    const anom = [];
    lcAnomalies(draftRaw).forEach((a) => anom.push(Object.assign({ where: "Bản nháp" }, a)));
    pairs.forEach((p) => lcAnomalies(p.v).forEach((a) => anom.push(Object.assign({ where: "Nguồn đối chiếu " + (p.i + 1) }, a))));
    let body = lcNorm(draftRaw);
    if (skipRefs) body = lcCutRefs(body);
    const lang = lcLang(body);
    const spans = lcSentSpans(body);
    if (!spans.length) { out.innerHTML = '<p class="rbk-miss">Chưa tách được câu nào từ bản nháp. Hãy kiểm tra lại nội dung đã dán.</p>'; return; }
    lcSentSims(spans, pairs.map((p) => p.v), lang);
    const ex = lcCompare(draftRaw, pairs.map((p) => p.v), { skipRefs });
    cmp = { body, spans, lang, total: lcTokens(body).length, anom, ranges: ex.ranges, n: ex.n,
      srcNames: pairs.map((p) => ({ idx: p.i + 1, name: lcNorm(p.v).replace(/\s+/g, " ").trim().slice(0, 70) + "..." })), srcEx: pairs.map(() => false) };
    buildCompare();
    refreshCompare();
  });

  $("lcGoAnom").addEventListener("click", () => {
    const list = [];
    lcAnomalies($("lcDraft").value).forEach((a) => list.push(Object.assign({ where: "Bản nháp" }, a)));
    Array.from(document.querySelectorAll(".lc-src")).forEach((t, i) => lcAnomalies(t.value).forEach((a) => list.push(Object.assign({ where: "Nguồn đối chiếu " + (i + 1) }, a))));
    $("lcOutAnom").innerHTML = (list.length ? lcAnomHtml(list) : '<div class="rbk-card"><p><b>Không thấy ký tự bất thường</b> trong văn bản đã dán.</p>') +
      (list.length ? "" : '<p class="tkb-note">Ngăn chỉ kiểm tra ký tự trong văn bản. Ngăn không thấy được định dạng như chữ trắng trên nền trắng hay cỡ chữ siêu nhỏ, vì khi dán vào, định dạng đã mất.</p></div>');
  });

  $("lcGoRepeat").addEventListener("click", () => {
    const draft = $("lcDraft").value;
    const out = $("lcOutRepeat");
    if (draft.trim().length < 100) { out.innerHTML = '<p class="rbk-miss">Hãy dán bản nháp (ít nhất vài câu).</p>'; return; }
    const rp = lcRepeats(draft);
    const links = lcPickPhrases(draft, 10);
    out.innerHTML = `<h3 class="rbk-h">Lặp trong chính bài</h3>
      <div class="rbk-card"><p>${rp.pct.toFixed(1)}% số từ nằm trong cụm lặp lại từ ${rp.n} từ liên tiếp trở lên.</p>
      ${rp.phrases.length ? `<p><b>Cụm lặp dài nhất:</b></p><ol class="rbk-qs">${rp.phrases.map((x) => `<li>${rbkEsc(x.text)} (${x.words} từ)</li>`).join("")}</ol>` : "<p>Không thấy cụm lặp đáng kể.</p>"}
      ${rp.dupSent.length ? `<p><b>Câu xuất hiện nhiều lần:</b></p><ul>${rp.dupSent.map((x) => `<li>${rbkEsc(x.text)} (${x.count} lần)</li>`).join("")}</ul>` : ""}</div>
      <h3 class="rbk-h">Link tìm nguồn nghi trùng (bạn tự bấm kiểm tra)</h3>
      <p class="tkb-note">Ngăn chọn các câu đặc trưng và tạo sẵn link tìm cụm chính xác trên Google Scholar và Google. Bấm link sẽ mở trang tìm kiếm, ngăn không gửi gì đi.</p>
      ${links.length ? `<ol class="rbk-qs">${links.map((x) => `<li>${rbkEsc(x.phrase)} &nbsp; <a href="${x.scholar}" target="_blank" rel="noopener">Scholar</a> | <a href="${x.google}" target="_blank" rel="noopener">Google</a></li>`).join("")}</ol>` : "<p>Chưa chọn được câu phù hợp (bài quá ngắn).</p>"}`;
  });

  // --- Tab 2 ---
  let stopRefs = false;
  $("lcStopRefs").addEventListener("click", () => { stopRefs = true; });
  $("lcGoRefs").addEventListener("click", async () => {
    const refs = lcExtractRefs($("lcRefs").value);
    const out = $("lcOutRefs"), prog = $("lcRefProg");
    if (!refs.length) { out.innerHTML = '<p class="rbk-miss">Chưa thấy tài liệu tham khảo nào. Hãy dán danh mục, mỗi tài liệu một dòng.</p>'; return; }
    stopRefs = false;
    const rows = [];
    out.innerHTML = `<div id="lcRefSum"></div><table class="rbk-tbl"><tr><th>#</th><th>Tài liệu</th><th>DOI</th><th>Kết quả</th><th>Bản đọc hợp pháp</th></tr><tbody id="lcRefBody"></tbody></table>`;
    const stat = { n: 0, ok: 0, bad: 0, nodoi: 0, oa: 0 };
    for (let i = 0; i < refs.length; i++) {
      if (stopRefs) { prog.textContent = "Đã dừng ở tài liệu " + i + "/" + refs.length + "."; break; }
      prog.textContent = "Đang kiểm tra " + (i + 1) + "/" + refs.length + "...";
      let r;
      try { r = await lcCheckRef(refs[i]); } catch (e) { r = { line: refs[i], doi: "", exists: null, meta: null, info: null, oa: null, guessed: false, error: "Lỗi không xác định" }; }
      rows.push(lcRefRow(i, r));
      stat.n++;
      if (r.exists === true && !r.guessed && r.info && r.info.titleScore >= 0.6) stat.ok++;
      if (r.exists === false || (r.exists === true && !r.guessed && r.info && r.info.titleScore < 0.6)) stat.bad++;
      if (!r.doi || r.guessed) stat.nodoi++;
      if (r.oa && r.oa.url) stat.oa++;
      $("lcRefBody").innerHTML = rows.join("");
      $("lcRefSum").innerHTML = `<div class="rbk-card"><p>Đã kiểm tra <b>${stat.n}</b> tài liệu: <b>${stat.ok}</b> khớp DOI và tiêu đề, <b>${stat.bad}</b> cần xem lại (DOI không tìm thấy hoặc tiêu đề không khớp), <b>${stat.nodoi}</b> không có DOI, <b>${stat.oa}</b> có bản truy cập mở.</p>
        <p class="tkb-note">Không tìm thấy trên Crossref chưa chắc là bịa. Hãy tự mở nguồn để xác nhận.</p></div>`;
      await new Promise((res) => setTimeout(res, 120));
    }
    if (!stopRefs) prog.textContent = "Xong.";
  });

  // --- Tab 3 ---
  $("lcGoStyle").addEventListener("click", () => {
    const txt = $("lcStyleText").value;
    const out = $("lcOutStyle");
    if (txt.trim().length < 150) { out.innerHTML = '<p class="rbk-miss">Hãy dán đoạn văn dài hơn (ít nhất vài câu).</p>'; return; }
    const r = lcStyle(txt);
    const tagHtml = (k) => `<span class="lc-tag lc-${LC_TAGS[k][1] >= 3 ? "bad" : LC_TAGS[k][1] === 2 ? "warn" : "info"}">${rbkEsc(LC_TAGS[k][0])}</span>`;
    out.innerHTML = `<h3 class="rbk-h">Thống kê</h3>
      <div class="rbk-card"><p>${r.lang === "vi" ? "Tiếng Việt" : "Tiếng Anh"} | ${r.sentences} câu | ${r.words} từ | trung bình ${r.mean.toFixed(1)} từ mỗi câu | độ đều của độ dài câu (hệ số biến thiên) ${r.cv.toFixed(2)} | ${r.dashes} dấu gạch ngang dài</p>
      <p class="tkb-note">Chỉ là thông tin tham khảo. Word tự đổi gạch nối thành gạch dài, và nhiều người viết thật cũng dùng. Không dùng các chỉ số này để kết luận ai viết bài.</p></div>
      <h3 class="rbk-h">Đề xuất sửa bài (ưu tiên từ trên xuống)</h3>
